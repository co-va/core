<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/ui/v2/v2.css">
  <link rel="stylesheet" href="/ui/note/note.css">
</head>
<body>
  <div class="v2-app" data-v2-app>
    <div class="v2-app__stage">
      <div class="v2-front" data-v2-front>
        <section class="v2-z" data-v2-z>
          <main id="fixture">
            <div id="owner-host"></div>
            <div id="y-host"></div>
            <div id="compact-y-host" style="width:338px;overflow:hidden"></div>
            <div id="day-host"></div>
            <div id="live-y-host"></div>
          </main>
        </section>
      </div>
    </div>
  </div>
  <pre id="result">pending</pre>

  <script type="module">
    const result = document.querySelector('#result');
    const wait = (ms = 0) => new Promise((resolve) => setTimeout(resolve, ms));
    const assert = (condition, message) => {
      if (!condition) throw new Error(message);
    };

    try {
      const {
        NOTE_DEFAULT_COLOR,
        focusNoteReels,
        initNoteReels,
        noteReels,
      } = await import('/ui/note/index.js');
      const {
        createNote,
        getNote,
        hydrateNotesFromServer,
      } = await import('/core/note/index.js');
      const { hydrateProfileFromServer } = await import('/core/profile/data.js');
      const {
        cancelRecord,
        deleteRecord,
        hydrateRecordStateFromServer,
      } = await import('/core/record/index.js');
      const {
        hydrateEventsFromServer,
        removeEvent,
      } = await import('/core/event/index.js');
      const { hydrateDaysFromServer } = await import('/core/day/index.js');
      const { configureWorkplaceSource } = await import('/core/workplace-time.js');
      const { configureTimeUsageSource } = await import('/core/time/index.js');
      const { createJournalNoteFlow } = await import('/journal/note-create.js');
      const {
        noteTargetLabel,
        noteVisibleForWorkplace,
      } = await import('/journal/note-target.js');
      const { openNoteView } = await import('/journal/note-view.js');
      const { openEventView } = await import('/journal/event-view.js');
      const { renderJournalDay } = await import('/journal/день.js');

      const day = '2026-10-23';
      const workplace = {
        id: 'workplace-db',
        key: 'w1',
        name: 'Тестовое пространство',
        from: '09:00',
        to: '18:00',
        color: '#9AAE85',
        indicatorColor: '#9AAE85',
      };
      const record = {
        id: 'record-browser',
        date: day,
        workplaceId: 'w1',
        from: '10:00',
        to: '11:00',
        person: { id: 'person-browser', uei: 'UEI-BROWSER', name: 'Анна', surname: 'Тест' },
        procedures: [],
        products: [],
      };
      const event = {
        id: 'event-browser',
        date: day,
        workplaceId: 'w1',
        from: '12:00',
        to: '12:30',
        title: 'Событие браузера',
        description: '',
        color: '#777A7D',
        ownerType: 'tenant',
        ownerId: 'tenant-browser',
        context: { scope: 'professional' },
      };

      hydrateProfileFromServer({
        id: 'profile-browser',
        key: 'profile',
        name: 'Профиль',
        phones: [],
        telegrams: [],
        emails: [],
      });
      hydrateRecordStateFromServer({ records: [record], recordEvents: [] });
      hydrateEventsFromServer([event]);
      hydrateNotesFromServer([]);
      configureWorkplaceSource(() => [workplace]);
      configureTimeUsageSource(() => []);

      const compactHost = document.querySelector('#compact-y-host');
      compactHost.innerHTML = noteReels(Array.from({ length: 5 }, (_, index) => ({
        id: `compact-${index}`,
        ownerType: 'profile',
        ownerId: 'profile-browser',
        date: day,
        title: `N${index + 1}`,
        text: 'Коротко',
        from: '',
        to: '',
        targetType: '',
        targetId: '',
        color: index === 4 ? '#AADDCC' : NOTE_DEFAULT_COLOR,
      })));
      const compactCards = [...compactHost.querySelectorAll('[data-note-reel]')];
      assert(compactCards.length === 5, 'Compact Y did not render five Notes');
      const hostRect = compactHost.getBoundingClientRect();
      compactCards.slice(0, 4).forEach((card, index) => {
        const rect = card.getBoundingClientRect();
        assert(rect.width >= 70 && rect.width <= 80, `Note ${index + 1} width is outside 70-80px`);
        assert(rect.height >= 70 && rect.height <= 80, `Note ${index + 1} height is outside 70-80px`);
        assert(rect.right <= hostRect.right + 0.5, `Note ${index + 1} is not fully visible`);
      });
      const fifthRect = compactCards[4].getBoundingClientRect();
      assert(fifthRect.left < hostRect.right && fifthRect.right > hostRect.right,
        'Fifth Note is not partially visible at the right edge');
      assert(compactCards[4].style.getPropertyValue('--note-color') === '#AADDCC',
        'Custom Note color is not applied to compact card');

      let createdNote = null;
      let committed = 0;
      const ownerHost = document.querySelector('#owner-host');
      const fakeOwner = {
        render({ body = '', action = null } = {}) {
          ownerHost.innerHTML = `<section data-browser-note-owner-body>${body}</section>${action
            ? `<button type="button" ${action.data || ''}>${action.label || ''}</button>`
            : ''}`;
          return {
            body: ownerHost.querySelector('[data-browser-note-owner-body]'),
            action: action?.data ? ownerHost.querySelector(`[${action.data}]`) : null,
          };
        },
        commit() { committed += 1; },
      };

      createJournalNoteFlow({
        owner: fakeOwner,
        date: day,
        onCreated: (note) => { createdNote = note; },
      });
      const createForm = ownerHost.querySelector('[data-note-create-form]');
      assert(createForm, 'Note create form was not rendered');
      createForm.querySelector('[name="title"]').value = 'Browser Note';
      createForm.querySelector('[name="text"]').value = 'Создано в браузере';
      createForm.querySelector('[name="from"]').value = '10:00';
      createForm.querySelector('[name="target"]').value = 'record:record-browser';
      ownerHost.querySelector('[data-note-create]').click();
      await wait(20);

      assert(createdNote?.id, 'Note was not created from Journal Note flow');
      assert(createdNote.ownerType === 'profile', 'Note ownerType is not profile');
      assert(createdNote.ownerId === 'profile-browser', 'Note ownerId is not Profile.id');
      assert(createdNote.targetType === 'record' && createdNote.targetId === record.id, 'Record attachment was not saved');
      assert(createdNote.context?.targetSnapshot?.id === record.id, 'Record historical snapshot was not stored');
      assert(createdNote.color === NOTE_DEFAULT_COLOR, 'Default Note color changed');
      assert(committed === 1, 'Journal creation owner did not commit Note flow');

      const yHost = document.querySelector('#y-host');
      yHost.innerHTML = noteReels([
        { id: 'day-first', date: day, title: 'Дневная', from: '', to: '', color: NOTE_DEFAULT_COLOR },
        createdNote,
      ], {
        activeTime: '10:00',
        relatedIds: [createdNote.id],
        targetLabel: noteTargetLabel,
      });
      let openedId = '';
      initNoteReels(yHost, { onOpen: ({ noteId }) => { openedId = noteId; } });
      const reel = yHost.querySelector(`[data-note-reel="${createdNote.id}"]`);
      assert(reel, 'Created Note is absent from Y');
      assert(yHost.querySelector('[data-note-reel]') === reel, 'Active Note did not move to first Y position');
      assert(reel.classList.contains('is-time-active'), 'Y did not highlight Note at its time point');
      assert(reel.classList.contains('is-related'), 'Y did not visually mark related Note');
      reel.click();
      assert(openedId === createdNote.id, 'Y Note click did not resolve the Note id');
      focusNoteReels(yHost, [createdNote.id]);
      assert(reel.classList.contains('is-related'), 'Y focus lost related state');

      let noteLayer = openNoteView(createdNote.id);
      assert(noteLayer?.querySelector('[data-note-view-host]'), 'Shared Q Note read view did not open');
      assert(noteLayer.querySelector('[data-note-view-edit]'), 'Read Q has no Edit action');
      assert(!noteLayer.querySelector('[data-note-edit-delete]'), 'Delete leaked into Note read mode');
      noteLayer.querySelector('[data-note-view-edit]').click();
      await wait();
      let editForm = noteLayer.querySelector('[data-note-edit-form]');
      assert(editForm, 'Note edit Q did not open');
      editForm.querySelector('[name="text"]').value = 'Изменено в браузере';
      editForm.dispatchEvent(new Event('input', { bubbles: true }));
      editForm.requestSubmit();
      await wait(20);
      assert(getNote(createdNote.id)?.id === createdNote.id, 'Edit changed Note id');
      assert(getNote(createdNote.id)?.text === 'Изменено в браузере', 'Edit did not save Note text');
      assert(noteLayer.querySelector('[data-note-view-edit]'), 'Save did not return to Note read view');
      noteLayer.v2Close?.();
      await wait();

      const cancelled = cancelRecord(record.id);
      assert(cancelled?.status === 'cancelled', 'Record cancellation fixture failed');
      assert(getNote(createdNote.id)?.targetType === 'record' && getNote(createdNote.id)?.targetId === record.id,
        'Record cancellation cleared Note target');
      noteLayer = openNoteView(createdNote.id);
      assert(noteLayer?.textContent.includes('Запись отменена'), 'Cancelled Record marker is missing in Note read Q');
      noteLayer.v2Close?.();
      await wait();

      assert(deleteRecord(record.id) === true, 'Record deletion fixture failed');
      const afterDelete = getNote(createdNote.id);
      assert(afterDelete?.targetType === 'record' && afterDelete?.targetId === record.id,
        'Record deletion cleared Note historical target');
      assert(afterDelete?.context?.targetSnapshot?.id === record.id,
        'Record deletion did not retain Note target snapshot');
      assert(noteTargetLabel(afterDelete).includes('Запись удалена'), 'Deleted Record historical label is missing');
      assert(noteVisibleForWorkplace(afterDelete, 'w1') === true, 'Deleted Record Note lost original workplace context');
      assert(noteVisibleForWorkplace(afterDelete, 'other-workplace') === false, 'Deleted Record Note became globally unattached');

      noteLayer = openNoteView(createdNote.id);
      assert(noteLayer?.textContent.includes('Запись удалена'), 'Deleted Record marker is missing in Note read Q');
      noteLayer.querySelector('[data-note-view-edit]').click();
      await wait();
      editForm = noteLayer.querySelector('[data-note-edit-form]');
      assert(editForm?.querySelector('[name="target"]')?.value === `record:${record.id}`,
        'Edit Q dropped deleted Record target value');
      assert(editForm?.textContent.includes('Запись удалена'), 'Edit selector does not identify deleted Record');
      editForm.querySelector('[name="text"]').value = 'Изменено после удаления записи';
      editForm.dispatchEvent(new Event('input', { bubbles: true }));
      editForm.requestSubmit();
      await wait(20);
      assert(getNote(createdNote.id)?.targetType === 'record' && getNote(createdNote.id)?.targetId === record.id,
        'Saving Note after Record deletion cleared historical target');
      assert(getNote(createdNote.id)?.text === 'Изменено после удаления записи',
        'Saving Note after Record deletion did not preserve ordinary edits');
      noteLayer.querySelector('[data-note-view-edit]').click();
      await wait();
      assert(noteLayer.querySelector('[data-note-edit-delete]'), 'Delete is absent from Note edit mode');
      noteLayer.querySelector('[data-note-edit-delete]').click();
      await wait(20);
      assert(getNote(createdNote.id) === null, 'Delete did not remove Note');

      hydrateEventsFromServer([event]);
      const eventNote = createNote({
        id: 'event-note-browser',
        ownerType: 'profile',
        ownerId: 'profile-browser',
        date: day,
        targetType: 'event',
        targetId: event.id,
        title: 'Связь с событием',
      });
      assert(eventNote, 'Event Note fixture was not created');
      let focusRequest = null;
      window.addEventListener('book:journal-note-focus-request', (domEvent) => {
        focusRequest = domEvent.detail;
      }, { once: true });
      const eventLayer = openEventView(event.id);
      const eventNotesAction = eventLayer?.querySelector('[data-event-notes]');
      assert(eventNotesAction, 'Event read view did not expose Notes action');
      eventNotesAction.click();
      await wait();
      assert(focusRequest?.targetType === 'event' && focusRequest?.targetId === event.id,
        'Event Notes action did not request Y focus');
      eventLayer?.v2Close?.();

      hydrateEventsFromServer([event]);
      removeEvent(event.id);
      assert(getNote(eventNote.id)?.id === eventNote.id, 'Deleting Event deleted Note');

      hydrateNotesFromServer([{
        id: 'day-off-note',
        ownerType: 'profile',
        ownerId: 'profile-browser',
        date: day,
        title: 'Заметка выходного дня',
        text: '',
        from: '',
        to: '',
        targetType: '',
        targetId: '',
        color: NOTE_DEFAULT_COLOR,
      }]);
      hydrateDaysFromServer([]);
      configureTimeUsageSource(() => []);
      const dayHost = document.querySelector('#day-host');
      const disposeDayOff = renderJournalDay(dayHost, {
        date: new Date(`${day}T12:00:00`),
        workplaceId: 'w1',
      });
      assert(dayHost.querySelector('[data-note-reel="day-off-note"]'), 'Y did not render Note on a day without working time');
      assert(dayHost.textContent.includes('Выходной день'), 'Day-off Timeline state disappeared when Y is present');
      assert(!dayHost.querySelector('[data-time-usage="day-off-note"]'), 'Note leaked into Timeline time usage');
      disposeDayOff?.();

      hydrateEventsFromServer([event]);
      hydrateNotesFromServer([{
        id: 'time-note-browser',
        ownerType: 'profile',
        ownerId: 'profile-browser',
        date: day,
        title: 'Временная заметка',
        text: '',
        from: '12:00',
        to: '',
        targetType: '',
        targetId: '',
        color: NOTE_DEFAULT_COLOR,
      }]);
      hydrateDaysFromServer([{ date: day, workplaceId: 'w1', from: '09:00', to: '18:00' }]);
      configureTimeUsageSource(({ date, workplaceId }) => (
        date === day && workplaceId === 'w1'
          ? [{ ...event, type: 'event', rigidity: 'soft', sourceId: event.id }]
          : []
      ));
      const disposeTimeContext = renderJournalDay(dayHost, {
        date: new Date(`${day}T12:00:00`),
        workplaceId: 'w1',
      });
      assert(dayHost.querySelectorAll('[data-time-usage]').length === 1, 'Note changed Timeline usage count');
      const eventUsage = dayHost.querySelector(`[data-journal-usage="${event.id}"]`);
      assert(eventUsage, 'Browser Event usage is absent from Timeline');
      eventUsage.click();
      await wait(20);
      assert(dayHost.querySelector('[data-note-reel="time-note-browser"]')?.classList.contains('is-time-active'),
        'Y did not highlight Note from selected Journal time context');
      disposeTimeContext?.();

      const OriginalDate = window.Date;
      const originalSetTimeout = window.setTimeout.bind(window);
      const originalClearTimeout = window.clearTimeout.bind(window);
      let fakeNow = new OriginalDate(2026, 9, 23, 10, 0, 30).getTime();
      let liveTickIntercepted = false;
      class FakeDate extends OriginalDate {
        constructor(...args) {
          super(...(args.length ? args : [fakeNow]));
        }
        static now() { return fakeNow; }
      }
      window.Date = FakeDate;
      window.setTimeout = (callback, delay = 0, ...args) => {
        if (!liveTickIntercepted && Number(delay) > 1000) {
          liveTickIntercepted = true;
          return originalSetTimeout(() => {
            fakeNow += 60000;
            callback(...args);
          }, 20);
        }
        return originalSetTimeout(callback, delay, ...args);
      };
      window.clearTimeout = (timer) => originalClearTimeout(timer);

      try {
        hydrateNotesFromServer([
          {
            id: 'live-old', ownerType: 'profile', ownerId: 'profile-browser', date: day,
            title: 'Сейчас', text: '', from: '10:00', to: '10:00', targetType: '', targetId: '', color: NOTE_DEFAULT_COLOR,
          },
          {
            id: 'live-next', ownerType: 'profile', ownerId: 'profile-browser', date: day,
            title: 'Следующая', text: '', from: '10:01', to: '10:01', targetType: '', targetId: '', color: NOTE_DEFAULT_COLOR,
          },
        ]);
        hydrateDaysFromServer([{ date: day, workplaceId: 'w1', from: '09:00', to: '18:00' }]);
        configureTimeUsageSource(() => []);
        const liveHost = document.querySelector('#live-y-host');
        const disposeLive = renderJournalDay(liveHost, {
          date: new FakeDate(`${day}T12:00:00`),
          workplaceId: 'w1',
        });
        const firstBefore = liveHost.querySelector('[data-note-reel]');
        assert(firstBefore?.dataset.noteReel === 'live-old' && firstBefore.classList.contains('is-time-active'),
          'Live Y did not start with the currently active Note first');
        await wait(80);
        const firstAfter = liveHost.querySelector('[data-note-reel]');
        assert(liveTickIntercepted, 'Journal live-time refresh was not scheduled');
        assert(firstAfter?.dataset.noteReel === 'live-next', 'Y did not reorder automatically at the next Note time');
        assert(firstAfter.classList.contains('is-time-active'), 'Newly current Note was not highlighted automatically');
        assert(!liveHost.querySelector('[data-note-reel="live-old"]')?.classList.contains('is-time-active'),
          'Expired Note remained highlighted after live time advanced');
        disposeLive?.();
      } finally {
        window.Date = OriginalDate;
        window.setTimeout = originalSetTimeout;
        window.clearTimeout = originalClearTimeout;
      }

      result.textContent = 'Note Y browser runtime passed';
      document.documentElement.dataset.noteYRuntime = 'pass';
    } catch (error) {
      result.textContent = String(error?.stack || error?.message || error);
      document.documentElement.dataset.noteYRuntime = 'fail';
    }
  </script>
</body>
</html>
