<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/ui/page/page.css"><link rel="stylesheet" href="/ui/buttons/buttons.css"><link rel="stylesheet" href="/ui/inputs/inputs.css"><link rel="stylesheet" href="/ui/selectors/selectors.css"><link rel="stylesheet" href="/ui/settings/settings.css"><link rel="stylesheet" href="/ui/lists/list-entry.css"><link rel="stylesheet" href="/ui/accordion/accordion.css"><link rel="stylesheet" href="/ui/modals/modal.css"><link rel="stylesheet" href="/ui/v2/v2.css">
</head><body><div id="app"></div><pre id="result">pending</pre>
<script type="module">
const failures=[]; let stage='boot';
const mark=v=>{stage=v;document.documentElement.dataset.transferRuntimeStage=v;};
const ok=(v,message)=>{if(!v)failures.push(stage+': '+message)};
window.addEventListener('error',e=>failures.push(stage+': '+e.message));
window.addEventListener('unhandledrejection',e=>failures.push(stage+': '+String(e.reason?.message||e.reason)));
const wait=()=>new Promise(r=>setTimeout(r,30));
async function until(fn){for(let i=0;i<70;i++){if(fn())return;await wait()}throw Error(stage+': timed out')}
const fields={name:'Имя',phone:'Телефон',uei:'UEI',transferId:'ID переноса',externalId:'ID источника',sourceKey:'Ключ строки'};
const row={domain:'people',sheet:'Данные',row:2,sourceKey:'row-1',values:{name:'Пример',phone:'79990000000'},reason:'Телефон уже принадлежит другому имени'};
let commits=0;
const nativeFetch=window.fetch.bind(window);
window.fetch=async(url,options)=>{
 if(!String(url).includes('/data-transfer/'))return nativeFetch(url,options);
 const path=String(url).split('/').pop();
 let value;
 if(path==='inspect')value={fields,domainFields:{people:['name','phone','uei']},domains:{people:'Люди'},sheets:[{name:'Данные',headers:['Имя','Телефон'],count:1,domain:'people',columns:{name:0,phone:1}}]};
 else if(path==='check')value={preview:true,transferred:0,unchanged:0,failed:1,domains:{people:{label:'Люди',transferred:0,unchanged:0,failed:1}},rows:[row]};
 else if(path==='commit'){commits++;value={preview:false,transferred:1,unchanged:0,failed:0,domains:{people:{label:'Люди',transferred:1,unchanged:0,failed:0}},rows:[{...row,reason:'',transferId:'stable-test-id',status:'saved'}]};}
 else return new Response('',{status:400});
 return new Response(JSON.stringify(value),{status:200,headers:{'Content-Type':'application/json'}});
};
const nativeClick=HTMLInputElement.prototype.click;
HTMLInputElement.prototype.click=function(){if(this.type!=='file')return nativeClick.call(this);Object.defineProperty(this,'files',{configurable:true,value:[new File(['Имя;Телефон\nПример;79990000000'],'people.csv',{type:'text/csv'})]});this.dispatchEvent(new Event('change',{bubbles:true}));};
try{
 mark('imports');const [{render},{v2Shell,v2Header}]=await Promise.all([import('/settings/data-transfer/data-transfer.js'),import('/ui/ui.js')]);
 document.querySelector('#app').innerHTML=v2Shell({header:v2Header({b:'Перенос данных'}),className:'v2-app--workspace',body:'<section class="v2-workspace-surface" id="transfer-root"></section>'});
 const root=document.querySelector('#transfer-root');render(root);
 mark('upload');root.querySelector('[data-transfer-next]').click();await until(()=>root.querySelector('[data-sheet-domain]'));
 ok(root.textContent.includes('Источник'),'source is missing');
 ok(root.querySelectorAll('[data-column]').length>0,'column mapping is missing');
 root.querySelector('[data-accordion-trigger]').click();ok(root.querySelector('[data-accordion-trigger]').getAttribute('aria-expanded')==='true','mapping does not expand');
 mark('check');await until(()=>!root.querySelector('[data-transfer-next]').disabled);root.querySelector('[data-transfer-next]').click();await until(()=>root.querySelector('.ui-data-table'));
 ok(root.textContent.includes(row.reason),'concrete reason is missing');ok(root.querySelector('th').textContent.includes('Данные'),'table headers missing');
 mark('sort');root.querySelector('[data-table-sort="row"]').click();ok(root.querySelector('th[aria-sort="ascending"] [data-table-sort="row"]'),'sorting failed');
 mark('commit');await until(()=>!root.querySelector('[data-transfer-next]').disabled);root.querySelector('[data-transfer-next]').click();await until(()=>commits===1&&root.textContent.includes('Результат'));
 await until(()=>!root.querySelector('[data-transfer-next]').disabled);
 ok(root.querySelector('[data-transfer-next]').textContent==='Загрузить','next action did not reset');
 root.querySelector('[data-transfer-only-errors]').click();ok(root.textContent.includes('stable-test-id'),'stable ID is missing');
 ok(root.querySelector('.ui-data-table').scrollWidth>=root.querySelector('.ui-data-table').clientWidth,'table must own horizontal scroll');
 mark('finished');
}catch(error){failures.push(String(error.stack||error));}
HTMLInputElement.prototype.click=nativeClick;
document.documentElement.dataset.transferRuntime=failures.length?'fail':'pass';
document.querySelector('#result').textContent=failures.length?failures.join('\n'):'PASS: transfer upload, mapping, partial reasons, sorting, commit and stable ID';
</script></body></html>
