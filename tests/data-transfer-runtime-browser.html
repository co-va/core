<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/ui/page/page.css"><link rel="stylesheet" href="/ui/buttons/buttons.css"><link rel="stylesheet" href="/ui/inputs/inputs.css"><link rel="stylesheet" href="/ui/selectors/selectors.css"><link rel="stylesheet" href="/ui/settings/settings.css"><link rel="stylesheet" href="/ui/modals/modal.css"><link rel="stylesheet" href="/ui/v2/v2.css">
</head><body><div id="app"></div><pre id="result">pending</pre><script type="module">
const failures=[];let stage='boot',scenario='standard',cancelled=false,committed=false,lastCommit;
const mark=value=>{stage=value;document.documentElement.dataset.transferRuntimeStage=value;};
const ok=(value,message)=>{if(!value)failures.push(stage+': '+message);};
window.addEventListener('error',event=>failures.push(event.message));window.addEventListener('unhandledrejection',event=>failures.push(String(event.reason)));
const wait=()=>new Promise(resolve=>setTimeout(resolve,30));async function until(fn){for(let n=0;n<100;n++){if(fn())return;await wait();}throw Error(stage+': timed out');}
const fields={name:'Имя',phone:'Телефон',material:'Материал / товар',quantity:'Количество',amount:'Сумма оплаты'};
const nativeFetch=window.fetch.bind(window);
window.fetch=async(url,options)=>{
 if(!String(url).includes('/data-transfer/'))return nativeFetch(url,options);
 const path=String(url).split('/').pop(),body=JSON.parse(options.body);let result;
 if(path==='sessions')result=committed?[{id:'session-one',filename:'standard.xlsx',source:'Файл',status:cancelled?'cancelled':'completed',transferred:1,failed:1,createdAt:'2026-10-20T12:00:00Z'}]:[];
 else if(path==='cancel'){ok(body.sessionId==='session-one','wrong session cancellation');cancelled=true;result={cancelled:true};}
 else if(path==='inspect')result={fields,sheets:[{name:'Данные',headers:scenario==='standard'?['Материал / товар','Количество']:['Старое имя','Старый телефон'],standard:scenario==='standard',count:2,columns:scenario==='standard'?{material:0,quantity:1}:{}}]};
 else if(path==='check'||path==='commit'){
  if(path==='commit'){lastCommit=body;committed=true;}
  const rows=scenario==='standard'?[1,2].map(i=>({domain:'consumables',sheet:'Данные',row:i+1,sourceKey:'fact-'+i,values:{material:'Материал '+i,quantity:1},reason:(body.withoutProcedureFacts||[]).includes('fact-'+i)?'':'Не указана процедура для расходника.'})):[{domain:'people',sheet:'Данные',row:2,sourceKey:'person',values:{name:'Пример',phone:'79990000000'},reason:''}];
  const failed=rows.filter(row=>row.reason).length;result={preview:path==='check',transferred:rows.length-failed,unchanged:0,failed,domains:{},rows};
 }else return new Response('',{status:400});
 return new Response(JSON.stringify(result),{headers:{'Content-Type':'application/json'}});
};
const nativeClick=HTMLInputElement.prototype.click;
HTMLInputElement.prototype.click=function(){if(this.type!=='file')return nativeClick.call(this);Object.defineProperty(this,'files',{configurable:true,value:[new File(['Имя;Телефон\nПример;79990000000'],'standard.csv',{type:'text/csv'})]});this.dispatchEvent(new Event('change',{bubbles:true}));};
try{
 const [{render},{v2Shell,v2Header}]=await Promise.all([import('/settings/data-transfer/data-transfer.js'),import('/ui/ui.js')]);
 document.querySelector('#app').innerHTML=v2Shell({header:v2Header({b:'Перенос данных'}),className:'v2-app--workspace',body:'<section id="transfer-root" class="v2-workspace-surface"></section>'});const root=document.querySelector('#transfer-root');render(root);
 const ready=()=>!root.querySelector('[data-transfer-next]').disabled;
 mark('standard automatic');root.querySelector('[data-transfer-next]').click();await until(()=>root.querySelectorAll('[data-fact-without-procedure]').length===2);
 ok(!root.querySelector('select'),'standard file must not require column matching');ok(!root.querySelector('[data-sheet-without-procedure]'),'sheet-wide permission must not exist');
 mark('per-fact permission');await until(ready);root.querySelector('[data-fact-without-procedure="fact-1"]').click();await until(()=>root.querySelector('[data-fact-without-procedure="fact-1"]')?.getAttribute('aria-pressed')==='true');
 ok(root.querySelector('[data-fact-without-procedure="fact-2"]').getAttribute('aria-pressed')==='false','permission leaked to second fact');
 mark('sorting');root.querySelector('[data-table-sort="row"]').click();ok(root.querySelector('th[aria-sort="ascending"] [data-table-sort="row"]'),'sorting missing');
 mark('commit');await until(ready);root.querySelector('[data-transfer-next]').click();await until(()=>root.textContent.includes('Результат')&&root.querySelector('[data-transfer-cancel]'));
 ok(JSON.stringify(lastCommit.withoutProcedureFacts)===JSON.stringify(['fact-1']),'commit permission must be scoped');ok(root.textContent.includes('Не указана процедура для расходника'),'second error lost');ok(root.querySelector('[data-transfer-errors-file]'),'correction download missing');
 mark('session rollback');root.querySelector('[data-transfer-cancel]').click();root.querySelector('[data-transfer-cancel-confirm]').click();await until(()=>root.textContent.includes('Перенос отменён'));ok(!root.querySelector('[data-transfer-cancel]'),'cancelled session still offers cancellation');
 mark('foreign file');scenario='foreign';await until(ready);root.querySelector('[data-transfer-next]').click();await until(()=>root.querySelector('[data-column-index]'));
 ok(root.textContent.includes('Что означает эта колонка'),'human matching instruction missing');ok(!root.querySelector('[data-sheet-domain]'),'technical domain selector must not exist');
 root.querySelector('[data-column-index="0"]').value='name';root.querySelector('[data-column-index="1"]').value='phone';
 await until(ready);root.querySelector('[data-transfer-next]').click();await until(()=>root.textContent.includes('Готово к переносу'));
 ok(!root.querySelector('[data-column-index]'),'foreign table did not proceed to standard checking');
 mark('finished');
}catch(error){failures.push(String(error.stack||error));}
HTMLInputElement.prototype.click=nativeClick;document.documentElement.dataset.transferRuntime=failures.length?'fail':'pass';document.querySelector('#result').textContent=failures.length?failures.join('\n'):'PASS: standard upload, foreign matching, partial errors, per-fact permission, sessions and cancellation';
</script></body></html>
