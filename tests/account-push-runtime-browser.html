<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{--surface-dark:#2f3338;--button-secondary:#d8d3cf;--text-muted:#817a73;--app-max-width:390px;--visual-vh:780px;--visual-vw:390px}
    html,body{margin:0;width:390px;height:780px}
    *{box-sizing:border-box}
  </style>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/ui/v2/v2.css">
  <link rel="stylesheet" href="/ui/v2/v.css">
  <link rel="stylesheet" href="/ui/v2/surface-header.css">
  <link rel="stylesheet" href="/ui/v2/horizontal-affordance.css">
</head>
<body>
<div id="root"></div>
<pre id="result">pending</pre>
<script type="module">
import { renderGlobalAccount } from '/online-booking/account-shell.js';

const root = document.querySelector('#root');
const result = document.querySelector('#result');
const failures = [];
let stage = 'boot';
const mark = (name) => {
  stage = name;
  result.textContent = 'running: ' + name;
  document.documentElement.dataset.accountPushRuntimeStage = name;
};
const ok = (condition, message) => { if (!condition) failures.push(stage + ': ' + message); };
const wait = (ms = 120) => new Promise((resolve) => window.setTimeout(resolve, ms));
window.addEventListener('error', (event) => failures.push(stage + ': window error: ' + (event.error?.message || event.message)));
window.addEventListener('unhandledrejection', (event) => failures.push(stage + ': rejection: ' + String(event.reason?.message || event.reason || 'unknown')));

mark('ios-home-screen-capability');
Object.defineProperty(navigator, 'standalone', { configurable:true, value:true });
Object.defineProperty(navigator, 'serviceWorker', { configurable:true, value:{} });
Object.defineProperty(window, 'Notification', {
  configurable:true,
  value:{ permission:'default', requestPermission:async () => 'granted' },
});
class RuntimeServiceWorkerRegistration {}
Object.defineProperty(RuntimeServiceWorkerRegistration.prototype, 'pushManager', {
  configurable:true,
  get(){ return {}; },
});
Object.defineProperty(window, 'ServiceWorkerRegistration', {
  configurable:true,
  value:RuntimeServiceWorkerRegistration,
});
Reflect.deleteProperty(window, 'PushManager');
ok(!('PushManager' in window), 'fixture must model original iOS Web Push without a global PushManager constructor');
ok('pushManager' in ServiceWorkerRegistration.prototype, 'fixture must expose Push through ServiceWorkerRegistration');
ok('serviceWorker' in navigator, 'fixture must retain Service Worker capability');
ok(navigator.standalone === true, 'fixture must be Home Screen standalone');

localStorage.setItem('book.account.token', 'account-push-runtime-token');
localStorage.setItem('va-tools.account.push.opt-out', '1');
localStorage.removeItem('va-tools.account.push.opt-out-source');

const state = {
  account:{ id:'account-push-runtime', name:'Иван', surname:'Push', phone:'+79990000000', profileData:{} },
  accountRecords:[],
  relationships:[],
  accountDeckOpen:false,
  accountZEnter:false,
  accountChatOpen:false,
};

mark('real-account-journal');
await renderGlobalAccount(root, state, {});
await wait();
ok(state.accountTab === 'journal', 'real Account did not start on Journal');
ok(Boolean(root.querySelector('[data-account-journal-root]')), 'real Account Journal did not render');
ok(Boolean(root.querySelector('[data-v2-app] [data-account-deck-item]')), 'real Account shell is not ready for Push runtime');

mark('push-runtime');
await import('/online-booking/account-runtime.js');
await wait(240);
const pushModal = document.querySelector('[data-account-push-setup-modal="true"]');
ok(Boolean(pushModal), 'eligible iPhone Home Screen Account did not show Push setup X');
ok(pushModal?.dataset.v2XRole === 'action', 'Push setup did not use action X');
ok(Boolean(pushModal?.querySelector('[data-account-push-enable]')), 'Push setup has no Enable action');
ok(localStorage.getItem('va-tools.account.push.opt-out') !== '1', 'legacy ambiguous opt-out was not migrated');

if (failures.length) {
  document.documentElement.dataset.accountPushRuntime = 'fail';
  result.textContent = failures.join('\n');
  throw new Error(failures.join(' | '));
}
document.documentElement.dataset.accountPushRuntime = 'pass';
result.textContent = 'ACCOUNT PUSH RUNTIME: PASS';
</script>
</body>
</html>
