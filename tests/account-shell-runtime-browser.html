<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{--surface-dark:#2f3338;--button-secondary:#d8d3cf;--text-muted:#817a73;--app-max-width:390px;--visual-vh:780px}
    html,body{margin:0;width:390px;height:780px}
    *{box-sizing:border-box}
  </style>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/ui/v2/v2.css">
  <link rel="stylesheet" href="/ui/v2/v.css">
  <link rel="stylesheet" href="/ui/v2/surface-header.css">
  <link rel="stylesheet" href="/ui/v2/horizontal-affordance.css">
</head>
<body>
<div id="root"></div>
<pre id="result">pending</pre>
<script type="module">
import { renderGlobalAccount } from '/online-booking/account-shell.js';

const root = document.querySelector('#root');
const result = document.querySelector('#result');
const failures = [];
let stage = 'boot';
const mark = (name) => {
  stage = name;
  result.textContent = 'running: ' + name;
  document.documentElement.dataset.accountRuntimeStage = name;
};
const ok = (condition, message) => { if (!condition) failures.push(stage + ': ' + message); };
const wait = (ms = 90) => new Promise((resolve) => window.setTimeout(resolve, ms));
const pointer = (target, type, x, y, id = 1) => target.dispatchEvent(new PointerEvent(type, {
  bubbles:true,cancelable:true,pointerId:id,pointerType:'touch',clientX:x,clientY:y,button:0,
}));
for (const name of ['setPointerCapture','releasePointerCapture']) {
  Object.defineProperty(Element.prototype, name, { configurable:true, value(){ } });
}
Object.defineProperty(Element.prototype, 'hasPointerCapture', { configurable:true, value(){ return true; } });
window.addEventListener('error', (event) => failures.push(stage + ': window error: ' + (event.error?.message || event.message)));
window.addEventListener('unhandledrejection', (event) => failures.push(stage + ': rejection: ' + String(event.reason?.message || event.reason || 'unknown')));

const state = {
  account:{ id:'runtime-user', name:'Иван', surname:'Тестов', phone:'+79990000000', profileData:{} },
  accountRecords:[],
  relationships:[{
    tenantId:'tenant-invest',
    linkedAt:'2026-01-01T00:00:00.000Z',
    context:{
      tenantId:'tenant-invest',
      profile:{name:'Александр',surname:'Проект'},
      workplaces:[],
      investments:[{
        id:'investment-accepted',
        name:'Приложение',
        photo:'',
        cardAppearance:{},
        investmentTerms:{
          role:'external',
          investmentType:'business-project',
          participationModel:'equity',
          objectName:'Разработка приложения',
          targetAmount:500000,
          sharePercent:10,
          participantStatus:'accepted',
        },
        investmentEvents:[{id:'value-1',type:'valuation',amount:1200000,occurredDate:'2026-09-01'}],
        movements:[
          {operationId:'invest-1',operationKind:'investment-received',operationStatus:'completed',direction:'OUT',economicType:'INVESTMENT_CONTRIBUTION',amount:500000,total:-500000,occurredAt:'2026-01-01T09:00:00.000Z'},
          {operationId:'income-1',operationKind:'investment-income-payment',operationStatus:'completed',direction:'IN',economicType:'INVESTMENT_INCOME',amount:50000,total:50000,occurredAt:'2026-08-01T09:00:00.000Z'},
        ],
      },{
        id:'investment-pending',
        name:'Новый проект',
        photo:'',
        cardAppearance:{},
        investmentTerms:{
          role:'external',
          investmentType:'business-project',
          participationModel:'fixed-return',
          objectName:'Новый проект',
          targetAmount:200000,
          returnPercent:20,
          participantStatus:'pending',
        },
        investmentEvents:[],
        movements:[],
      }],
    },
  }],
  accountTab:'home',
  accountDeckOpen:false,
  accountDeckActive:'home',
  accountZEnter:false,
  accountChatOpen:false,
};
const callbacks = {};

const shell = () => root.querySelector(':scope > [data-v2-app]');
const edge = () => shell()?.querySelector('[data-v2-edge-swipe]');
const fDeck = () => shell()?.querySelector('[data-v2-card-deck][data-v2-deck-level="f"]');
const card = (id) => shell()?.querySelector('[data-v2-card-item="' + id + '"]');
const ownerCount = () => Number(edge()?.dataset.v2EdgeOwners || 0);

const edgeOpen = async (id) => {
  mark('edge-open-' + id);
  const e = edge();
  pointer(e,'pointerdown',10,320,id);
  pointer(e,'pointermove',46,322,id);
  pointer(e,'pointerup',46,322,id);
  await wait();
  ok(shell()?.classList.contains('is-deck-open'), 'Z edge swipe did not open F');
  ok(state.accountDeckOpen === true, 'account state did not record open F');
};

const selectRoot = async (id, pointerId) => {
  mark('select-' + id);
  const deck = fDeck();
  const target = card(id);
  const left = target.offsetLeft - (deck.clientWidth - target.offsetWidth) / 2;
  deck.scrollLeft = Math.max(0,left);
  deck.dispatchEvent(new Event('scroll'));
  await wait(140);
  ok(target.classList.contains('is-active'), id + ' did not become centred active F');
  pointer(target,'pointerdown',180,380,pointerId);
  pointer(target,'pointerup',180,380,pointerId);
  target.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true,clientX:180,clientY:380}));
  await wait(140);
  ok(state.accountTab === id, 'tap on active F did not navigate to ' + id);
  ok(!shell()?.classList.contains('is-deck-open'), 'selected root left F open');
  ok(ownerCount() === 1, 'FEZ owner count after render is ' + ownerCount() + ', expected 1');
};

mark('initial-render');
await renderGlobalAccount(root,state,callbacks);
await wait(120);
const initialShell = shell();
ok(Boolean(initialShell), 'real account shell did not render');
ok(Boolean(fDeck()), 'real account F deck did not render');
ok(ownerCount() === 1, 'initial account shell must have exactly one FEZ owner');
ok(card('home')?.classList.contains('is-active'), 'home must be initial active F');

mark("linked-investments-overview");
ok(!root.querySelector('[data-account-investment="tenant-invest:investment-accepted"]'), 'Accepted linked investment must not appear in Overview');
ok(!root.querySelector('[data-account-investment-proposal]'), 'Pending investment proposal must not appear in Overview');

await edgeOpen(1);
await selectRoot('contacts',11);
const relationship = root.querySelector('[data-global-relationship="tenant-invest"]');
ok(Boolean(relationship), 'Professional contact card missing');
relationship?.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}));
await wait(140);
ok(state.accountTab === 'contact-detail', 'Professional contact profile did not open');
const contactZ = root.querySelector('[data-v2-z-layer].account-contact-detail-z');
ok(Boolean(contactZ), 'Professional contact profile must open as stacked Z');

mark('contact-shared-ui-regressions');
const contactZHeader = contactZ?.querySelector(':scope > [data-v2-z-header]');
ok(Boolean(contactZHeader), 'Contact Z must render the Shared Z Header on first open');
ok(getComputedStyle(contactZHeader).minHeight === '40px', 'Empty root Z Header must stay thin and visible on first open');
ok(Boolean(root.querySelector(':scope > [data-v2-app] > [data-v2-v-host] [data-v2-v]')), 'Contact V must expose additional actions when settings/documents are available');
ok(Boolean(root.querySelector('[data-v2-header] .v2-header__slot--a div.v2-header__control--avatar[aria-hidden="true"]')), 'Contact A must remain visual-only and non-interactive');
ok(!root.querySelector('[data-v2-header] .v2-header__settings-tag'), 'Contact A must not retain the old settings badge');
const financeSectionTitle = [...(contactZ?.querySelectorAll('.v2-section__title') || [])]
  .find((node) => node.textContent.trim().toLocaleLowerCase('ru-RU') === 'инвестиции / займы');
const continuationCue = financeSectionTitle ? getComputedStyle(financeSectionTitle, '::after').content : '';
ok(Boolean(financeSectionTitle), 'Contact finance section title missing');
ok(continuationCue.includes('→'), 'Horizontal card continuation cue must be a visible right arrow');
ok(!continuationCue.includes('›'), 'Horizontal card continuation cue must not reuse the Z dismiss chevron');

mark('linked-investments-contact');
const acceptedInvestmentCard = contactZ?.querySelector('[data-account-investment="tenant-invest:investment-accepted"]');
ok(Boolean(acceptedInvestmentCard?.classList.contains('entity-visual-card')), 'Accepted linked investment must appear as a full card in professional contact profile');
const proposal = contactZ?.querySelector('[data-account-investment-proposal="tenant-invest:investment-pending"]');
ok(Boolean(proposal?.classList.contains('entity-visual-card')), 'Pending investment proposal must appear as a full card in professional contact profile');
acceptedInvestmentCard?.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}));
await wait(90);
let investmentZ = root.querySelector('[data-v2-z-layer].account-investment-z');
ok(Boolean(investmentZ), 'Linked investor card must open a real stacked Z');
ok(Boolean(root.querySelector('[data-account-investment-chat]')), 'Linked investor Z must expose shared D chat');
ok(investmentZ?.textContent.includes('ROI'), 'Investor Z must expose ROI');
ok(investmentZ?.textContent.includes('История'), 'Linked investor Z must expose investment history');
ok(investmentZ?.textContent.includes('Вложение'), 'Linked investor history must mirror project contribution');
ok(investmentZ?.textContent.includes('Доход'), 'Linked investor history must mirror paid income');
ok(investmentZ?.textContent.includes('Изменение оценки'), 'Linked investor history must include non-cash valuation');
investmentZ?.v2Close?.();
await wait(90);
proposal?.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}));
await wait(60);
const proposalModal = document.querySelector('[data-modal][data-v2-layer-kind="bottom"]');
ok(Boolean(proposalModal), 'Investment proposal must open as shared bottom action modal');
ok(Boolean(proposalModal?.querySelector('[data-account-investment-accept]')), 'Investment proposal Accept action missing');
ok(Boolean(proposalModal?.querySelector('[data-account-investment-decline]')), 'Investment proposal Decline action missing');
proposalModal?.v2Close?.();
await wait(50);
contactZ?.v2Close?.();
await wait(100);

await edgeOpen(2);
await selectRoot('profile',12);
ok(shell() === initialShell, 'profile navigation rebuilt the whole account shell');

await edgeOpen(3);
await selectRoot('contacts',13);
ok(shell() === initialShell, 'contacts navigation rebuilt the whole account shell');

await edgeOpen(4);
await selectRoot('history',14);
ok(shell() === initialShell, 'history navigation rebuilt the whole account shell');

await edgeOpen(5);
await selectRoot('home',15);
ok(shell() === initialShell, 'home navigation rebuilt the whole account shell');

// Repeat the cycle to expose handler accumulation that only appears after several renders.
for (const [index,id] of ['profile','contacts','history','home','profile','home'].entries()) {
  await edgeOpen(20 + index);
  await selectRoot(id,40 + index);
  ok(ownerCount() === 1, 'owner accumulation after repeated navigation to ' + id);
}

// Real profile Z2 must close one level from the same edge owner.
mark('profile-z2');
if (state.accountTab !== 'profile') {
  await edgeOpen(70);
  await selectRoot('profile',71);
}
const profileCard = root.querySelector('[data-account-profile-card]');
ok(Boolean(profileCard), 'real profile card missing');
profileCard?.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}));
await wait(100);
const z2 = root.querySelector('[data-v2-z-layer]');
ok(Boolean(z2), 'profile editor Z2 did not mount');
ok(ownerCount() === 2, 'Z2 must retain the shared edge owner in addition to base Z');
const e = edge();
pointer(e,'pointerdown',10,300,72);
pointer(e,'pointermove',46,302,72);
pointer(e,'pointerup',46,302,72);
await wait(120);
ok(!root.querySelector('[data-v2-z-layer]'), 'edge swipe did not close real profile Z2');
ok(ownerCount() === 1, 'closing Z2 did not release exactly one edge owner');

mark('finalize');
if (failures.length) {
  document.documentElement.dataset.accountRuntime = 'fail';
  result.textContent = failures.join('\n');
} else {
  document.documentElement.dataset.accountRuntime = 'pass';
  result.textContent = 'real end-user account shell runtime passed';
}
</script>
</body>
</html>
