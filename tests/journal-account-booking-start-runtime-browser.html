<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{--surface-dark:#2f3338;--button-secondary:#d8d3cf;--text-muted:#817a73;--app-max-width:390px;--visual-vh:780px;--visual-vw:390px}
    html,body{margin:0;width:390px;height:780px}*{box-sizing:border-box}
  </style>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/ui/v2/v2.css">
  <link rel="stylesheet" href="/ui/v2/v.css">
  <link rel="stylesheet" href="/ui/v2/surface-header.css">
  <link rel="stylesheet" href="/ui/v2/horizontal-affordance.css">
</head>
<body>
<div id="app"></div>
<pre id="result">pending</pre>
<script type="module">
const result = document.querySelector('#result');
const failures = [];
let stage = 'boot';
const mark = (value) => {
  stage = value;
  result.textContent = `running: ${value}`;
  document.documentElement.dataset.journalAccountBookingStartRuntimeStage = value;
};
const ok = (condition, message) => { if (!condition) failures.push(`${stage}: ${message}`); };
const wait = (ms = 120) => new Promise((resolve) => window.setTimeout(resolve, ms));
const click = (node) => node?.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true }));
const json = (body, status = 200) => new Response(JSON.stringify(body), { status, headers: { 'Content-Type': 'application/json' } });
const dateKey = (date) => `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;

window.addEventListener('error', (event) => failures.push(`${stage}: window error: ${event.error?.message || event.message}`));
window.addEventListener('unhandledrejection', (event) => failures.push(`${stage}: rejection: ${event.reason?.message || event.reason || 'unknown'}`));

const account = {
  id: 'runtime-account-journal-start',
  uei: 'END/RUNTIME/JOURNAL/START',
  name: 'Мария',
  surname: 'Journal',
  phone: '+79990000003',
  email: 'journal-start@example.invalid',
  profileData: {},
};
const future = new Date();
future.setDate(future.getDate() + 4);
const bookingDate = dateKey(future);

function relationship(tenantId, name, workplaceKey) {
  return {
    tenantId,
    linkedAt: new Date().toISOString(),
    context: {
      tenantId,
      profile: { tenantId, name, surname: 'Runtime', uei: `PRO/${tenantId}` },
      workplaces: [{ key: workplaceKey, id: `${workplaceKey}-db`, name: `Пространство ${name}`, color: '#999999', indicatorColor: '#999999' }],
    },
  };
}
const relationships = [
  relationship('tenant-journal-a', 'Анна', 'workplace-a'),
  relationship('tenant-journal-b', 'Борис', 'workplace-b'),
];
const selected = relationships[0];
const selectedWorkplace = selected.context.workplaces[0];
const procedure = {
  id: 'journal-start-procedure',
  name: 'Runtime процедура',
  duration: 60,
  cost: { amount: 1500 },
  workplaces: [{ workplaceId: selectedWorkplace.key, cost: { amount: 1500 } }],
};
const bookingContext = {
  profile: selected.context.profile,
  workplaces: [selectedWorkplace],
  procedures: [procedure],
  days: [{ workplaceId: selectedWorkplace.key, date: bookingDate, from: '09:00', to: '18:00' }],
  occupancy: [],
  documents: [],
  settings: { slotStep: 30 },
};

let bookingContextFetches = 0;
let relationshipsFetches = 0;
const originalFetch = window.fetch.bind(window);
window.fetch = async (input, options = {}) => {
  const url = new URL(typeof input === 'string' ? input : input.url, location.origin);
  const path = url.pathname;
  const method = String(options.method || input?.method || 'GET').toUpperCase();

  if (path === '/online-booking/account/me' && method === 'GET') return json(account);
  if (path === '/online-booking/account/platform-state' && method === 'GET') {
    return json({ accepted: true, document: { key:'platform-terms', version:1, title:'Условия', content:'Runtime' } });
  }
  if (path === '/online-booking/account/relationships' && method === 'GET') {
    relationshipsFetches += 1;
    return json(relationships);
  }
  if (path === '/online-booking/account/records' && method === 'GET') return json([]);
  if (path === '/online-booking/account/unread-summary' && method === 'GET') return json({ total:0, byTenant:[] });
  if (path === '/online-booking/account/personal-accounts' && method === 'GET') return json([]);
  if (path === '/online-booking/account/deposits' && method === 'GET') return json([]);

  if (path === `/online-booking/${selected.tenantId}/context` && method === 'GET') {
    bookingContextFetches += 1;
    return json(bookingContext);
  }
  if (path === `/online-booking/${selected.tenantId}/account/me` && method === 'GET') return json(account);
  if (path === `/online-booking/${selected.tenantId}/account/platform-state` && method === 'GET') {
    return json({ accepted:true, document:{ key:'platform-terms', version:1, title:'Условия', content:'Runtime' } });
  }
  if (path === `/online-booking/${selected.tenantId}/account/consent-state` && method === 'GET') {
    return json({ pdnActive:true, consents:[] });
  }

  if (path.includes('/saas-access/me')) {
    return json({ tenantId:'runtime', status:'ACTIVE', isOwnerBook:false, capabilities:[] });
  }

  failures.push(`${stage}: unexpected fetch ${method} ${path}`);
  return json({ message:'Unexpected runtime request' }, 404);
};

localStorage.setItem('book.account.token', 'runtime-token');
history.replaceState({}, '', '/');

mark('journal-root');
await import('/online-booking/user-entry.js?journal-account-booking-start-runtime=1');
await wait(300);
const journalRoot = document.querySelector('[data-account-journal-root]');
ok(Boolean(journalRoot), 'Account Journal did not render as root');
ok(journalRoot?.dataset.journalContext === 'account', 'Journal did not enter account context');
const slot = journalRoot?.querySelector('[data-time-slot-from]');
ok(Boolean(slot), 'Account Journal Day has no free slot surface');
ok(!document.querySelector('[data-journal-creation]'), 'professional Journal creation leaked before booking request');

mark('journal-slot');
click(slot);
await wait(320);
ok(relationshipsFetches >= 2, 'Journal booking request did not resolve existing Account relationships');
ok(Boolean(document.querySelector('[data-v2-card-item="contacts"].is-active')), 'multiple relationships did not reuse existing Contacts root');
const relationshipCards = [...document.querySelectorAll('[data-global-relationship]')];
ok(relationshipCards.length === 2, 'existing Contacts did not render both relationships for booking choice');
ok(!document.querySelector('[data-journal-creation]'), 'Journal slot started professional creation flow');
ok(!document.querySelector('[data-modal]'), 'Journal booking choice created a local modal instead of Contacts');

mark('contact-choice');
click(relationshipCards[0]);
await wait(420);
ok(bookingContextFetches >= 1, 'selected relationship did not enter existing online booking context');
ok(Boolean(document.querySelector('[data-record-creation-flow]')), 'existing Shared Record creation flow did not start');
ok(!document.querySelector('[data-journal-creation]'), 'professional Journal creation was used instead of account booking');
ok(Boolean(document.querySelector('[data-records-procedure]')), 'existing booking did not reach canonical procedure selection');

mark('finalize');
window.fetch = originalFetch;
if (failures.length) {
  document.documentElement.dataset.journalAccountBookingStartRuntime = 'fail';
  result.textContent = failures.join('\n');
} else {
  document.documentElement.dataset.journalAccountBookingStartRuntime = 'pass';
  result.textContent = 'Account Journal starts existing booking through existing Contacts runtime passed';
}
</script>
</body>
</html>
