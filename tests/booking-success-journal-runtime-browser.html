<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{--surface-dark:#2f3338;--button-secondary:#d8d3cf;--text-muted:#817a73;--app-max-width:390px;--visual-vh:780px;--visual-vw:390px;--app-stable-vh:780px}
    html,body{margin:0;width:390px;height:780px}*{box-sizing:border-box}
  </style>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/ui/page/page.css">
  <link rel="stylesheet" href="/ui/buttons/buttons.css">
  <link rel="stylesheet" href="/ui/inputs/inputs.css">
  <link rel="stylesheet" href="/ui/selectors/selectors.css">
  <link rel="stylesheet" href="/ui/calendar/calendar.css">
  <link rel="stylesheet" href="/ui/lists/list-entry.css">
  <link rel="stylesheet" href="/ui/time/time.css">
  <link rel="stylesheet" href="/ui/record/record.css">
  <link rel="stylesheet" href="/ui/states/state-view.css">
  <link rel="stylesheet" href="/ui/modals/modal.css">
  <link rel="stylesheet" href="/ui/documents/document.css">
  <link rel="stylesheet" href="/ui/booking/booking.css">
  <link rel="stylesheet" href="/ui/v2/v2.css">
</head>
<body>
<div id="app"><main id="app-content" class="booking-content"></main></div>
<pre id="result">pending</pre>
<script type="module">
import { renderAccess } from '/online-booking/access.js';

const result = document.querySelector('#result');
const root = document.querySelector('#app-content');
const failures = [];
let stage = 'boot';
const mark = (value) => {
  stage = value;
  result.textContent = `running: ${value}`;
  document.documentElement.dataset.bookingSuccessJournalRuntimeStage = value;
};
const ok = (condition, message) => { if (!condition) failures.push(`${stage}: ${message}`); };
const wait = (ms = 60) => new Promise((resolve) => window.setTimeout(resolve, ms));
const json = (body, status = 200) => new Response(JSON.stringify(body), { status, headers: { 'Content-Type': 'application/json' } });
const click = (node) => node?.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true }));
const dateKey = (date) => `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;

window.addEventListener('error', (event) => failures.push(`${stage}: window error: ${event.error?.message || event.message}`));
window.addEventListener('unhandledrejection', (event) => failures.push(`${stage}: rejection: ${event.reason?.message || event.reason || 'unknown'}`));

const tenantId = 'runtime-booking-tenant';
const workplaceKey = 'runtime-booking-workplace';
const procedureId = 'runtime-booking-procedure';
const futureDate = new Date();
futureDate.setDate(futureDate.getDate() + 3);
const bookingDate = dateKey(futureDate);
const bookingContext = {
  tenantId,
  profile: { name: 'Иван', surname: 'Проверка' },
  workplaces: [{ key: workplaceKey, name: 'Студия Runtime', from: '09:00', to: '18:00', timeZone: 'UTC' }],
  procedures: [{
    id: procedureId,
    name: 'Runtime процедура',
    duration: 60,
    cost: { amount: 1500 },
    workplaces: [{ workplaceId: workplaceKey, cost: { amount: 1500 } }],
  }],
  days: [{ workplaceId: workplaceKey, date: bookingDate, from: '09:00', to: '18:00' }],
  occupancy: [],
  documents: [
    { id: 'pdn-consent', title: 'Согласие на обработку персональных данных', version: 3, personConsent: true, required: true, text: 'ПДн Runtime' },
    { id: 'messages-consent', title: 'Согласие на рекламные сообщения', version: 2, personConsent: true, required: false, text: 'Реклама Runtime' },
  ],
  settings: { slotStep: 30 },
};

let legalResolve;
const legalPromise = new Promise((resolve) => { legalResolve = resolve; });
let legalRequests = 0;
let confirmRequests = 0;
let accountRequests = 0;
let confirmedPayload = null;

const originalFetch = window.fetch.bind(window);
window.fetch = async (input, options = {}) => {
  const url = new URL(typeof input === 'string' ? input : input.url, location.origin);
  const path = url.pathname;
  const method = String(options.method || input?.method || 'GET').toUpperCase();

  if (path === `/online-booking/${tenantId}/context` && method === 'GET') return json(bookingContext);
  if (path === `/online-booking/${tenantId}/booking-state` && method === 'POST') {
    legalRequests += 1;
    await legalPromise;
    return json({
      person: { key: 'existing-person', name: 'Наталья', phone: '+79990000002' },
      ambiguous: false,
      consents: [
        { documentId: 'pdn-consent', documentVersion: 3, required: true, marketing: false, active: true },
        { documentId: 'messages-consent', documentVersion: 2, required: false, marketing: true, active: true },
      ],
    });
  }
  if (path === `/online-booking/${tenantId}/confirm` && method === 'POST') {
    confirmRequests += 1;
    confirmedPayload = JSON.parse(String(options.body || '{}'));
    return json({
      bookingSessionId: 'runtime-session',
      workplaceKey,
      date: bookingDate,
      from: confirmedPayload.from,
      to: '10:00',
      records: [{ id: 'runtime-record', person: { key: 'existing-person', name: 'Наталья' }, procedures: [{ id: procedureId, name: 'Runtime процедура' }], from: confirmedPayload.from, to: '10:00' }],
    });
  }
  if (path.includes('/account/') || path.endsWith('/account') || path === '/online-booking/account/me') {
    accountRequests += 1;
    return json({ message: 'Account runtime must not be used by public Booking' }, 500);
  }
  failures.push(`${stage}: unexpected fetch ${method} ${path}`);
  return json({ message: 'Unexpected runtime request' }, 404);
};

history.replaceState({}, '', '/public-runtime');

mark('open');
await renderAccess(root, { tenantId, workplaceKey, procedureIds: [] });
await wait();
ok(Boolean(document.querySelector('.booking-technical-modal')), 'public Booking did not use existing technical modal');
ok(!document.querySelector('[data-account-journal-root]'), 'public Booking loaded Account Journal');
ok(!document.querySelector('[data-record-creation-flow]'), 'public Booking opened App Record creation owner');
ok(!document.querySelector('[data-booking-back]'), 'first visible step unexpectedly has Back');

mark('mode');
const selfMode = document.querySelector('[data-booking-mode="self"]');
ok(Boolean(selfMode), 'Записаться option missing');
click(selfMode);
await wait();

mark('data');
const form = document.querySelector('[data-booking-data-form]');
ok(Boolean(form), 'participant data step missing');
const nameInput = form?.querySelector('input[name="bookerName"]');
const phoneHost = form?.querySelector('[data-phone-input]');
const phoneVisible = phoneHost?.querySelector('[data-phone-national]');
const phoneValue = phoneHost?.querySelector('input[name="bookerPhone"]');
if (nameInput) nameInput.value = 'Наталья';
if (phoneVisible) phoneVisible.value = '9990000002';
if (phoneValue) phoneValue.value = '+79990000002';
if (phoneHost) phoneHost.dataset.phoneComplete = 'true';
click(document.querySelector('[data-booking-data-next]'));
await wait();

mark('legal-nonblocking-services');
ok(legalRequests === 1, 'identity/consent lookup did not start after normalized phone');
ok(Boolean(document.querySelector('[data-booking-procedure]')), 'services waited for identity/consent lookup');
click(document.querySelector('[data-booking-procedure]'));
await wait();
click(document.querySelector('[data-booking-services-next]'));
await wait();

mark('legal-nonblocking-date');
ok(Boolean(document.querySelector('[data-booking-calendar]')), 'date waited for identity/consent lookup');
const dateButton = document.querySelector(`[data-calendar-date="${bookingDate}"]`);
ok(Boolean(dateButton), 'working booking date missing');
click(dateButton);
await wait();
click(document.querySelector('[data-booking-date-next]'));
await wait();

mark('legal-nonblocking-time');
const timeButton = document.querySelector('[data-booking-time]:not(:disabled)');
ok(Boolean(timeButton), 'time waited for identity/consent lookup');
click(timeButton);
await wait();
click(document.querySelector('[data-booking-time-next]'));
await wait();

mark('consents-pending');
ok(String(document.querySelector('.booking-flow')?.textContent || '').includes('Проверяем действующие согласия'), 'pending lookup was treated as missing consent history');
ok(!document.querySelector('[data-booking-consent]'), 'pending lookup exposed consent documents before history resolved');
ok(!document.querySelector('[data-booking-consents-next]'), 'pending lookup allowed continuation');

mark('consents-resolve');
legalResolve();
await wait(180);
ok(!document.querySelector('[data-booking-consent="pdn-consent"]'), 'active current PDN was requested again after lookup resolved');
ok(!document.querySelector('[data-booking-consent="messages-consent"]'), 'active current marketing consent was requested again after lookup resolved');
ok(!document.querySelector('[data-booking-consents-next]'), 'two active current consents left an empty consent step');
ok(Boolean(document.querySelector('[data-booking-confirm]')), 'two active current consents did not skip directly to preview');

mark('preview');
ok(String(document.querySelector('.booking-summary')?.textContent || '').includes('Наталья'), 'preview lost participant name');
ok(Boolean(document.querySelector('[data-booking-confirm]')), 'preview and confirm were split into separate steps');
click(document.querySelector('[data-booking-confirm]'));
await wait(180);

mark('success');
ok(confirmRequests === 1, 'confirm endpoint was not called exactly once');
ok(confirmedPayload?.mode === 'self', 'confirm lost booking mode');
ok(Array.isArray(confirmedPayload?.participants) && confirmedPayload.participants.length === 1, 'confirm did not send ordinary participant records');
ok(accountRequests === 0, 'public Booking called Account/App endpoints');
ok(String(document.querySelector('.booking-flow')?.textContent || '').includes('Запись подтверждена'), 'success remained outside technical Booking modal');
ok(!document.querySelector('[data-account-journal-root]'), 'success entered Journal');
ok(!document.querySelector('[data-record-view-context]'), 'success opened Record View');

mark('finalize');
window.fetch = originalFetch;
if (failures.length) {
  document.documentElement.dataset.bookingSuccessJournalRuntime = 'fail';
  result.textContent = failures.join('\n');
} else {
  document.documentElement.dataset.bookingSuccessJournalRuntime = 'pass';
  result.textContent = 'isolated public Booking runtime passed';
}
</script>
</body>
</html>
