<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/ui/v2/v2.css">
</head>
<body>
<div id="root"></div>
<pre id="result">pending</pre>
<script type="module">
const result = document.querySelector('#result');
const root = document.querySelector('#root');
const failures = [];
const ok = (condition, message) => { if (!condition) failures.push(message); };
const clone = (value) => JSON.parse(JSON.stringify(value));

let profileGets = 0;
let profilePuts = 0;
let workplacePuts = 0;

const referenceData = {
  cities:['Москва','Санкт-Петербург'],
  currencies:[{value:'RUB',label:'₽'}],
  defaults:{currency:'RUB',from:'09:00',to:'18:00',timeZone:'Europe/Moscow'},
};

let serverBundle = {
  profile:{
    id:'profile-db',platformAccountId:'owner-account',key:'profile',
    name:'Иван',surname:'Проверка',phone:'+79990000000',phones:['+79990000000'],
    telegrams:[],emails:['owner@example.test'],about:'Исходное описание',photo:'',photoCropX:50,photoCropY:50,
    profession:'Стилист',experience:'Более 20 лет',professionAbout:'Профессия',cardAppearance:{},
  },
  customProfessions:[],
  professionCatalog:['Стилист','Парикмахер'],
  workplaceReferenceData:referenceData,
  workplaces:[{
    key:'studio-1',profileId:'profile',photo:'',photoCropX:50,photoCropY:50,
    name:'Студия 1',color:'#9AAE85',city:'Москва',address:'Старый адрес',phone:'+79990000001',
    currency:'RUB',timeZone:'Europe/Moscow',from:'09:00',to:'18:00',links:[],about:'',cardAppearance:{},
    visibleInPublicBooking:true,createdAt:'2026-10-01T00:00:00.000Z',updatedAt:'2026-10-01T00:00:00.000Z',
  }],
};

const json = (body, status=200) => Promise.resolve(new Response(JSON.stringify(body), {
  status, headers:{'Content-Type':'application/json'},
}));
const pathOf = (input) => {
  try { return new URL(typeof input === 'string' ? input : input.url, location.href).pathname; }
  catch { return String(input || ''); }
};

window.fetch = async (input, init={}) => {
  const path = pathOf(input);
  const method = String(init.method || 'GET').toUpperCase();
  if (path === '/saas-access/me') {
    return json({tenantId:'tenant-1',status:'ACTIVE',isOwnerBook:true,commercialMode:'LIVE',capabilities:[]});
  }
  if (path === '/profile' && method === 'GET') {
    profileGets += 1;
    return json(clone(serverBundle));
  }
  if (path === '/profile' && method === 'PUT') {
    profilePuts += 1;
    const body = JSON.parse(String(init.body || '{}'));
    serverBundle.profile = {...serverBundle.profile, ...(body.profile || {})};
    serverBundle.customProfessions = Array.isArray(body.customProfessions) ? clone(body.customProfessions) : serverBundle.customProfessions;
    return json(clone(serverBundle));
  }
  const workplaceMatch = path.match(/^\/profile\/workplaces\/([^/]+)$/);
  if (workplaceMatch && method === 'PUT') {
    workplacePuts += 1;
    const key = decodeURIComponent(workplaceMatch[1]);
    const body = JSON.parse(String(init.body || '{}'));
    const index = serverBundle.workplaces.findIndex((item) => item.key === key);
    const next = {...body,key,profileId:'profile',updatedAt:'2026-10-27T08:00:00.000Z'};
    if (index >= 0) serverBundle.workplaces[index] = {...serverBundle.workplaces[index],...next};
    else serverBundle.workplaces.push(next);
    return json(clone(serverBundle));
  }
  return json({message:`Unexpected ${method} ${path}`}, 404);
};

localStorage.setItem('book.auth.token','profile-runtime-token');

try {
  const [{loadBookAccess}, {render}, profileData, workplaceData, profileRuntime] = await Promise.all([
    import('/core/access.js'),
    import('/core/profile/profile.js'),
    import('/core/profile/data.js'),
    import('/core/profile/workplaces/data.js'),
    import('/core/profile/runtime.js'),
  ]);

  await loadBookAccess();
  await render(root);

  ok(profileGets === 1, 'Opening Profile must perform one full Profile read');
  ok(Boolean(root.querySelector('[data-profile-card]')), 'Profile card did not render');
  ok(Boolean(root.querySelector('[data-workplace="studio-1"]')), 'Workplace card did not render inside Profile area');
  ok(profileData.getProfile().name === 'Иван', 'Full Profile payload was not hydrated');
  ok(workplaceData.getWorkplaces()[0]?.name === 'Студия 1', 'Workplace payload was not hydrated');

  await profileData.saveProfile({
    ...profileData.getProfile(),
    name:'Иван Изменён',
    about:'Сохранено на сервере',
  });
  ok(profilePuts === 1, 'Profile save did not call canonical PUT /profile');
  ok(serverBundle.profile.name === 'Иван Изменён', 'Profile server fact did not change');
  ok(serverBundle.workplaces[0]?.name === 'Студия 1', 'Profile save must not rewrite Workplace');
  ok(profileData.getProfile().name === 'Иван Изменён', 'Profile UI state did not hydrate from save response');

  await workplaceData.upsertWorkplace({
    ...workplaceData.getWorkplaces()[0],
    name:'Студия Изменена',
    address:'Новый адрес',
  });
  ok(workplacePuts === 1, 'Workplace save did not call canonical Workplace PUT');
  ok(serverBundle.workplaces[0]?.name === 'Студия Изменена', 'Workplace server fact did not change');
  ok(serverBundle.profile.name === 'Иван Изменён', 'Workplace save must not rewrite Profile');
  ok(workplaceData.getWorkplaces()[0]?.name === 'Студия Изменена', 'Workplace UI state did not hydrate from save response');

  window.dispatchEvent(new CustomEvent('book:auth-logout'));
  localStorage.setItem('book.auth.token','profile-runtime-token');
  await profileRuntime.loadProfileState({full:true});

  ok(profileGets === 2, 'Fresh Profile read after session reset did not occur');
  ok(profileData.getProfile().name === 'Иван Изменён', 'Profile edit did not survive fresh server read');
  ok(workplaceData.getWorkplaces()[0]?.name === 'Студия Изменена', 'Workplace edit did not survive fresh server read');
  ok(workplaceData.getWorkplaces()[0]?.address === 'Новый адрес', 'Workplace fields did not survive fresh server read');

  if (failures.length) {
    document.documentElement.dataset.profileWorkplaceRuntime = 'fail';
    result.textContent = failures.join('\n');
  } else {
    document.documentElement.dataset.profileWorkplaceRuntime = 'pass';
    result.textContent = 'Profile + Workplace runtime roundtrip passed';
  }
} catch (error) {
  document.documentElement.dataset.profileWorkplaceRuntime = 'fail';
  result.textContent = String(error?.stack || error?.message || error || 'unknown');
}
</script>
</body>
</html>
