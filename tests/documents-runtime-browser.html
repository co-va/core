<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{--surface-dark:#2f3338;--app-max-width:390px;--visual-vh:780px;--visual-vw:390px}
    html,body{margin:0;width:390px;height:780px}
    *{box-sizing:border-box}
  </style>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/ui/page/page.css">
  <link rel="stylesheet" href="/ui/buttons/buttons.css">
  <link rel="stylesheet" href="/ui/inputs/inputs.css">
  <link rel="stylesheet" href="/ui/lists/list-entry.css">
  <link rel="stylesheet" href="/ui/selection/segment-control.css">
  <link rel="stylesheet" href="/ui/states/state-view.css">
  <link rel="stylesheet" href="/ui/modals/modal.css">
  <link rel="stylesheet" href="/ui/receipt/receipt.css">
  <link rel="stylesheet" href="/ui/documents/document.css">
  <link rel="stylesheet" href="/ui/v2/v2.css">
</head>
<body>
<div id="app"></div>
<pre id="result">pending</pre>
<script type="module">
const result = document.querySelector('#result');
const failures = [];
let stage = 'boot';
const mark = (name) => {
  stage = name;
  result.textContent = 'running: ' + name;
  document.documentElement.dataset.documentsRuntimeStage = name;
};
const ok = (condition, message) => { if (!condition) failures.push(stage + ': ' + message); };
const wait = (ms = 40) => new Promise((resolve) => window.setTimeout(resolve, ms));
window.addEventListener('error', (event) => failures.push(stage + ': window error: ' + (event.error?.message || event.message)));
window.addEventListener('unhandledrejection', (event) => failures.push(stage + ': rejection: ' + String(event.reason?.message || event.reason || 'unknown')));

mark('imports');
const [{ v2Header, v2Shell, documentTile, documentTiles }, documentsUi, data, consents, history] = await Promise.all([
  import('/ui/ui.js'),
  import('/settings/documents/documents.js'),
  import('/settings/documents/data.js'),
  import('/settings/documents/consents.js'),
  import('/settings/documents/history.js'),
]);

data.configurePlatformDocumentBases([
  {
    key:'user-document-pdn-policy',
    documentId:'pdn-agreement',
    kind:'agreement',
    personConsent:false,
    required:false,
    title:'Политика обработки персональных данных',
    version:1,
    content:'Политика для [ФИО пользователя] · [Контакт пользователя]'
  },
  {
    key:'user-document-pdn-consent',
    documentId:'pdn-consent',
    kind:'consent',
    personConsent:true,
    required:true,
    title:'Согласие на обработку персональных данных',
    version:1,
    content:'Согласие для [ФИО пользователя] · [Контакт пользователя]'
  },
  {
    key:'user-document-messages-consent',
    documentId:'messages-consent',
    kind:'consent',
    personConsent:true,
    required:false,
    title:'Согласие на рекламные сообщения',
    version:1,
    content:'Реклама для [ФИО пользователя] · [Контакт пользователя]'
  }
], {
  profile:{ name:'Иван', surname:'Проверка', phone:'+79990000000' }
});

data.hydrateDocumentsFromServer([
  {
    id:'pdn-consent',
    system:true,
    documentClass:'CORE_LEGAL',
    signable:true,
    kind:'consent',
    title:'Согласие на обработку персональных данных',
    personConsent:true,
    required:true,
    version:2,
    text:'Именно этот текст был подписан.',
    sourceMode:'BOOK',
    baseKey:'pdn-consent-template',
    baseVersion:2,
  },
  {
    id:'profile-contract',
    system:false,
    documentClass:'USER_DOCUMENT',
    signable:true,
    kind:'document',
    title:'Договор на фотосъёмку',
    version:3,
    text:'Текст договора на фотосъёмку.',
    sourceMode:'CUSTOM',
    createdAt:'2026-10-01T08:00:00.000Z',
    updatedAt:'2026-10-03T08:00:00.000Z',
  },
  {
    id:'rkn-old',
    system:true,
    documentClass:'FILE',
    signable:false,
    kind:'instruction',
    title:'Инструкция по уведомлению Роскомнадзора',
    version:1,
    text:'Старая версия РКН',
    sourceMode:'BOOK',
    attachment:{
      type:'RKN_GUIDE_PDF',
      templateKey:'rkn-notification-guide-template',
      generatedAt:'2026-09-20T08:00:00.000Z',
      mimeType:'application/pdf',
      pdfBase64:'JVBERi0xLjQKJcTl8uXrCg=='
    }
  },
  {
    id:'rkn-current',
    system:true,
    documentClass:'FILE',
    signable:false,
    kind:'instruction',
    title:'Инструкция по изменению сведений Роскомнадзора',
    version:2,
    text:'Текущая версия РКН',
    sourceMode:'BOOK',
    attachment:{
      type:'RKN_GUIDE_PDF',
      templateKey:'rkn-notification-guide-template',
      generatedAt:'2026-10-02T08:00:00.000Z',
      mimeType:'application/pdf',
      pdfBase64:'JVBERi0xLjQKJcTl8uXrCg=='
    }
  }
]);

history.hydrateDocumentHistoryFromServer([
  {
    id:'pdn-v2',
    documentId:'pdn-consent',
    documentTitle:'Согласие на обработку персональных данных',
    documentVersion:2,
    action:'version-created',
    createdAt:'2026-10-01T07:00:00.000Z',
    snapshot:{
      id:'pdn-consent',
        signable:true,
      kind:'consent',
      title:'Согласие на обработку персональных данных',
      personConsent:true,
      required:true,
      version:2,
      text:'Именно этот текст был подписан.',
      sourceMode:'BOOK'
    }
  }
]);

consents.hydrateConsentsFromServer([
  {
    id:'signing-1',
    subjectType:'CONTACT_POINT',
    subjectKey:'phone:+79990000000',
    contactType:'PHONE',
    contactValue:'+79990000000',
    documentId:'pdn-consent',
    documentVersion:2,
    status:'accepted',
    acceptedAt:'2026-10-03T05:30:00.000Z',
    eventAt:'2026-10-03T05:30:00.000Z',
    createdAt:'2026-10-03T05:30:00.000Z',
    source:'chat'
  }
]);

mark('render-shell');
const app = document.querySelector('#app');
app.innerHTML = v2Shell({
  header:v2Header({ b:'Документы' }),
  className:'v2-app--workspace',
  body:'<section class="v2-workspace-surface" id="documents-root"></section>',
});
const root = document.querySelector('#documents-root');
documentsUi.render(root);
await wait();

mark('z1-documents');
ok(Boolean(root.querySelector('[data-workspace-header-context][data-workspace-title="Документы"]')), 'Documents workspace context missing');
ok(root.querySelectorAll('[data-segment-option]').length === 2, 'Documents/History switch must contain two options');
ok(root.querySelector('[data-segment-option="documents"]')?.classList.contains('is-active'), 'Documents must be active by default');
ok(root.querySelectorAll('[data-document-group="core"] [data-profile-document]').length === 1, 'Fixture core rail must contain the available core tenant document');
ok(root.querySelector('[data-document-group="core"] [data-document-layout="rail"]'), 'Core documents must use the horizontal rail layout');
ok(root.querySelectorAll('[data-document-group="other"] [data-profile-document]').length === 3, 'Other section must keep user document and both independent RKN helper files');
ok(root.querySelector('[data-document-group="other"] [data-document-layout="rail"]'), 'Other documents must use the horizontal rail layout');
ok(getComputedStyle(root.querySelector('[data-documents-content]')).marginTop === '16px', 'Document content must keep spacing below the Documents/History switch');
ok(
  root.textContent.includes('Инструкция по уведомлению Роскомнадзора')
  && root.textContent.includes('Инструкция по изменению сведений Роскомнадзора'),
  'Separate helper PDFs must remain visible as independent files'
);
ok(root.textContent.includes('Согласие на обработку персональных данных'), 'Core tenant document must remain visible in Documents Z1');
ok([...root.querySelectorAll('.document-tile')].every((node) => getComputedStyle(node).width === '238px'), 'Document tile width must stay fixed at 238px');
ok([...root.querySelectorAll('.document-tile')].every((node) => getComputedStyle(node).borderRadius === '10px'), 'Document tile must use the soft file geometry');

mark('rkn-hide');
root.querySelector('[data-profile-document="rkn-old"]')?.click();
await wait();
let detailLayer = root.closest('[data-v2-app]')?.querySelector('[data-v2-z-layer]');
detailLayer?.querySelector('[data-document-detail-settings]')?.click();
await wait();
let rknSettings = document.querySelector('[data-modal][data-v2-layer-kind="bottom"]');
ok(rknSettings?.querySelector('[data-detail-delete]')?.textContent.includes('Убрать документ'), 'RKN settings must describe removal as hiding');
rknSettings?.querySelector('[data-detail-delete]')?.click();
await wait();
let rknConfirm = document.querySelector('[data-modal][data-v2-layer-kind="bottom"]');
rknConfirm?.querySelector('[data-confirm-document-delete]')?.click();
await wait();
ok(data.getDocuments().some((item) => item.id === 'rkn-old' && item.hidden === true), 'RKN helper must remain stored with hidden state');
ok(!root.querySelector('[data-profile-document="rkn-old"]'), 'Hidden RKN helper must disappear from visible Documents');
ok(root.querySelectorAll('[data-document-group="other"] [data-profile-document]').length === 2, 'Only the hidden RKN helper must disappear from the other-documents rail');

mark('document-info-z2');
root.querySelector('[data-profile-document="profile-contract"]')?.click();
await wait();
detailLayer = root.closest('[data-v2-app]')?.querySelector('[data-v2-z-layer]');
ok(Boolean(detailLayer?.querySelector('[data-document-detail]')), 'Document click must open information Z2 first');
ok(Boolean(detailLayer?.querySelector('[data-read-only-sheet]')), 'Document information must use factual receipt UI');
ok(Boolean(detailLayer?.querySelector('[data-document-detail-settings]')), 'Document information must expose A settings');
ok(!document.querySelector('[data-v2-layer-kind="technical"].document-viewer-backdrop'), 'Document click must not jump directly to the technical viewer');

mark('technical-viewer');
detailLayer?.querySelector('[data-document-content-open]')?.click();
await wait();
let technical = document.querySelector('[data-v2-layer-kind="technical"].document-viewer-backdrop');
ok(Boolean(technical), 'Document information cover did not open technical viewer');
ok(getComputedStyle(technical).backgroundColor === 'rgb(17, 17, 17)', 'Technical viewer backdrop must be black');
ok(Boolean(technical?.querySelector('.document-page')), 'Text document must render as white document page');
technical?.v2Close?.();

mark('other-document-settings');
detailLayer?.querySelector('[data-document-detail-settings]')?.click();
await wait();
let documentSettings = document.querySelector('[data-modal][data-v2-layer-kind="bottom"]');
ok(Boolean(documentSettings?.querySelector('[data-detail-delete]')), 'Other document settings must allow deletion');
documentSettings?.v2Close?.();
detailLayer?.v2Close?.();
await wait();

mark('core-document-settings');
root.querySelector('[data-profile-document="pdn-consent"]')?.click();
await wait();
detailLayer = root.closest('[data-v2-app]')?.querySelector('[data-v2-z-layer]');
detailLayer?.querySelector('[data-document-detail-settings]')?.click();
await wait();
documentSettings = document.querySelector('[data-modal][data-v2-layer-kind="bottom"]');
ok(!documentSettings?.querySelector('[data-detail-delete]'), 'Core document settings must not expose deletion');
ok(Boolean(documentSettings?.querySelector('[data-detail-template]')), 'Core document settings must link to its template');
documentSettings?.v2Close?.();
detailLayer?.v2Close?.();
await wait();

mark('settings-x');
root.querySelector('[data-documents-settings]')?.click();
await wait();
let settingsX = document.querySelector('[data-modal][data-v2-layer-kind="bottom"]');
ok(Boolean(settingsX), 'A must open bottom X');
ok(Boolean(settingsX?.querySelector('[data-open-document-templates]')), 'Templates action missing from A/X');
ok(Boolean(settingsX?.querySelector('[data-add-profile-document]')), 'Add document action missing from A/X');
settingsX?.querySelector('[data-open-document-templates]')?.click();
await wait();

mark('templates-z2');
let templateLayer = root.closest('[data-v2-app]')?.querySelector('[data-v2-z-layer]');
ok(Boolean(templateLayer), 'Templates must open as Z2, not as a second bottom modal');
ok(Boolean(templateLayer?.querySelector('[data-template-open="pdn-consent"]')), 'Current template missing from Templates Z2');
ok(Boolean(templateLayer?.querySelector('[data-template-open="messages-consent"]')), 'Platform template missing when no tenant document exists yet');
templateLayer?.querySelector('[data-template-open="pdn-consent"]')?.click();
await wait();

mark('template-editor-z2');
ok(Boolean(templateLayer?.querySelector('[data-template-form]')), 'Template editor must reuse the same Z2');
let saveSource = templateLayer?.querySelector('[data-template-save]');
const saveActions = saveSource?.closest('.modal-actions');
ok(Boolean(saveSource) && Boolean(saveActions), 'Template editor must expose one bottom Save action');
ok(saveActions?.hidden === true, 'Bottom Save must be hidden before template changes');
ok(!saveSource?.dataset.v2PrimaryVisible, 'Template editor must not keep legacy C visibility metadata');
const templateText = templateLayer?.querySelector('[name="documentText"]');
templateText.value = templateText.value + '\nИзменение пользователя';
templateText.dispatchEvent(new Event('input',{bubbles:true}));
await wait();
ok(saveActions?.hidden === false, 'Bottom Save must appear after template change');
saveSource?.click();
await wait();
const savedTemplate = data.getDocuments().find((item) => item.id === 'pdn-consent');
ok(savedTemplate?.version === 3, 'Template save must create next current version');
ok(savedTemplate?.sourceMode === 'CUSTOM', 'Edited platform template must become tenant-owned CUSTOM current version');
ok(history.getDocumentHistory().some((entry) => entry.documentId === 'pdn-consent' && entry.documentVersion === 2 && entry.snapshot?.text === 'Именно этот текст был подписан.'),
  'Previous template version must remain under the hood as snapshot');
templateLayer?.v2Close?.();
await wait();

mark('history-z1');
root.querySelector('[data-segment-option="history"]')?.click();
await wait();
ok(root.querySelector('[data-segment-option="history"]')?.classList.contains('is-active'), 'History switch did not activate');
ok(root.querySelectorAll('[data-signing-event]').length === 1, 'History must show signing facts only');
ok(root.querySelectorAll('[data-document-history-event]').length === 0, 'Technical document-version events must stay under the hood');
const signingTile = root.querySelector('[data-signing-event="signing-1"]');
ok(signingTile?.textContent.includes('Версия 2'), 'History tile must show signed version');
ok(!signingTile?.textContent.includes('Подписано'), 'History cover must not duplicate signed status as text');
ok(signingTile?.querySelector('.document-tile__status-mark')?.textContent.trim() === '✓', 'Signed history cover must use one black check indicator');
ok(getComputedStyle(signingTile?.querySelector('.document-tile__status-mark')).backgroundColor === 'rgb(255, 255, 255)', 'Signed indicator must stay white instead of a black pill');
ok(!signingTile?.textContent.includes('+79990000000'), 'Person details must not be placed on document cover');
signingTile?.click();
await wait();

mark('signing-info-s');
const signingInfo = document.querySelector('[data-modal][data-v2-layer-kind="top"]');
ok(Boolean(signingInfo?.querySelector('[data-signing-info]')), 'Signing fact must open the top S informational modal');
ok(!root.closest('[data-v2-app]')?.querySelector('[data-v2-z-layer]'), 'Signing fact must not open a Z layer');
ok(!signingInfo?.querySelector('[data-read-only-sheet]'), 'Signing fact must not use receipt UI');
ok(!signingInfo?.querySelector('.document-tile'), 'Signing info must not redraw the document cover');
ok(!signingInfo?.querySelector('button'), 'Signing info must contain no buttons');
ok(signingInfo?.textContent.includes('Согласие на обработку персональных данных'), 'Signing info must show document title');
ok(signingInfo?.textContent.includes('Версия 2'), 'Signing info must show signed version');
ok(signingInfo?.textContent.includes('+79990000000'), 'Signing info must show who signed');
ok(signingInfo?.textContent.includes('Подписано'), 'Signing info must show the action result');
ok(!signingInfo?.textContent.includes('chat'), 'Signing info must not expose the technical source');
signingInfo?.v2Close?.();

mark('controlled-document-ui');
const controlledProbe = document.createElement('div');
controlledProbe.innerHTML = documentTiles([documentTile({
  title:'Согласие на обработку персональных данных',
  version:4,
  openData:'data-controlled-open',
  toggleData:'data-controlled-toggle',
  toggleChecked:true,
  aria:'Открыть документ',
  toggleAria:'Подтвердить документ',
})], { layout:'rail' });
document.body.append(controlledProbe);
const controlledTile = controlledProbe.querySelector('.document-tile');
const controlledOpen = controlledProbe.querySelector('[data-controlled-open]');
const controlledToggle = controlledProbe.querySelector('[data-controlled-toggle]');
ok(Boolean(controlledTile?.classList.contains('document-tile--controlled')), 'Interactive consent must keep the canonical document tile');
ok(getComputedStyle(controlledTile).width === '238px', 'Interactive consent must keep the same 238px document width');
ok(Boolean(controlledOpen) && Boolean(controlledToggle), 'Document open action and yes/no toggle must be separate controls on the same document');
ok(!controlledOpen?.contains(controlledToggle), 'Document toggle must not be nested inside the open button');
ok(controlledToggle?.getAttribute('aria-pressed') === 'true', 'Controlled document must expose the current yes/no state');
ok(controlledTile?.querySelectorAll('.document-tile__title span').length <= 2, 'Controlled document title must stay within two lines');
controlledProbe.remove();

if (failures.length) {
  document.documentElement.dataset.documentsRuntime = 'fail';
  result.textContent = failures.join('\n');
  throw new Error(failures.join(' | '));
}
document.documentElement.dataset.documentsRuntime = 'pass';
document.documentElement.dataset.documentsRuntimeStage = 'done';
result.textContent = 'documents runtime: OK';
</script>
</body>
</html>
