<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>:root{--surface-dark:#2f3338;--button-secondary:#d8d3cf;--text-muted:#817a73;--app-max-width:390px;--visual-vh:844px;--visual-vw:390px;--app-stable-vh:844px}html,body{margin:0;width:390px;height:844px}*{box-sizing:border-box}</style>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/ui/page/page.css">
  <link rel="stylesheet" href="/ui/buttons/buttons.css">
  <link rel="stylesheet" href="/ui/inputs/inputs.css">
  <link rel="stylesheet" href="/ui/selectors/selectors.css">
  <link rel="stylesheet" href="/ui/calendar/calendar.css">
  <link rel="stylesheet" href="/ui/lists/list-entry.css">
  <link rel="stylesheet" href="/ui/time/time.css">
  <link rel="stylesheet" href="/ui/record/record.css">
  <link rel="stylesheet" href="/ui/states/state-view.css">
  <link rel="stylesheet" href="/ui/modals/modal.css">
  <link rel="stylesheet" href="/ui/documents/document.css">
  <link rel="stylesheet" href="/ui/booking/booking.css">
  <link rel="stylesheet" href="/ui/v2/v2.css">
</head>
<body>
<main id="app-content" class="booking-content"></main>
<pre id="result">pending</pre>
<script type="module">
import { renderAccess } from '/online-booking/access.js';

const root = document.querySelector('#app-content');
const result = document.querySelector('#result');
const failures = [];
let stage = 'boot';
const mark = (value) => { stage = value; result.textContent = `running: ${value}`; };
const ok = (condition, message) => { if (!condition) failures.push(`${stage}: ${message}`); };
const wait = (ms = 70) => new Promise((resolve) => setTimeout(resolve, ms));
const click = (node) => node?.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true }));
const input = (node) => node?.dispatchEvent(new Event('input', { bubbles: true }));
const json = (body, status = 200) => new Response(JSON.stringify(body), { status, headers: { 'Content-Type': 'application/json' } });
const dateKey = (date) => `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
const future = (days) => { const date = new Date(); date.setDate(date.getDate() + days); return dateKey(date); };

const tenantId = 'public-variants-tenant';
const workplaceKey = 'public-variants-workplace';
const date1 = future(4);
const date2 = future(5);
const procedures = {
  color: { id: 'color', name: 'Окрашивание', duration: 60, cost: { from: 7000, to: 9000 }, workplaces: [{ workplaceId: workplaceKey, cost: { from: 7000, to: 9000 } }] },
  cut: { id: 'cut', name: 'Стрижка', duration: 30, cost: { amount: 3000 }, workplaces: [{ workplaceId: workplaceKey, cost: { amount: 3000 } }] },
  care: { id: 'care', name: 'Уход', duration: 30, cost: { from: 2500 }, workplaces: [{ workplaceId: workplaceKey, cost: { from: 2500 } }] },
};
const context = {
  tenantId,
  workplaces: [{ key: workplaceKey, name: 'Студия', from: '09:00', to: '18:00', timeZone: 'UTC' }],
  procedures: Object.values(procedures),
  days: [
    { workplaceId: workplaceKey, date: date1, from: '09:00', to: '18:00' },
    { workplaceId: workplaceKey, date: date2, from: '09:00', to: '18:00' },
  ],
  occupancy: [],
  documents: [
    { id: 'pdn-consent', title: 'Согласие на обработку персональных данных', version: 5, personConsent: true, required: true, text: 'Актуальный текст ПДн' },
    { id: 'messages-consent', title: 'Согласие на рекламные сообщения', version: 4, personConsent: true, required: false, text: 'Актуальный рекламный текст' },
  ],
  settings: { slotStep: 30 },
};

let legalMode = 'active';
let confirmMode = 'success';
let confirmCalls = [];
let accountRequests = 0;

const originalFetch = window.fetch.bind(window);
window.fetch = async (inputValue, options = {}) => {
  const url = new URL(typeof inputValue === 'string' ? inputValue : inputValue.url, location.origin);
  const path = url.pathname;
  const method = String(options.method || inputValue?.method || 'GET').toUpperCase();
  if (path === `/online-booking/${tenantId}/context` && method === 'GET') return json(context);
  if (path === `/online-booking/${tenantId}/booking-state` && method === 'POST') {
    if (legalMode === 'error') return json({ message: 'lookup failed' }, 503);
    if (legalMode === 'delayed-active') await wait(900);
    const pdnActive = ['active', 'pdn-active', 'delayed-active'].includes(legalMode);
    const marketingActive = ['active', 'marketing-active', 'old-pdn', 'delayed-active'].includes(legalMode);
    return json({ person: null, ambiguous: false, consents: [
      { documentId: 'pdn-consent', documentVersion: legalMode === 'old-pdn' ? 4 : 5, required: true, marketing: false, active: pdnActive },
      { documentId: 'messages-consent', documentVersion: 4, required: false, marketing: true, active: marketingActive },
    ] });
  }
  if (path === `/online-booking/${tenantId}/confirm` && method === 'POST') {
    const payload = JSON.parse(String(options.body || '{}'));
    confirmCalls.push(payload);
    if (confirmMode === 'conflict-once') {
      confirmMode = 'success';
      return json({ message: 'Это время уже занято' }, 409);
    }
    return json({
      bookingSessionId: `session-${confirmCalls.length}`,
      workplaceKey,
      date: payload.date,
      from: payload.from,
      to: '12:00',
      records: payload.participants.map((participant, index) => ({
        id: `record-${confirmCalls.length}-${index}`,
        person: { key: `person-${index}`, name: participant.name, phone: participant.phone || '' },
        procedures: participant.procedureIds.map((id) => procedures[id]),
        from: index === 0 ? payload.from : '10:00',
        to: index === 0 ? '10:00' : '10:30',
      })),
    });
  }
  if (path.includes('/account/') || path.endsWith('/account')) {
    accountRequests += 1;
    return json({ message: 'App account endpoint forbidden in public Booking' }, 500);
  }
  failures.push(`${stage}: unexpected fetch ${method} ${path}`);
  return json({ message: 'unexpected' }, 404);
};

function bookingLayer() { return document.querySelector('.booking-technical-modal'); }
function closeButton() { return bookingLayer()?.querySelector('.v2-layer__close'); }
function backButton() { return bookingLayer()?.querySelector('[data-booking-back]'); }
function flowText() { return String(bookingLayer()?.textContent || '').replace(/\s+/g, ' ').trim(); }
function currentTitle() { return bookingLayer()?.querySelector('[data-booking-flow] .booking-flow__header h2')?.textContent?.trim() || ''; }
function setPhone(form, name, value) {
  const hidden = form?.querySelector(`input[name="${name}"]`);
  const host = hidden?.closest('[data-phone-input]');
  const visible = host?.querySelector('[data-phone-national]');
  if (hidden) hidden.value = value;
  if (visible) visible.value = value.replace(/^\+7/, '');
  if (host) host.dataset.phoneComplete = 'true';
}
function setInput(form, name, value) {
  const control = form?.querySelector(`[name="${name}"]`);
  if (control) control.value = value;
}
function chooseDate(value) { click(document.querySelector(`[data-calendar-date="${value}"]`)); }
function chooseFirstTime() { click(document.querySelector('[data-booking-time]:not(:disabled)')); }
function selectProcedure(id) { click(document.querySelector(`[data-booking-procedure="${id}"]`)); }
async function xAndResume(expected) {
  const before = confirmCalls.length;
  click(closeButton());
  await wait();
  ok(flowText().includes('Запись не оформлена'), `X did not open unified exit at ${expected}`);
  ok(confirmCalls.length === before, `X created Record at ${expected}`);
  click(document.querySelector('[data-booking-resume]'));
  await wait();
  ok(flowText().includes(expected), `Continue did not resume ${expected}`);
}
async function cleanup(dispose) {
  dispose?.();
  await wait(20);
  document.querySelectorAll('.v2-layer-portal').forEach((node) => node.remove());
  document.querySelectorAll('.v2-layer-backdrop').forEach((node) => node.remove());
  root.innerHTML = '';
  history.replaceState({}, '', '/public-variants');
}
async function reachSelfAfterTime(mode, phone) {
  legalMode = mode;
  confirmMode = 'success';
  const dispose = await renderAccess(root, { tenantId, workplaceKey });
  await wait();
  click(document.querySelector('[data-booking-mode="self"]')); await wait();
  const form = document.querySelector('[data-booking-data-form]');
  setInput(form, 'bookerName', 'Алекс тест');
  setPhone(form, 'bookerPhone', phone);
  click(document.querySelector('[data-booking-data-next]')); await wait();
  selectProcedure('cut');
  click(document.querySelector('[data-booking-services-next]')); await wait();
  chooseDate(date1); await wait(); click(document.querySelector('[data-booking-date-next]')); await wait();
  chooseFirstTime(); await wait(); click(document.querySelector('[data-booking-time-next]')); await wait(90);
  return dispose;
}

// Shared phone: compact closed prefix, country names only in the opened Shared selector, canonical international value preserved.
mark('shared-phone');
legalMode = 'active';
let dispose = await renderAccess(root, { tenantId, workplaceKey });
await wait();
click(document.querySelector('[data-booking-mode="self"]')); await wait();
let form = document.querySelector('[data-booking-data-form]');
let phoneHost = form?.querySelector('.booking-participant--booker [data-phone-input]');
let countryTrigger = phoneHost?.querySelector('[data-ui-select-trigger]');
ok(countryTrigger?.querySelector('.ui-select__value')?.textContent.trim() === '+7', 'closed phone selector must show only +7');
ok(getComputedStyle(phoneHost).gridTemplateColumns.split(' ')[0] === '60px', 'phone prefix column is not compact');
click(countryTrigger); await wait();
let selector = document.querySelector('[data-ui-selector]');
ok(selector?.textContent.includes('Россия +7'), 'opened selector must show country name and +7');
ok(selector?.textContent.includes('Германия +49'), 'opened selector must show international country names and prefixes');
click(selector?.querySelector('[data-ui-select-option][data-value="DE"]')); await wait();
countryTrigger = phoneHost?.querySelector('[data-ui-select-trigger]');
ok(countryTrigger?.querySelector('.ui-select__value')?.textContent.trim() === '+49', 'closed selector kept country name after DE selection');
const national = phoneHost?.querySelector('[data-phone-national]');
if (national) { national.value = '151 23456789'; input(national); }
ok(phoneHost?.querySelector('[data-phone-value]')?.value === '+4915123456789', 'international canonical phone was not preserved');
click(countryTrigger); await wait();
selector = document.querySelector('[data-ui-selector]');
click(selector?.querySelector('[data-ui-select-option][data-value="RU"]')); await wait();
ok(phoneHost?.querySelector('.ui-select__value')?.textContent.trim() === '+7', 'closed selector did not return to +7-only label');
await cleanup(dispose);

// Both current consents: skip the consent step entirely; fixed price remains exact in services, preview and success.
mark('other-active');
legalMode = 'active';
confirmMode = 'success';
dispose = await renderAccess(root, { tenantId, workplaceKey });
await wait();
ok(!backButton(), 'first visible step has Back');
await xAndResume('Как оформить запись?');
click(document.querySelector('[data-booking-mode="other"]')); await wait();
const otherForm = document.querySelector('[data-booking-data-form]');
setInput(otherForm, 'bookerName', 'Наталья');
setPhone(otherForm, 'bookerPhone', '+79990000001');
setInput(otherForm, 'participantName0', 'Маша');
click(document.querySelector('[data-booking-data-next]')); await wait();
mark('other-services');
ok(document.querySelector('[data-booking-procedure="cut"]')?.textContent.includes('3 000 ₽'), 'fixed service price is not exact');
ok(document.querySelector('[data-booking-procedure="color"]')?.textContent.includes('от 7 000 ₽'), 'range service price lost the from meaning');
ok(document.querySelector('[data-booking-procedure="care"]')?.textContent.includes('от 2 500 ₽'), 'from service price lost the from meaning');
selectProcedure('cut');
click(document.querySelector('[data-booking-services-next]')); await wait();
chooseDate(date1); await wait(); click(document.querySelector('[data-booking-date-next]')); await wait();
chooseFirstTime(); await wait(); click(document.querySelector('[data-booking-time-next]')); await wait(130);
mark('other-preview');
ok(currentTitle() === 'Запись', 'active consents did not skip directly to preview');
ok(!document.querySelector('[data-booking-consents-next]'), 'active consents left an empty consent step');
ok(!bookingLayer()?.querySelector('.booking-summary h3'), 'preview has a duplicate inner heading');
ok(!flowText().includes('Оформляет'), 'preview still exposes the Oformlyaet label');
ok(flowText().includes('Маша') && flowText().includes('3 000 ₽'), 'single participant fixed price missing');
ok(!flowText().includes('Итого'), 'single participant must not duplicate the same price as total');
ok(flowText().includes('Наталья') && flowText().includes('+7 999 000-00-01'), 'booker details are missing without the label');
click(document.querySelector('[data-booking-confirm]')); await wait(140);
mark('other-result');
const otherPayload = confirmCalls.at(-1);
ok(otherPayload?.mode === 'other', 'other booking mode lost');
ok(otherPayload?.participants?.length === 1 && otherPayload.participants[0]?.name === 'Маша', 'recipient was not the Record participant');
ok(!otherPayload?.participants?.[0]?.phone, 'recipient phone became mandatory unexpectedly');
ok(currentTitle() === 'Запись подтверждена', 'other booking did not finish locally');
ok(!bookingLayer()?.querySelector('.booking-summary h3'), 'success has a duplicate inner heading');
ok(!flowText().includes('Оформляет'), 'success restored the Oformlyaet label');
ok(flowText().includes('3 000 ₽'), 'success lost the fixed participant price');
await cleanup(dispose);

// Partial consent states: current PDN hides only PDN; old PDN/current marketing shows the new PDN only.
mark('partial-marketing-only');
dispose = await reachSelfAfterTime('pdn-active', '+79990000003');
ok(currentTitle() === 'Согласия', 'partial consent state did not show consent step');
ok(!document.querySelector('[data-booking-consent="pdn-consent"]'), 'current PDN was asked again');
ok(Boolean(document.querySelector('[data-booking-consent="messages-consent"]')), 'missing advertising consent was not shown');
ok(!document.querySelector('[data-booking-consents-next]')?.disabled, 'optional advertising consent blocked booking');
await cleanup(dispose);

mark('old-pdn');
dispose = await reachSelfAfterTime('old-pdn', '+79990000004');
ok(Boolean(document.querySelector('[data-booking-consent="pdn-consent"]')), 'old PDN version did not require the current document');
ok(!document.querySelector('[data-booking-consent="messages-consent"]'), 'current advertising consent was asked again');
await cleanup(dispose);

// Lookup failure must not be treated as a new person with no consent history.
mark('lookup-error');
dispose = await reachSelfAfterTime('error', '+79990000005');
ok(currentTitle() === 'Согласия', 'lookup error left the consent boundary');
ok(flowText().includes('lookup failed'), 'lookup error is not visible');
ok(!document.querySelector('[data-booking-consent]'), 'lookup error was treated as missing consent history');
ok(!document.querySelector('[data-booking-consents-next]'), 'lookup error incorrectly allowed continuation');
ok(Boolean(document.querySelector('[data-booking-consents-retry]')), 'lookup error has no retry action');
await cleanup(dispose);

// Pending lookup must wait, then active consents must skip the empty consent screen.
mark('lookup-pending');
dispose = await reachSelfAfterTime('delayed-active', '+79990000006');
ok(currentTitle() === 'Согласия' && flowText().includes('Проверяем действующие согласия'), 'pending lookup was treated as missing consent history');
ok(!document.querySelector('[data-booking-consent]'), 'pending lookup rendered consent documents early');
await wait(850);
ok(currentTitle() === 'Запись', 'resolved current consents did not auto-skip to preview');
await cleanup(dispose);

// Joint booking: two independent documents vertically, clear toggle ON, participant prices and variable total.
mark('joint-open');
legalMode = 'missing';
confirmMode = 'conflict-once';
dispose = await renderAccess(root, { tenantId, workplaceKey });
await wait();
click(document.querySelector('[data-booking-mode="joint"]')); await wait();
const jointForm = document.querySelector('[data-booking-data-form]');
setInput(jointForm, 'bookerName', 'Наталья');
setPhone(jointForm, 'bookerPhone', '+79990000002');
setInput(jointForm, 'participantName0', 'Маша');
click(document.querySelector('[data-booking-data-next]')); await wait();
mark('joint-services-first');
selectProcedure('color');
click(document.querySelector('[data-booking-services-next]')); await wait();
mark('joint-services-second');
selectProcedure('cut');
selectProcedure('care');
click(document.querySelector('[data-booking-services-next]')); await wait();
chooseDate(date2); await wait(); click(document.querySelector('[data-booking-date-next]')); await wait();
chooseFirstTime(); await wait(); click(document.querySelector('[data-booking-time-next]')); await wait(120);
mark('joint-consents');
const consentCards = document.querySelector('.document-tiles');
let pdn = document.querySelector('[data-booking-consent="pdn-consent"]');
const marketing = document.querySelector('[data-booking-consent="messages-consent"]');
ok(Boolean(pdn), 'new person PDN was not shown');
ok(Boolean(marketing), 'new person advertising consent was not shown');
ok(consentCards?.children.length === 2 && getComputedStyle(consentCards).display === 'grid', 'consents are not two independent vertical Shared document tiles');
ok(marketing?.getAttribute('aria-pressed') === 'false', 'advertising consent was enabled by default');
const offTrack = pdn ? getComputedStyle(pdn).backgroundColor : '';
click(pdn); await wait();
pdn = document.querySelector('[data-booking-consent="pdn-consent"]');
const onTrack = pdn ? getComputedStyle(pdn).backgroundColor : '';
ok(pdn?.classList.contains('is-on'), 'PDN toggle thumb state did not switch on');
ok(Boolean(offTrack && onTrack && offTrack !== onTrack), 'Shared controlled toggle track does not visibly change ON state');
const consentNext = document.querySelector('[data-booking-consents-next]');
ok(Boolean(consentNext) && !consentNext.disabled, 'required PDN did not enable continuation');
ok(consentCards?.compareDocumentPosition(consentNext) & Node.DOCUMENT_POSITION_FOLLOWING, 'Continue is not visually after both consent documents');
click(consentNext); await wait();
mark('joint-preview');
const participantSummaries = [...document.querySelectorAll('.booking-summary__participant')].map((node) => node.textContent.replace(/\s+/g, ' ').trim());
ok(participantSummaries[0]?.includes('Наталья') && participantSummaries[0]?.includes('Окрашивание') && participantSummaries[0]?.includes('от 7 000 ₽'), 'range participant price is wrong');
ok(participantSummaries[0]?.includes('+7 999 000-00-02'), 'participant phone is missing when it exists');
ok(participantSummaries[1]?.includes('Маша') && participantSummaries[1]?.includes('Стрижка') && participantSummaries[1]?.includes('Уход') && participantSummaries[1]?.includes('от 5 500 ₽'), 'mixed fixed/from participant sum is wrong');
ok(!participantSummaries[1]?.includes('+7'), 'empty participant phone rendered a blank phone line');
ok(flowText().includes('Итого') && flowText().includes('от 12 500 ₽'), 'joint variable total is wrong');
ok(!bookingLayer()?.querySelector('.booking-summary h3') && !flowText().includes('Оформляет'), 'joint preview restored duplicate heading or Oformlyaet label');
const beforeConflict = confirmCalls.length;
click(document.querySelector('[data-booking-confirm]')); await wait(160);
mark('joint-slot-conflict');
ok(confirmCalls.length === beforeConflict + 1, 'slot conflict did not reach final availability check');
ok(currentTitle() === 'Время', 'slot conflict did not return to time');
chooseFirstTime(); await wait(); click(document.querySelector('[data-booking-time-next]')); await wait();
click(document.querySelector('[data-booking-consents-next]')); await wait();
click(document.querySelector('[data-booking-confirm]')); await wait(160);
mark('joint-result');
const jointPayload = confirmCalls.at(-1);
ok(jointPayload?.mode === 'joint', 'joint mode lost');
ok(jointPayload?.participants?.length === 2, 'joint booking did not submit two ordinary Record participants');
ok(jointPayload?.participants?.[0]?.procedureIds?.includes('color'), 'Natalia services lost');
ok(jointPayload?.participants?.[1]?.procedureIds?.includes('cut') && jointPayload?.participants?.[1]?.procedureIds?.includes('care'), 'Masha services lost');
ok(jointPayload?.consents?.find((item) => item.documentId === 'messages-consent')?.accepted === false, 'advertising consent was forced');
ok(currentTitle() === 'Запись подтверждена', 'joint booking did not finish locally');
ok(flowText().includes('от 7 000 ₽') && flowText().includes('от 5 500 ₽') && flowText().includes('от 12 500 ₽'), 'success summary lost participant or total price semantics');
ok(!bookingLayer()?.querySelector('.booking-summary h3') && !flowText().includes('Оформляет'), 'success restored duplicate heading or Oformlyaet label');
await cleanup(dispose);

// Several participants, all services fixed: total must remain exact without "от".
mark('joint-fixed-total');
legalMode = 'active';
confirmMode = 'success';
dispose = await renderAccess(root, { tenantId, workplaceKey });
await wait();
click(document.querySelector('[data-booking-mode="joint"]')); await wait();
form = document.querySelector('[data-booking-data-form]');
setInput(form, 'bookerName', 'Наталья');
setPhone(form, 'bookerPhone', '+79990000007');
setInput(form, 'participantName0', 'Маша');
click(document.querySelector('[data-booking-data-next]')); await wait();
selectProcedure('cut'); click(document.querySelector('[data-booking-services-next]')); await wait();
selectProcedure('cut'); click(document.querySelector('[data-booking-services-next]')); await wait();
chooseDate(date1); await wait(); click(document.querySelector('[data-booking-date-next]')); await wait();
chooseFirstTime(); await wait(); click(document.querySelector('[data-booking-time-next]')); await wait(120);
ok(currentTitle() === 'Запись', 'all-current consents did not skip in fixed joint flow');
ok(flowText().includes('Итого') && flowText().includes('6 000 ₽') && !flowText().includes('Итого от'), 'all-fixed joint total incorrectly became variable');
await cleanup(dispose);

ok(accountRequests === 0, 'public variants loaded Account/App endpoints');
window.fetch = originalFetch;
if (failures.length) {
  document.documentElement.dataset.publicBookingVariantsRuntime = 'fail';
  result.textContent = failures.join('\n');
} else {
  document.documentElement.dataset.publicBookingVariantsRuntime = 'pass';
  result.textContent = 'public booking variants runtime passed';
}
</script>
</body>
</html>
