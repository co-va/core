<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>:root{--surface-dark:#2f3338;--button-secondary:#d8d3cf;--text-muted:#817a73;--app-max-width:390px;--visual-vh:844px;--visual-vw:390px;--app-stable-vh:844px}html,body{margin:0;width:390px;height:844px}*{box-sizing:border-box}</style>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/ui/page/page.css">
  <link rel="stylesheet" href="/ui/buttons/buttons.css">
  <link rel="stylesheet" href="/ui/inputs/inputs.css">
  <link rel="stylesheet" href="/ui/selectors/selectors.css">
  <link rel="stylesheet" href="/ui/calendar/calendar.css">
  <link rel="stylesheet" href="/ui/lists/list-entry.css">
  <link rel="stylesheet" href="/ui/time/time.css">
  <link rel="stylesheet" href="/ui/record/record.css">
  <link rel="stylesheet" href="/ui/states/state-view.css">
  <link rel="stylesheet" href="/ui/modals/modal.css">
  <link rel="stylesheet" href="/ui/documents/document.css">
  <link rel="stylesheet" href="/ui/booking/booking.css">
  <link rel="stylesheet" href="/ui/v2/v2.css">
</head>
<body>
<div id="app" class="app-shell app-shell--booking"><main id="app-content" class="booking-content"></main></div>
<pre id="result">pending</pre>
<script type="module">
import { renderAccess } from '/online-booking/access.js';

const root = document.querySelector('#app-content');
const result = document.querySelector('#result');
const failures = [];
let stage = 'boot';
const mark = (value) => { stage = value; result.textContent = `running: ${value}`; document.documentElement.dataset.publicBookingVariantsRuntimeStage = value; };
const ok = (condition, message) => { if (!condition) failures.push(`${stage}: ${message}`); };
const wait = (ms = 70) => new Promise((resolve) => setTimeout(resolve, ms));
async function waitUntil(predicate, { attempts = 40, interval = 25 } = {}) {
  for (let attempt = 0; attempt < attempts; attempt += 1) {
    if (predicate()) return true;
    await wait(interval);
  }
  return Boolean(predicate());
}
const click = (node) => node?.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true }));
const input = (node) => node?.dispatchEvent(new Event('input', { bubbles: true }));
const json = (body, status = 200) => new Response(JSON.stringify(body), { status, headers: { 'Content-Type': 'application/json' } });
const cleanText = (value) => String(value || '').replace(/\s+/g, ' ').trim();
const nodeText = (node) => cleanText(node?.textContent);
const dateKey = (date) => `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
const future = (days) => { const date = new Date(); date.setDate(date.getDate() + days); return dateKey(date); };

window.addEventListener('error', (event) => failures.push(`${stage}: window error: ${event.error?.message || event.message}`));
window.addEventListener('unhandledrejection', (event) => failures.push(`${stage}: rejection: ${event.reason?.message || event.reason || 'unknown'}`));

const tenantId = 'public-variants-tenant';
const workplaceKey = 'public-variants-workplace';
const date1 = future(4);
const date2 = future(5);
const procedures = {
  color: { id: 'color', name: 'Окрашивание', duration: 60, cost: { amount: 111 }, workplaces: [{ workplaceId: workplaceKey, cost: { amount: 222 }, bookingPrice: { minimum: 7000, variable: true, free: false } }] },
  cut: { id: 'cut', name: 'Стрижка', duration: 30, cost: { from: 1, to: 99999 }, workplaces: [{ workplaceId: workplaceKey, cost: { from: 2, to: 99999 }, bookingPrice: { minimum: 3000, variable: false, free: false } }] },
  care: { id: 'care', name: 'Уход', duration: 30, cost: { amount: 3 }, workplaces: [{ workplaceId: workplaceKey, cost: { amount: 4 }, bookingPrice: { minimum: 2500, variable: true, free: false } }] },
};
const context = {
  tenantId,
  workplaces: [{ key: workplaceKey, name: 'Студия', from: '09:00', to: '18:00', timeZone: 'UTC' }],
  procedures: Object.values(procedures),
  days: [
    { workplaceId: workplaceKey, date: date1, from: '09:00', to: '18:00' },
    { workplaceId: workplaceKey, date: date2, from: '09:00', to: '18:00' },
  ],
  occupancy: [],
  documents: [
    { id: 'pdn-consent', title: 'Согласие на обработку персональных данных', version: 5, personConsent: true, required: true, text: 'Актуальный текст ПДн' },
    { id: 'messages-consent', title: 'Согласие на рекламные сообщения', version: 4, personConsent: true, required: false, text: 'Актуальный рекламный текст' },
  ],
  settings: { slotStep: 30 },
};

let legalMode = 'active';
let confirmMode = 'success';
const confirmCalls = [];
let accountRequests = 0;
const originalFetch = window.fetch.bind(window);
window.fetch = async (inputValue, options = {}) => {
  const url = new URL(typeof inputValue === 'string' ? inputValue : inputValue.url, location.origin);
  const path = url.pathname;
  const method = String(options.method || inputValue?.method || 'GET').toUpperCase();
  if (path === `/online-booking/${tenantId}/context` && method === 'GET') return json(context);
  if (path === `/online-booking/${tenantId}/booking-state` && method === 'POST') {
    if (legalMode === 'error') return json({ message: 'lookup failed' }, 503);
    if (legalMode === 'delayed-active') await wait(900);
    const pdnActive = ['active', 'pdn-active', 'delayed-active'].includes(legalMode);
    const marketingActive = ['active', 'marketing-active', 'delayed-active'].includes(legalMode);
    return json({ person: null, ambiguous: false, legalState: { pdnActive, marketingActive }, consents: [
      { documentId: 'pdn-consent', required: true, marketing: false, active: pdnActive },
      { documentId: 'messages-consent', required: false, marketing: true, active: marketingActive },
    ] });
  }
  if (path === `/online-booking/${tenantId}/confirm` && method === 'POST') {
    const payload = JSON.parse(String(options.body || '{}'));
    confirmCalls.push(payload);
    if (confirmMode === 'conflict-once') {
      confirmMode = 'success';
      return json({ message: 'Это время уже занято' }, 409);
    }
    return json({ bookingSessionId: `session-${confirmCalls.length}`, workplaceKey, date: payload.date, from: payload.from, to: '12:00', records: payload.participants.map((participant, index) => ({ id: `record-${confirmCalls.length}-${index}`, person: { key: `person-${index}`, name: participant.name, phone: participant.phone || '' }, procedures: participant.procedureIds.map((id) => procedures[id]), from: index === 0 ? payload.from : '10:00', to: index === 0 ? '10:00' : '10:30' })) });
  }
  if (path.includes('/account/') || path.endsWith('/account')) {
    accountRequests += 1;
    return json({ message: 'App account endpoint forbidden in public Booking' }, 500);
  }
  failures.push(`${stage}: unexpected fetch ${method} ${path}`);
  return json({ message: 'unexpected' }, 404);
};

function bookingLayer() { return document.querySelector('.booking-technical-modal'); }
function flowText() { return nodeText(bookingLayer()); }
function currentTitle() { return cleanText(bookingLayer()?.querySelector('[data-booking-flow] .booking-flow__header h2')?.textContent); }
function legalBoundarySettled() {
  const title = currentTitle();
  if (title === 'Запись') return true;
  if (title !== 'Согласия') return false;
  if (document.querySelector('[data-booking-consents-retry],[data-booking-consents-next]')) return true;
  return !flowText().includes('Проверяем действующие согласия');
}
function setInput(form, name, value) { const control = form?.querySelector(`[name="${name}"]`); if (control) control.value = value; }
function setPhone(form, name, value) {
  const hidden = form?.querySelector(`input[name="${name}"]`);
  const host = hidden?.closest('[data-phone-input]');
  const visible = host?.querySelector('[data-phone-national]');
  if (hidden) hidden.value = value;
  if (visible) visible.value = value.replace(/^\+7/, '');
  if (host) host.dataset.phoneComplete = 'true';
}
function chooseDate(value) { click(document.querySelector(`[data-calendar-date="${value}"]`)); }
function chooseFirstTime() { click(document.querySelector('[data-booking-time]:not(:disabled)')); }
function selectProcedure(id) { click(document.querySelector(`[data-booking-procedure="${id}"]`)); }
async function cleanup(dispose) {
  dispose?.();
  await wait(20);
  document.querySelectorAll('.v2-layer-portal,.v2-layer-backdrop').forEach((node) => node.remove());
  root.innerHTML = '';
  history.replaceState({}, '', '/public-variants');
}
async function start(mode = 'self', phone = '+79990000001') {
  const dispose = await renderAccess(root, { tenantId, workplaceKey });
  await wait();
  click(document.querySelector(`[data-booking-mode="${mode}"]`));
  await wait();
  const form = document.querySelector('[data-booking-data-form]');
  setInput(form, 'bookerName', 'Наталья');
  setPhone(form, 'bookerPhone', phone);
  return { dispose, form };
}
async function toTime(mode, phone, configureParticipants, serviceSets, targetDate = date1, { waitForLegal = true } = {}) {
  const session = await start(mode, phone);
  configureParticipants?.(session.form);
  click(document.querySelector('[data-booking-data-next]')); await wait();
  for (const services of serviceSets) {
    services.forEach(selectProcedure);
    click(document.querySelector('[data-booking-services-next]')); await wait();
  }
  chooseDate(targetDate); await wait();
  click(document.querySelector('[data-booking-date-next]')); await wait();
  chooseFirstTime(); await wait();
  click(document.querySelector('[data-booking-time-next]'));
  if (waitForLegal) await waitUntil(legalBoundarySettled);
  else await wait(100);
  return session.dispose;
}

mark('shared-phone');
legalMode = 'active';
let { dispose, form } = await start('self', '+79990000001');
let phoneHost = form.querySelector('.booking-participant--booker [data-phone-input]');
let trigger = phoneHost?.querySelector('[data-ui-select-trigger]');
ok(cleanText(trigger?.querySelector('.ui-select__value')?.textContent) === '+7', 'closed phone selector must show only +7');
const firstColumn = parseFloat(getComputedStyle(phoneHost).gridTemplateColumns.split(/\s+/)[0] || '0');
ok(firstColumn >= 59 && firstColumn <= 61, `phone prefix column is not compact: ${firstColumn}`);
click(trigger); await wait(140);
let selector = [...document.querySelectorAll('[data-ui-selector]')].at(-1);
ok(nodeText(selector).includes('Россия +7'), 'opened selector must show country name and +7');
ok(nodeText(selector).includes('Германия +49'), 'opened selector must show international country names and prefixes');
click(selector?.querySelector('[data-ui-select-option][data-value="DE"]')); await wait(100);
trigger = phoneHost?.querySelector('[data-ui-select-trigger]');
ok(cleanText(trigger?.querySelector('.ui-select__value')?.textContent) === '+49', 'closed selector must return to prefix-only after DE selection');
const national = phoneHost?.querySelector('[data-phone-national]');
if (national) { national.value = '151 23456789'; input(national); }
ok(phoneHost?.querySelector('[data-phone-value]')?.value === '+4915123456789', 'international canonical phone was not preserved');
await cleanup(dispose);

mark('fixed-and-range');
legalMode = 'active';
({ dispose, form } = await start('other', '+79990000002'));
setInput(form, 'participantName0', 'Маша');
click(document.querySelector('[data-booking-data-next]')); await wait();
ok(nodeText(document.querySelector('[data-booking-procedure="cut"]')).includes('3 000 ₽'), 'fixed service price is not exact');
ok(nodeText(document.querySelector('[data-booking-procedure="color"]')).includes('от 7 000 ₽'), 'range service price lost the from meaning');
ok(nodeText(document.querySelector('[data-booking-procedure="care"]')).includes('от 2 500 ₽'), 'from service price lost the from meaning');
selectProcedure('cut'); click(document.querySelector('[data-booking-services-next]')); await wait();
chooseDate(date1); await wait(); click(document.querySelector('[data-booking-date-next]')); await wait();
chooseFirstTime(); await wait(); click(document.querySelector('[data-booking-time-next]')); await waitUntil(() => currentTitle() === 'Запись');
ok(currentTitle() === 'Запись', 'two current consents did not skip directly to preview');
ok(!document.querySelector('[data-booking-consents-next]'), 'current consents left an empty consent step');
ok(!bookingLayer()?.querySelector('.booking-summary h3'), 'preview has a duplicate inner heading');
ok(!flowText().includes('Оформляет'), 'preview still exposes the Oformlyaet label');
ok(flowText().includes('Маша') && flowText().includes('3 000 ₽'), 'single participant fixed price missing');
ok(!flowText().includes('Итого'), 'single participant must not duplicate total');
ok(flowText().includes('Наталья') && flowText().includes('+7 999 000-00-02'), 'booker details are missing without a label');
click(document.querySelector('[data-booking-confirm]')); await waitUntil(() => currentTitle() === 'Запись подтверждена');
ok(currentTitle() === 'Запись подтверждена', 'success title is wrong');
ok(!bookingLayer()?.querySelector('.booking-summary h3') && !flowText().includes('Оформляет'), 'success restored duplicate heading or Oformlyaet');
ok(flowText().includes('3 000 ₽'), 'success lost participant price');
await cleanup(dispose);

mark('partial-consents');
legalMode = 'pdn-active';
dispose = await toTime('self', '+79990000003', null, [['cut']]);
ok(currentTitle() === 'Согласия', 'partial consent state did not show consent step');
ok(!document.querySelector('[data-booking-consent="pdn-consent"]'), 'current PDN was asked again');
ok(Boolean(document.querySelector('[data-booking-consent="messages-consent"]')), 'missing advertising consent was not shown');
ok(!document.querySelector('[data-booking-consents-next]')?.disabled, 'optional advertising consent blocked booking');
await cleanup(dispose);

mark('ready-consent-state');
legalMode = 'marketing-active';
dispose = await toTime('self', '+79990000004', null, [['cut']]);
ok(Boolean(document.querySelector('[data-booking-consent="pdn-consent"]')), 'inactive current PDN state was not shown');
ok(!document.querySelector('[data-booking-consent="messages-consent"]'), 'active current advertising state was asked again');
await cleanup(dispose);

mark('lookup-error');
legalMode = 'error';
dispose = await toTime('self', '+79990000005', null, [['cut']]);
ok(currentTitle() === 'Согласия' && flowText().includes('lookup failed'), 'lookup error was not held at consent boundary');
ok(!document.querySelector('[data-booking-consent]') && !document.querySelector('[data-booking-consents-next]'), 'lookup error was treated as missing current state');
ok(Boolean(document.querySelector('[data-booking-consents-retry]')), 'lookup error has no retry action');
await cleanup(dispose);

mark('lookup-pending');
legalMode = 'delayed-active';
dispose = await toTime('self', '+79990000006', null, [['cut']], date1, { waitForLegal: false });
ok(currentTitle() === 'Согласия' && flowText().includes('Проверяем действующие согласия'), 'pending lookup was treated as missing current state');
ok(!document.querySelector('[data-booking-consent]'), 'pending lookup rendered documents early');
await waitUntil(() => currentTitle() === 'Запись', { attempts: 60, interval: 25 });
ok(currentTitle() === 'Запись', 'resolved current consents did not auto-skip to preview');
await cleanup(dispose);

mark('joint-variable');
legalMode = 'missing';
confirmMode = 'conflict-once';
dispose = await toTime('joint', '+79990000007', (jointForm) => setInput(jointForm, 'participantName0', 'Маша'), [['color'], ['cut', 'care']], date2);
const cardsBefore = document.querySelector('.document-tiles');
let pdn = document.querySelector('[data-booking-consent="pdn-consent"]');
const marketing = document.querySelector('[data-booking-consent="messages-consent"]');
ok(Boolean(pdn) && Boolean(marketing), 'new person must see both existing consent documents');
ok(cardsBefore?.children.length === 2 && getComputedStyle(cardsBefore).display === 'grid', 'consents are not two vertical Shared tiles');
ok(marketing?.getAttribute('aria-pressed') === 'false', 'advertising consent was enabled by default');
const offTrack = pdn ? getComputedStyle(pdn).backgroundColor : '';
click(pdn); await wait();
pdn = document.querySelector('[data-booking-consent="pdn-consent"]');
const onTrack = pdn ? getComputedStyle(pdn).backgroundColor : '';
ok(pdn?.classList.contains('is-on') && offTrack !== onTrack, 'Shared toggle ON state is not visually explicit');
const consentNext = document.querySelector('[data-booking-consents-next]');
const cardsAfter = document.querySelector('.document-tiles');
ok(Boolean(consentNext) && !consentNext.disabled, 'required PDN did not enable continuation');
ok(Boolean(cardsAfter?.compareDocumentPosition(consentNext) & Node.DOCUMENT_POSITION_FOLLOWING), 'Continue is not after both documents');
click(consentNext); await wait();
const summaries = [...document.querySelectorAll('.booking-summary__participant')].map(nodeText);
ok(summaries[0]?.includes('Наталья') && summaries[0]?.includes('Окрашивание') && summaries[0]?.includes('от 7 000 ₽'), 'range participant price is wrong');
ok(summaries[0]?.includes('+7 999 000-00-07'), 'participant phone is missing when present');
ok(summaries[1]?.includes('Маша') && summaries[1]?.includes('Стрижка') && summaries[1]?.includes('Уход') && summaries[1]?.includes('от 5 500 ₽'), 'mixed fixed/from participant sum is wrong');
ok(!summaries[1]?.includes('+7'), 'empty participant phone was rendered');
ok(flowText().includes('Итого') && flowText().includes('от 12 500 ₽'), 'variable joint total is wrong');
click(document.querySelector('[data-booking-confirm]')); await waitUntil(() => currentTitle() === 'Время');
ok(currentTitle() === 'Время', 'slot conflict did not return to time');
chooseFirstTime(); await wait(); click(document.querySelector('[data-booking-time-next]')); await wait();
click(document.querySelector('[data-booking-consents-next]')); await wait();
click(document.querySelector('[data-booking-confirm]')); await waitUntil(() => currentTitle() === 'Запись подтверждена');
const jointPayload = confirmCalls.at(-1);
ok(jointPayload?.participants?.length === 2, 'joint booking did not submit two normal participants');
ok(jointPayload?.consents?.find((item) => item.documentId === 'messages-consent')?.accepted === false, 'advertising consent was forced');
ok(currentTitle() === 'Запись подтверждена', 'joint booking did not finish locally');
ok(flowText().includes('от 7 000 ₽') && flowText().includes('от 5 500 ₽') && flowText().includes('от 12 500 ₽'), 'success lost participant or total price semantics');
await cleanup(dispose);

mark('joint-fixed');
legalMode = 'active';
confirmMode = 'success';
dispose = await toTime('joint', '+79990000008', (jointForm) => setInput(jointForm, 'participantName0', 'Маша'), [['cut'], ['cut']]);
ok(currentTitle() === 'Запись', 'current consents did not skip in fixed joint flow');
ok(flowText().includes('Итого') && flowText().includes('6 000 ₽') && !flowText().includes('Итого от'), 'all-fixed joint total incorrectly became variable');
await cleanup(dispose);

ok(accountRequests === 0, 'public variants loaded Account/App endpoints');
window.fetch = originalFetch;
if (failures.length) {
  document.documentElement.dataset.publicBookingVariantsRuntime = 'fail';
  result.textContent = failures.join('\n');
} else {
  document.documentElement.dataset.publicBookingVariantsRuntime = 'pass';
  result.textContent = 'public booking variants runtime passed';
}
</script>
</body>
</html>
