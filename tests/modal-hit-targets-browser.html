<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/ui/buttons/buttons.css">
  <link rel="stylesheet" href="/ui/settings/settings.css">
  <link rel="stylesheet" href="/ui/modals/modal.css">
  <link rel="stylesheet" href="/ui/v2/v2.css">
</head>
<body>
<div id="host"></div>
<script type="module">
import { button, modal, mountModal, openSharedProfileSettingsMenu, openTimeRangeAction, openDayWorkplaceTime, setV2ZHeaderRows, v2Header, v2Shell } from '/ui/ui.js';
import { hydrateWorkplacesFromServer } from '/core/profile/workplaces/data.js';
import { openServiceWorkplaceSelection } from '/core/service/workplace-selection.js';
import { openJournalWorkplaceControl } from '/journal/workplace-control.js';

hydrateWorkplacesFromServer([{ key: 'test-space', name: 'Тестовое пространство' }]);
let selection = [];
let headerACount = 0;
let headerCCount = 0;
let headerDCount = 0;
let underVeilCount = 0;
let journalTime = { from: '09:00', to: '18:00' };
const host = document.querySelector('#host');
const header = v2Header({
  a: { label: 'A', initials: 'A' },
  b: 'Проверка modal',
  c: { label: 'C', aria: 'C', data: 'data-test-header-c' },
  d: { kind: 'chat', aria: 'D', data: 'data-test-header-d' },
});
host.innerHTML = v2Shell({
  header,
  body: button('Под вуалью', { data: 'data-test-under-veil' })
    + button('Настройки', { data: 'data-test-settings' })
    + button('Журнал: пространство', { data: 'data-test-journal-workplace' })
    + button('Открыть время', { data: 'data-test-time-range' })
    + button('Журнал: рабочее время', { data: 'data-test-journal-time' })
    + button('Открыть Q', { data: 'data-test-open-q' })
    + '<output data-test-selection>0</output><output data-test-journal-selection>__all__</output>'
    + '<output data-test-time-result></output><output data-test-journal-time-result>09:00-18:00</output>'
    + '<output data-test-header-a-count>0</output><output data-test-header-c-count>0</output><output data-test-header-d-count>0</output>'
    + '<output data-test-under-veil-count>0</output>'
    + '<div data-test-scroll-filler style="height:1400px" aria-hidden="true"></div>',
});
setV2ZHeaderRows(host, ['<div data-test-z-header-control style="min-height:48px;display:grid;align-items:center">Стабильный Z Header</div>']);

const headerASlot = host.querySelector('.v2-header__slot--a');
headerASlot?.setAttribute('data-test-header-a', '');
headerASlot?.addEventListener('click', () => {
  headerACount += 1;
  host.querySelector('[data-test-header-a-count]').textContent = String(headerACount);
});
host.querySelector('[data-test-header-c]').addEventListener('click', () => {
  headerCCount += 1;
  host.querySelector('[data-test-header-c-count]').textContent = String(headerCCount);
});
host.querySelector('[data-test-header-d]').addEventListener('click', () => {
  headerDCount += 1;
  host.querySelector('[data-test-header-d-count]').textContent = String(headerDCount);
});
host.querySelector('[data-test-under-veil]').addEventListener('click', () => {
  underVeilCount += 1;
  host.querySelector('[data-test-under-veil-count]').textContent = String(underVeilCount);
});
host.querySelector('[data-test-open-q]').addEventListener('click', () => {
  mountModal(host, modal(button('Q content', { data: 'data-test-q-content' }), {
    variant: 'q',
    title: 'Q',
  }));
});

host.querySelector('[data-test-time-range]').addEventListener('click', () => {
  openTimeRangeAction({
    from: '09:00',
    to: '18:00',
    title: 'График работы',
    onSave: ({ from, to }) => {
      host.querySelector('[data-test-time-result]').textContent = `${from}-${to}`;
    },
  });
});

function openJournalTimeEditor() {
  openDayWorkplaceTime({
    title: 'Рабочее время',
    from: journalTime.from,
    to: journalTime.to,
    onSave: ({ from, to }) => {
      journalTime = { from, to };
      host.querySelector('[data-test-journal-time-result]').textContent = `${from}-${to}`;
      return { ok: true };
    },
  });
}

host.querySelector('[data-test-journal-time]').addEventListener('click', () => {
  const action = mountModal(document.body, modal(button('Корректировать время', { data: 'data-test-open-journal-time-editor' }), {
    variant: 'x',
    title: 'Рабочее время: действия',
    xRole: 'action',
  }));
  action?.querySelector('[data-test-open-journal-time-editor]')?.addEventListener('click', () => {
    openJournalTimeEditor();
  });
});

host.querySelector('[data-test-journal-workplace]').addEventListener('click', () => {
  const output = host.querySelector('[data-test-journal-selection]');
  openJournalWorkplaceControl({
    workplaces: [{ key: 'beauty', name: 'Beauty Day', from: '10:00', to: '20:00' }],
    workplaceId: output.textContent || '__all__',
    aggregateCount: 2,
    recordCounts: { beauty: 1 },
    onSelect: (next) => { output.textContent = next; },
  });
});

host.querySelector('[data-test-settings]').addEventListener('click', () => {
  openSharedProfileSettingsMenu({ actions: [{
    id: 'workplaces', label: 'Рабочие пространства',
    onSelect: () => openServiceWorkplaceSelection({
      selected: selection,
      onChange: (next) => {
        selection = next;
        host.querySelector('[data-test-selection]').textContent = String(next.length);
      },
    }),
  }] });
});

// Layout matrix uses the real shared variants. It never disables hit testing.
const variant = new URLSearchParams(location.search).get('variant');
if (variant !== null) {
  const kind = variant === 's' ? 's' : 'x';
  const className = kind === 's' || !variant ? '' : `modal--${variant}-sheet`;
  const content = kind === 's'
    ? '<div data-test-target>Информационное сообщение</div>'
    : button('Проверка нажатия', { data: 'data-test-target' });
  mountModal(host, modal(content, {
    variant: kind, className, title: 'Проверка',
  }));
}
document.documentElement.dataset.modalTestReady = 'true';
</script>
</body>
</html>
