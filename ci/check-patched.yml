          DO $reset_check$
          BEGIN
            IF (SELECT COUNT(*) FROM "Account") <> 0 THEN
              RAISE EXCEPTION 'Test Account rows remain';
            END IF;
            IF (SELECT COUNT(*) FROM "BookingRequest") <> 0 THEN
              RAISE EXCEPTION 'Test BookingRequest rows remain';
            END IF;
            IF (SELECT COUNT(*) FROM "TenantConsentEvent" WHERE "subjectType" IN ('ACCOUNT','BOOKING_ACCOUNT','CONTACT_POINT')) <> 0 THEN
              RAISE EXCEPTION 'Test end-person consent rows remain';
            END IF;
            IF (SELECT COUNT(*) FROM "Person" WHERE "id" = 'reset-person-row') <> 1 THEN
              RAISE EXCEPTION 'Person was deleted';
            END IF;
            IF (SELECT "data"->>'name' FROM "Person" WHERE "id" = 'reset-person-row') <> 'Keep Person' THEN
              RAISE EXCEPTION 'Person data was changed';
            END IF;
            IF (SELECT "data"->'phones' FROM "Person" WHERE "id" = 'reset-person-row') <> '["+79990000001"]'::jsonb THEN
