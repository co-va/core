  prelaunch-failed-migration-recovery:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install server dependencies
        run: npm install --prefix server
      - name: Generate Prisma client
        run: npm run prisma:generate --prefix server
      - name: Start isolated database
        run: |
          docker compose -f docker-compose.staging.yml up -d db
          for attempt in $(seq 1 30); do
            if docker compose -f docker-compose.staging.yml exec -T db pg_isready -U book -d book_staging >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.staging.yml logs db
          exit 1
      - name: Apply chain before failed 07:55
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/prelaunch-recovery-migrations
          mv server/prisma/migrations/20260922075500_prelaunch_hard_delete_clean_start /tmp/prelaunch-recovery-migrations/
          mv server/prisma/migrations/20260922081000_purge_non_owner_profiles /tmp/prelaunch-recovery-migrations/
          mv server/prisma/migrations/20260922094500_purge_unapproved_legacy_live /tmp/prelaunch-recovery-migrations/
          (
            cd server
            DATABASE_URL='postgresql://book:book_staging_local@localhost:54329/book_staging?schema=public' npx prisma migrate deploy
          )
      - name: Simulate production P3009 row
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.staging.yml exec -T db psql -U book -d book_staging -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO "_prisma_migrations" (
            "id","checksum","finished_at","migration_name","logs","rolled_back_at","started_at","applied_steps_count"
          )
          VALUES (
            '22222222-2222-4222-8222-222222222222',
            'simulated-failed-prelaunch-checksum',
            NULL,
            '20260922075500_prelaunch_hard_delete_clean_start',
            NULL,
            NULL,
            CURRENT_TIMESTAMP,
            0
          );
          SQL
      - name: Verify guarded recovery and resolve failed 07:55
        shell: bash
        run: |
          set -uo pipefail
          cd server
          set +e
          DATABASE_URL='postgresql://book:book_staging_local@localhost:54329/book_staging?schema=public' node scripts/recover-failed-prelaunch-migration.mjs
          recovery_status=$?
          set -e
          if [ "$recovery_status" -ne 42 ]; then
            echo "Expected guarded recovery exit 42, got $recovery_status"
            exit 1
          fi
          DATABASE_URL='postgresql://book:book_staging_local@localhost:54329/book_staging?schema=public' npx prisma migrate resolve --rolled-back 20260922075500_prelaunch_hard_delete_clean_start
      - name: Restore and retry corrected migrations
        shell: bash
        run: |
          set -euo pipefail
          mv /tmp/prelaunch-recovery-migrations/20260922075500_prelaunch_hard_delete_clean_start server/prisma/migrations/
          mv /tmp/prelaunch-recovery-migrations/20260922081000_purge_non_owner_profiles server/prisma/migrations/
          mv /tmp/prelaunch-recovery-migrations/20260922094500_purge_unapproved_legacy_live server/prisma/migrations/
          (
            cd server
            DATABASE_URL='postgresql://book:book_staging_local@localhost:54329/book_staging?schema=public' npx prisma migrate deploy
          )
      - name: Verify recovered migration state
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.staging.yml exec -T db psql -U book -d book_staging -v ON_ERROR_STOP=1 <<'SQL'
          DO $recovery_check$
          BEGIN
            IF (
              SELECT COUNT(*)
              FROM "_prisma_migrations"
              WHERE "id" = '22222222-2222-4222-8222-222222222222'
                AND "rolled_back_at" IS NOT NULL
            ) <> 1 THEN
              RAISE EXCEPTION 'Failed 07:55 row was not marked rolled back';
            END IF;

            IF (
              SELECT COUNT(*)
              FROM "_prisma_migrations"
              WHERE "migration_name" = '20260922075500_prelaunch_hard_delete_clean_start'
                AND "finished_at" IS NOT NULL
                AND "rolled_back_at" IS NULL
            ) <> 1 THEN
              RAISE EXCEPTION 'Corrected 07:55 was not applied successfully';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema = 'public'
                AND table_name = 'TenantAccess'
                AND column_name = 'liveApprovedAt'
            ) THEN
              RAISE EXCEPTION 'LIVE approval schema was not applied';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM pg_trigger
              WHERE tgname = 'PlatformConsentEvent_append_only'
                AND NOT tgisinternal
            ) THEN
              RAISE EXCEPTION 'PlatformConsentEvent append-only trigger was lost';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM pg_trigger
              WHERE tgname = 'PlatformActivityEvent_append_only'
                AND NOT tgisinternal
            ) THEN
              RAISE EXCEPTION 'PlatformActivityEvent append-only trigger was lost';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM pg_constraint
              WHERE conname = 'WorkspaceState_tenantId_fkey'
            ) THEN
              RAISE EXCEPTION 'WorkspaceState tenant FK missing after recovery';
            END IF;

            IF EXISTS (
              SELECT 1 FROM pg_constraint
              WHERE conname IN (
                'PlatformConsentEvent_tenantId_fkey',
                'PlatformConsentEvent_platformAccountId_fkey'
              )
            ) THEN
              RAISE EXCEPTION 'Unsafe PlatformConsentEvent cascade FK returned';
            END IF;
          END
          $recovery_check$;
          SQL
      - name: Stop isolated database
        if: always()
        run: docker compose -f docker-compose.staging.yml down -v

  staging-smoke:
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main' || github.base_ref == 'staging' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build staging backend image
        run: docker compose -f docker-compose.staging.yml build backend
      - name: Start isolated database and backend
        run: |
          docker compose -f docker-compose.staging.yml up -d db
          docker compose -f docker-compose.staging.yml up -d backend
      - name: Verify staging backend
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:3000/health >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.staging.yml logs db backend
          exit 1
      - name: Verify centralized data transfer with PostgreSQL
        run: docker compose -f docker-compose.staging.yml exec -T backend node scripts/check-data-transfer.mjs
      - name: Verify all four production domains
        shell: bash
        run: |
          set -euo pipefail

          expect_status() {
            local host="$1"
            local path="$2"
            local expected="$3"
            local actual
            actual=$(curl -sS -o /tmp/domain-response -w '%{http_code}' -H "Host: $host" "http://localhost:3000$path")
            if [ "$actual" != "$expected" ]; then
              echo "$host$path: expected HTTP $expected, got $actual"
              cat /tmp/domain-response || true
              docker compose -f docker-compose.staging.yml logs backend
              exit 1
            fi
          }

          expect_contains() {
            local host="$1"
            local path="$2"
            local needle="$3"
            local body_file
            body_file=$(mktemp)
            if ! curl -fsS -H "Host: $host" "http://localhost:3000$path" -o "$body_file"; then
              echo "$host$path: request failed"
              docker compose -f docker-compose.staging.yml logs backend
              rm -f "$body_file"
              exit 1
            fi
            if ! grep -Fq "$needle" "$body_file"; then
              echo "$host$path: response does not contain expected marker: $needle"
              cat "$body_file" || true
              docker compose -f docker-compose.staging.yml logs backend
              rm -f "$body_file"
              exit 1
            fi
            rm -f "$body_file"
          }

          expect_status "api.va-tools.ru" "/health" "200"

          expect_status "admin.va-tools.ru" "/" "302"
          expect_status "admin.va-tools.ru" "/admin/" "200"
          expect_status "admin.va-tools.ru" "/admin/admin.js" "200"
          expect_status "admin.va-tools.ru" "/admin/document-registry/view.js" "200"
          expect_status "admin.va-tools.ru" "/admin/document-registry/catalog.js" "200"
          expect_status "admin.va-tools.ru" "/admin/document-registry/history.js" "200"
          expect_contains "admin.va-tools.ru" "/admin/" "<title>Администрирование</title>"
          expect_contains "admin.va-tools.ru" "/admin/" "admin.js?build="
          expect_contains "admin.va-tools.ru" "/admin/admin.js" "document-registry/view.js"
          expect_contains "admin.va-tools.ru" "/admin/document-registry/catalog.js" "privacy-policy"
          expect_contains "admin.va-tools.ru" "/admin/document-registry/view.js" "Реестр документов"

          expect_status "app.va-tools.ru" "/" "200"
          expect_status "app.va-tools.ru" "/core.js" "200"
          expect_contains "app.va-tools.ru" "/" "<title>Рабочее пространство</title>"
          expect_contains "app.va-tools.ru" "/core.js" "app-content"

          expect_status "user.va-tools.ru" "/" "200"
          expect_status "user.va-tools.ru" "/online-booking/booking.js" "200"
          expect_status "user.va-tools.ru" "/online-booking/model.js" "200"
          expect_status "user.va-tools.ru" "/core/time/zone.js" "200"
          expect_contains "user.va-tools.ru" "/" "<title>Запись</title>"
          expect_contains "user.va-tools.ru" "/online-booking/booking.js" "renderOnlineBooking"
          expect_contains "user.va-tools.ru" "/online-booking/model.js" "zonedDateTimeParts"
          expect_contains "user.va-tools.ru" "/core/time/zone.js" "Intl.DateTimeFormat"

      - name: Start and verify staging frontend
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.staging.yml up -d frontend
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/ >/dev/null 2>&1 \
              && curl -fsS http://localhost:8080/core.js >/dev/null 2>&1 \
              && curl -fsS http://localhost:8080/core/environment.js >/dev/null 2>&1 \
              && curl -fsS http://localhost:8080/service-worker.js >/dev/null 2>&1 \
              && curl -fsS http://localhost:8080/core/notifications/web-push.js >/dev/null 2>&1 \
              && curl -fsS http://localhost:8080/api/health >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" = "30" ]; then
              docker compose -f docker-compose.staging.yml logs frontend backend
              exit 1
            fi
            sleep 2
          done

          owner_password=$(docker compose -f docker-compose.staging.yml exec -T backend printenv OWNER_PASSWORD | tr -d '\r\n')
          login_payload=$(curl -fsS \
            -H 'Content-Type: application/json' \
            -d "$(node -e "process.stdout.write(JSON.stringify({email:'staging@book.local',password:process.argv[1]}))" "$owner_password")" \
            http://localhost:8080/api/auth/login)
          access_token=$(node -e "const p=JSON.parse(process.argv[1]); if(!p.accessToken) process.exit(1); process.stdout.write(p.accessToken)" "$login_payload")
          tenant_id=$(node -e "const p=JSON.parse(process.argv[1]); if(!p.tenant?.id) process.exit(1); process.stdout.write(p.tenant.id)" "$login_payload")
          curl -fsS -H "Authorization: Bearer $access_token" http://localhost:8080/api/auth/me >/dev/null

          booking_context=$(curl -fsS "http://localhost:8080/api/online-booking/$tenant_id/context")
          node -e "const p=JSON.parse(process.argv[1]); const w=(p.workplaces||[]).find((item)=>item.key==='studio-test'); if(!w || w.timeZone!=='Europe/Moscow') { console.error('Workplace timezone missing from public booking context'); process.exit(1); }" "$booking_context"

          pdn_consent=$(node -e "const p=JSON.parse(process.argv[1]); const d=(p.documents||[]).find((item)=>item.id==='pdn-consent'); if(!d) { console.error('PDN consent missing from public booking context'); process.exit(1); } process.stdout.write(JSON.stringify({documentId:d.id,accepted:true}))" "$booking_context")
          booking_state=$(curl -fsS \
            -X POST \
            -H 'Content-Type: application/json' \
            -d '{"name":"Push","phone":"+79990000999","email":"push-smoke@book.local"}' \
            "http://localhost:8080/api/online-booking/$tenant_id/booking-state")
          node -e "
            const state=JSON.parse(process.argv[1]);
            const pdn=(state.consents||[]).find((item)=>String(item.documentId||'')==='pdn-consent');
            const marketing=(state.consents||[]).find((item)=>String(item.documentId||'')==='messages-consent');
            if(state.legalState?.pdnActive!==false || state.legalState?.marketingActive!==false || !pdn || pdn.active!==false || pdn.required!==true || !marketing || marketing.active!==false || marketing.marketing!==true){
              console.error('Public booking state did not expose ready inactive PDN/marketing state for a new contact');
              process.exit(1);
            }
          " "$booking_state"

          booking_today=$(node -e "const parts=Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Moscow',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).filter((x)=>x.type!=='literal').map((x)=>[x.type,x.value])); process.stdout.write(parts.year+'-'+parts.month+'-'+parts.day)")
          has_today=$(node -e "const p=JSON.parse(process.argv[1]); const today=process.argv[2]; process.stdout.write((p.days||[]).some((d)=>String(d.workplaceId||'')==='studio-test' && String(d.date||'').slice(0,10)===today)?'yes':'no')" "$booking_context" "$booking_today")
          if [ "$has_today" = "yes" ]; then
            past_payload=$(node -e "
              const consent=JSON.parse(process.argv[2]);
              process.stdout.write(JSON.stringify({
                workplaceKey:'studio-test',date:process.argv[1],from:'00:00',mode:'self',
                booker:{name:'Push',phone:'+79990000999',email:'push-smoke@book.local'},
                participants:[{id:'booker',name:'Push',phone:'+79990000999',email:'push-smoke@book.local',procedureIds:['procedure-cut']}],
                consents:[consent],
              }));
            " "$booking_today" "$pdn_consent")
            past_body=$(mktemp)
            past_status=$(curl -sS -o "$past_body" -w '%{http_code}' \
              -X POST \
              -H 'Content-Type: application/json' \
              -d "$past_payload" \
              "http://localhost:8080/api/online-booking/$tenant_id/confirm")
            if [ "$past_status" != "409" ] || ! grep -Fq "Это время уже прошло" "$past_body"; then
              echo "Public booking /confirm past-time guard failed: HTTP $past_status"
              cat "$past_body" || true
              rm -f "$past_body"
              exit 1
            fi
            rm -f "$past_body"
          fi

          booking_slot=$(node -e "
            const p=JSON.parse(process.argv[1]);
            const today=process.argv[2];
            const workplace=(p.workplaces||[]).find((item)=>String(item.key||'')==='studio-test')||{};
            const procedure=(p.procedures||[]).find((item)=>String(item.id||'')==='procedure-cut')||{};
            const duration=Math.max(1,Number(procedure.duration||60));
            const toMinutes=(value)=>{ const m=String(value||'').match(/^(\d{1,2}):(\d{2})$/); return m?Number(m[1])*60+Number(m[2]):null; };
            const toTime=(value)=>String(Math.floor(value/60)).padStart(2,'0')+':'+String(value%60).padStart(2,'0');
            const days=(p.days||[])
              .filter((d)=>String(d.workplaceId||'')==='studio-test' && String(d.date||'').slice(0,10)>today)
              .sort((a,b)=>String(a.date).localeCompare(String(b.date)));
            for(const day of days){
              const date=String(day.date||'').slice(0,10);
              const start=toMinutes(day.from||workplace.from);
              const end=toMinutes(day.to||workplace.to);
              if(start==null||end==null) continue;
              const usages=(p.occupancy||[]).filter((u)=>String(u.workplaceId||'')==='studio-test' && String(u.date||'').slice(0,10)===date)
                .map((u)=>({from:toMinutes(u.from),to:toMinutes(u.to)})).filter((u)=>u.from!=null&&u.to!=null);
              for(let cursor=start;cursor+duration<=end;cursor+=15){
                if(usages.every((u)=>cursor+duration<=u.from||cursor>=u.to)){
                  process.stdout.write(JSON.stringify({date,from:toTime(cursor)}));
                  process.exit(0);
                }
              }
            }
            console.error('No future studio-test booking slot in staging context');
            process.exit(1);
          " "$booking_context" "$booking_today")
          booking_date=$(node -e "process.stdout.write(JSON.parse(process.argv[1]).date)" "$booking_slot")
          booking_from=$(node -e "process.stdout.write(JSON.parse(process.argv[1]).from)" "$booking_slot")
          confirm_payload=$(node -e "
            const consent=JSON.parse(process.argv[3]);
            process.stdout.write(JSON.stringify({
              workplaceKey:'studio-test',date:process.argv[1],from:process.argv[2],mode:'self',
              booker:{name:'Push',phone:'+79990000999',email:'push-smoke@book.local'},
              participants:[{id:'booker',name:'Push',phone:'+79990000999',email:'push-smoke@book.local',procedureIds:['procedure-cut']}],
              consents:[consent],
            }));
          " "$booking_date" "$booking_from" "$pdn_consent")
          created_booking=$(curl -fsS \
            -X POST \
            -H 'Content-Type: application/json' \
            -d "$confirm_payload" \
            "http://localhost:8080/api/online-booking/$tenant_id/confirm")
          created_record_id=$(node -e "const p=JSON.parse(process.argv[1]); const id=p.records?.[0]?.id; if(!id) { console.error('Public /confirm did not return a Record'); process.exit(1); } process.stdout.write(id)" "$created_booking")

          owner_business=$(curl -fsS \
            -H "Authorization: Bearer $access_token" \
            "http://localhost:8080/api/business-state")
          node -e "
            const business=JSON.parse(process.argv[1]);
            const recordId=process.argv[2];
            const people=Array.isArray(business.people)?business.people:[];
            const records=Array.isArray(business.records)?business.records:[];
            const linked=people.find((person)=>String(person.name||'')==='Push' && Array.isArray(person.phones) && person.phones.includes('+79990000999'));
            if(!linked){ console.error('Account-free public Booking Person is missing from owner business state'); process.exit(1); }
            if(Array.isArray(linked.accounts) && linked.accounts.length){ console.error('Public Booking unexpectedly created or required an Account link'); process.exit(1); }
            const record=records.find((item)=>String(item.id||'')===recordId);
            if(!record){ console.error('Public booking Record is missing from owner business state'); process.exit(1); }
            if(String(record.person?.key||'')!==String(linked.key||'')){
              console.error('Public booking Record is linked to a different Person');
              process.exit(1);
            }
          " "$owner_business" "$created_record_id"

          account_terms=$(curl -fsS "http://localhost:8080/api/online-booking/account-terms")
          account_terms_fact=$(node -e "const p=JSON.parse(process.argv[1]); if(!p.key || !p.version) process.exit(1); process.stdout.write(JSON.stringify({key:p.key,version:p.version,accepted:true,acceptedAt:new Date().toISOString()}))" "$account_terms")
          smoke_password="Smoke-${GITHUB_RUN_ID}-Pass"
          push_account=$(curl -fsS \
            -H 'Content-Type: application/json' \
            -d "$(node -e "process.stdout.write(JSON.stringify({email:'push-account-smoke@book.local',password:process.argv[1],name:'Push Account',phone:'+79990000888',accountTerms:JSON.parse(process.argv[2])}))" "$smoke_password" "$account_terms_fact")" \
            "http://localhost:8080/api/online-booking/$tenant_id/account/register")
          booking_token=$(node -e "const p=JSON.parse(process.argv[1]); if(!p.accessToken) process.exit(1); process.stdout.write(p.accessToken)" "$push_account")

          push_config=$(curl -fsS \
            -H "Authorization: Bearer $booking_token" \
            "http://localhost:8080/api/online-booking/$tenant_id/account/push/config")
          node -e "const p=JSON.parse(process.argv[1]); if(!p.enabled || !p.publicKey) process.exit(1)" "$push_config"

          curl -fsS \
            -X PUT \
            -H "Authorization: Bearer $booking_token" \
            -H 'Content-Type: application/json' \
            -d '{"subscription":{"endpoint":"https://push.example.invalid/book-smoke","keys":{"p256dh":"staging-p256dh","auth":"staging-auth"}}}' \
            "http://localhost:8080/api/online-booking/$tenant_id/account/push/subscription" >/dev/null
      - name: Stop isolated staging
        if: always()
        run: docker compose -f docker-compose.staging.yml down -v
