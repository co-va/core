name: Check Book

on:
  push:
    branches: [staging]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enforce branch policy
        shell: bash
        run: |
          branch_name="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            branch_name="${GITHUB_BASE_REF}"
          fi
          if [ "${branch_name}" != "main" ] && [ "${branch_name}" != "staging" ]; then
            echo "Only main and staging branches are allowed"
            exit 1
          fi
      - name: Syntax and architecture checks
        run: npm run check
      - name: Domain regression tests
        run: npm test
      - name: Browser FEZ runtime regression
        shell: bash
        run: |
          set -euo pipefail
          chrome_bin=""
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              chrome_bin="$(command -v "$candidate")"
              break
            fi
          done
          if [ -z "$chrome_bin" ]; then
            echo "No Chromium-compatible browser found on runner"
            exit 1
          fi
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/fez-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/tests/fez-runtime-browser.html >/dev/null; then
              break
            fi
            sleep 0.25
          done
          run_browser_case() {
            local path="$1"
            local marker="$2"
            local stage_attr="$3"
            local output="$4"
            local browser_status
            set +e
            timeout --signal=TERM --kill-after=5s 45s "$chrome_bin" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --window-size=390,844 \
              --force-device-scale-factor=1 \
              --touch-events=enabled \
              --virtual-time-budget=12000 \
              --dump-dom \
              "http://127.0.0.1:4173/$path" \
              > "$output"
            browser_status=$?
            set -e
            if [ "$browser_status" -eq 124 ] || [ "$browser_status" -eq 137 ]; then
              echo "Browser runtime regression timed out after 45s: $path"
              exit 1
            fi
            if [ "$browser_status" -ne 0 ]; then
              echo "Browser runtime regression browser failed: $path (exit $browser_status)"
              exit 1
            fi
            if ! grep -Fq "$marker" "$output"; then
              echo "Browser runtime regression failed: $path"
              grep -o "$stage_attr=\"[^\"]*\"" "$output" || true
              grep -A4 -B2 '<pre id="result"' "$output" || true
              exit 1
            fi
          }
          run_browser_case "tests/fez-runtime-browser.html" 'data-fez-runtime="pass"' 'data-fez-runtime-stage' /tmp/fez-runtime-dom.html
          run_browser_case "tests/account-shell-runtime-browser.html" 'data-account-runtime="pass"' 'data-account-runtime-stage' /tmp/account-runtime-dom.html
          run_browser_case "tests/professional-core-runtime-browser.html" 'data-professional-runtime="pass"' 'data-professional-runtime-stage' /tmp/professional-runtime-dom.html
          run_browser_case "tests/documents-runtime-browser.html" 'data-documents-runtime="pass"' 'data-documents-runtime-stage' /tmp/documents-runtime-dom.html
          run_browser_case "tests/data-transfer-runtime-browser.html" 'data-transfer-runtime="pass"' 'data-transfer-runtime-stage' /tmp/data-transfer-runtime-dom.html
      - name: Validate staging compose
        run: docker compose -f docker-compose.staging.yml config >/dev/null
      - name: Install server dependencies
        run: npm install --prefix server
      - name: Generate Prisma client
        run: npm run prisma:generate --prefix server
      - name: Build server
        run: npm run build --prefix server

  modal-browser-interaction:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install isolated browser test runner
        run: npm install --prefix "$RUNNER_TEMP/modal-browser" --no-audit --no-fund playwright@1.62.1
      - name: Verify shared modal hit targets with mouse and touch
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/modal-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/tests/modal-hit-targets-browser.html >/dev/null; then
              break
            fi
            sleep 0.25
          done
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/modal-browser/node_modules/playwright/index.mjs" node scripts/check-modal-browser-interaction.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/modal-browser/node_modules/playwright/index.mjs" node scripts/check-list-reorder-browser-interaction.mjs

  # Historical migration/recovery checks are intentionally manual-only.
  profile-migration-upgrade:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install server dependencies
        run: npm install --prefix server
      - name: Start isolated database
        run: |
          docker compose -f docker-compose.staging.yml up -d db
          for attempt in $(seq 1 30); do
            if docker compose -f docker-compose.staging.yml exec -T db pg_isready -U book -d book_staging >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.staging.yml logs db
          exit 1
      - name: Apply pre-PROFILE migration chain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/profile-migrations
          mv server/prisma/migrations/20260919183000_tenant_invitation_naming /tmp/profile-migrations/
          mv server/prisma/migrations/20260919184000_owner_membership_role /tmp/profile-migrations/
          mv server/prisma/migrations/20260919185000_platform_account_naming /tmp/profile-migrations/
          mv server/prisma/migrations/20260921190000_first_run_scenario /tmp/profile-migrations/
          mv server/prisma/migrations/20260921193000_platform_profile_controls /tmp/profile-migrations/
          mv server/prisma/migrations/20260921194000_platform_notices /tmp/profile-migrations/
          mv server/prisma/migrations/20260921195000_commercial_mode_compat /tmp/profile-migrations/
          mv server/prisma/migrations/20260922043000_detach_immutable_legal_events /tmp/profile-migrations/
          mv server/prisma/migrations/20260922075500_prelaunch_hard_delete_clean_start /tmp/profile-migrations/
          mv server/prisma/migrations/20260922081000_purge_non_owner_profiles /tmp/profile-migrations/
          mv server/prisma/migrations/20260922094500_purge_unapproved_legacy_live /tmp/profile-migrations/
          mv server/prisma/migrations/20260922173000_platform_push_subscription /tmp/profile-migrations/
          mv server/prisma/migrations/20260922213000_demo_starts_at_profile_open /tmp/profile-migrations/
          mv server/prisma/migrations/20260930143000_remove_first_run_runtime /tmp/profile-migrations/
          (
            cd server
            DATABASE_URL='postgresql://book:book_staging_local@localhost:54329/book_staging?schema=public' npx prisma migrate deploy
          )
      - name: Seed representative pre-PROFILE rows
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.staging.yml exec -T db psql -U book -d book_staging <<'SQL'
          INSERT INTO "Tenant" ("id","name","updatedAt")
          VALUES ('upgrade-tenant','Upgrade Tenant',CURRENT_TIMESTAMP);

          INSERT INTO "User" ("id","email","passwordHash","onboardingStep","workspaceUnlocked","updatedAt")
          VALUES ('upgrade-user','upgrade@example.invalid','hash',3,true,CURRENT_TIMESTAMP);

          INSERT INTO "Membership" ("id","tenantId","userId","role")
          VALUES ('upgrade-membership','upgrade-tenant','upgrade-user','OWNER');

          INSERT INTO "WorkspaceState" ("id","tenantId","userId","data","revision","updatedAt")
          VALUES ('upgrade-workspace','upgrade-tenant','upgrade-user','{"kept":true}'::jsonb,7,CURRENT_TIMESTAMP);

          INSERT INTO "Profile" (
            "id","tenantId","userId","name","phones","telegrams","emails","customProfessions","updatedAt"
          )
          VALUES (
            'upgrade-profile','upgrade-tenant','upgrade-user','Upgrade Profile',
            '[]'::jsonb,'[]'::jsonb,'["upgrade@example.invalid"]'::jsonb,'[]'::jsonb,CURRENT_TIMESTAMP
          );

          INSERT INTO "PlatformAdmin" ("id","userId","updatedAt")
          VALUES ('upgrade-admin','upgrade-user',CURRENT_TIMESTAMP);

          INSERT INTO "MasterInvitation" (
            "id","tenantId","createdByAdminId","email","name","tokenHash","status","expiresAt","updatedAt"
          )
          VALUES (
            'upgrade-invitation','upgrade-tenant','upgrade-admin','invite@example.invalid','Invite',
            'upgrade-token-hash','PENDING',CURRENT_TIMESTAMP + INTERVAL '7 days',CURRENT_TIMESTAMP
          );
          SQL
      - name: Apply PROFILE migrations
        shell: bash
        run: |
          set -euo pipefail
          mv /tmp/profile-migrations/20260919183000_tenant_invitation_naming server/prisma/migrations/
          mv /tmp/profile-migrations/20260919184000_owner_membership_role server/prisma/migrations/
          mv /tmp/profile-migrations/20260919185000_platform_account_naming server/prisma/migrations/
          mv /tmp/profile-migrations/20260921190000_first_run_scenario server/prisma/migrations/
          mv /tmp/profile-migrations/20260921193000_platform_profile_controls server/prisma/migrations/
          mv /tmp/profile-migrations/20260921194000_platform_notices server/prisma/migrations/
          mv /tmp/profile-migrations/20260921195000_commercial_mode_compat server/prisma/migrations/
          mv /tmp/profile-migrations/20260922043000_detach_immutable_legal_events server/prisma/migrations/
          mv /tmp/profile-migrations/20260922075500_prelaunch_hard_delete_clean_start server/prisma/migrations/
          (
            cd server
            DATABASE_URL='postgresql://book:book_staging_local@localhost:54329/book_staging?schema=public' npx prisma migrate deploy
          )
      - name: Verify PROFILE migration preserves rows and names
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.staging.yml exec -T db psql -U book -d book_staging -v ON_ERROR_STOP=1 <<'SQL'
          DO $profile_check$
          BEGIN
            IF (SELECT COUNT(*) FROM "PlatformAccount" WHERE "id" = 'upgrade-user') <> 1 THEN
              RAISE EXCEPTION 'PlatformAccount row was not preserved';
            END IF;
            IF (SELECT COUNT(*) FROM "Membership" WHERE "id" = 'upgrade-membership' AND "platformAccountId" = 'upgrade-user' AND "role"::text = 'OWNER') <> 1 THEN
              RAISE EXCEPTION 'Membership row was not preserved';
            END IF;
            IF (SELECT COUNT(*) FROM "WorkspaceState" WHERE "id" = 'upgrade-workspace' AND "platformAccountId" = 'upgrade-user' AND "revision" = 7) <> 1 THEN
              RAISE EXCEPTION 'WorkspaceState row was not preserved';
            END IF;
            IF (SELECT COUNT(*) FROM "Profile" WHERE "id" = 'upgrade-profile' AND "platformAccountId" = 'upgrade-user' AND "name" = 'Upgrade Profile') <> 1 THEN
              RAISE EXCEPTION 'Profile row was not preserved';
            END IF;
            IF (SELECT COUNT(*) FROM "PlatformAdmin" WHERE "id" = 'upgrade-admin' AND "platformAccountId" = 'upgrade-user') <> 1 THEN
              RAISE EXCEPTION 'PlatformAdmin row was not preserved';
            END IF;
            IF (SELECT COUNT(*) FROM "TenantInvitation" WHERE "id" = 'upgrade-invitation' AND "tenantId" = 'upgrade-tenant') <> 1 THEN
              RAISE EXCEPTION 'TenantInvitation row was not preserved';
            END IF;
            IF to_regclass('"User"') IS NOT NULL THEN
              RAISE EXCEPTION 'Retired account table still exists';
            END IF;
            IF to_regclass('"MasterInvitation"') IS NOT NULL THEN
              RAISE EXCEPTION 'Retired invitation table still exists';
            END IF;
            IF EXISTS (
              SELECT 1
              FROM pg_enum e
              JOIN pg_type t ON t.oid = e.enumtypid
              WHERE t.typname = 'MembershipRole' AND e.enumlabel <> 'OWNER'
            ) THEN
              RAISE EXCEPTION 'Inactive MembershipRole value still exists';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_name = 'PlatformConsentEvent' AND column_name = 'platformAccountId'
            ) THEN
              RAISE EXCEPTION 'PlatformConsentEvent account column was not renamed';
            END IF;
          END
          $profile_check$;
          SQL
      - name: Verify ACTIVE LIVE test tenant hard delete
        shell: bash
        run: |
          set -euo pipefail
          (
            cd server
            npx prisma generate
            DATABASE_URL='postgresql://book:book_staging_local@localhost:54329/book_staging?schema=public' node scripts/check-prelaunch-hard-delete.mjs
          )
      - name: Seed OWNER, dirty LIVE, DEMO and approved LIVE purge fixture
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.staging.yml exec -T db psql -U book -d book_staging -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO "TenantAccess" (
            "tenantId","planId","status","isOwnerBook","commercialMode","createdAt","updatedAt"
          )
          VALUES (
            'upgrade-tenant',NULL,'ACTIVE',true,'LIVE',CURRENT_TIMESTAMP,CURRENT_TIMESTAMP
          )
          ON CONFLICT ("tenantId") DO UPDATE SET
            "isOwnerBook" = true,
            "status" = 'ACTIVE',
            "commercialMode" = 'LIVE',
            "updatedAt" = CURRENT_TIMESTAMP;

          INSERT INTO "Tenant" ("id","name","updatedAt")
          VALUES
            ('incoming-profile-tenant','Incoming DEMO Profile',CURRENT_TIMESTAMP),
            ('dirty-live-tenant','Dirty Automatic LIVE Profile',CURRENT_TIMESTAMP),
            ('approved-live-tenant','Approved LIVE Profile',CURRENT_TIMESTAMP);

          INSERT INTO "PlatformAccount" (
            "id","email","passwordHash","updatedAt"
          )
          VALUES
            ('incoming-profile-account','incoming-profile@example.invalid','hash',CURRENT_TIMESTAMP),
            ('dirty-live-account','dirty-live@example.invalid','hash',CURRENT_TIMESTAMP),
            ('approved-live-account','approved-live@example.invalid','hash',CURRENT_TIMESTAMP);

          INSERT INTO "Membership" ("id","tenantId","platformAccountId","role")
          VALUES
            ('incoming-profile-membership','incoming-profile-tenant','incoming-profile-account','OWNER'),
            ('dirty-live-membership','dirty-live-tenant','dirty-live-account','OWNER'),
            ('approved-live-membership','approved-live-tenant','approved-live-account','OWNER');

          INSERT INTO "TenantAccess" (
            "tenantId","planId","status","isOwnerBook","commercialMode",
            "liveRequestedAt","liveRequestedByPlatformAccountId",
            "liveApprovedAt","liveApprovedByAdminId","createdAt","updatedAt"
          )
          VALUES
            ('incoming-profile-tenant',NULL,'ACTIVE',false,'DEMO',NULL,NULL,NULL,NULL,CURRENT_TIMESTAMP,CURRENT_TIMESTAMP),
            ('dirty-live-tenant',NULL,'ACTIVE',false,'LIVE',NULL,NULL,NULL,NULL,CURRENT_TIMESTAMP,CURRENT_TIMESTAMP),
            ('approved-live-tenant',NULL,'ACTIVE',false,'LIVE',
             CURRENT_TIMESTAMP,'approved-live-account',CURRENT_TIMESTAMP,'upgrade-admin',CURRENT_TIMESTAMP,CURRENT_TIMESTAMP);

          INSERT INTO "Profile" (
            "id","tenantId","platformAccountId","name","phones","telegrams","emails","customProfessions","updatedAt"
          )
          VALUES
            (
              'incoming-profile-profile','incoming-profile-tenant','incoming-profile-account','Incoming Profile',
              '[]'::jsonb,'[]'::jsonb,'["incoming-profile@example.invalid"]'::jsonb,'[]'::jsonb,CURRENT_TIMESTAMP
            ),
            (
              'dirty-live-profile','dirty-live-tenant','dirty-live-account','Dirty LIVE Profile',
              '[]'::jsonb,'[]'::jsonb,'["dirty-live@example.invalid"]'::jsonb,'[]'::jsonb,CURRENT_TIMESTAMP
            ),
            (
              'approved-live-profile','approved-live-tenant','approved-live-account','Approved LIVE Profile',
              '[]'::jsonb,'[]'::jsonb,'["approved-live@example.invalid"]'::jsonb,'[]'::jsonb,CURRENT_TIMESTAMP
            );

          INSERT INTO "WorkspaceState" (
            "id","tenantId","platformAccountId","data","revision","updatedAt"
          )
          VALUES
            (
              'incoming-profile-workspace','incoming-profile-tenant','incoming-profile-account',
              '{"incoming":true}'::jsonb,1,CURRENT_TIMESTAMP
            ),
            (
              'dirty-live-workspace','dirty-live-tenant','dirty-live-account',
              '{"dirtyLive":true}'::jsonb,1,CURRENT_TIMESTAMP
            ),
            (
              'approved-live-workspace','approved-live-tenant','approved-live-account',
              '{"approvedLive":true}'::jsonb,1,CURRENT_TIMESTAMP
            );

          INSERT INTO "PlatformActivityEvent" (
            "id","tenantId","platformAccountId","eventType","metadata","occurredAt","createdAt"
          )
          VALUES
            (
              'dirty-live-legacy-event','dirty-live-tenant','dirty-live-account',
              'COMMERCIAL_MODE_CHANGED','{"commercialMode":"LIVE"}'::jsonb,CURRENT_TIMESTAMP - INTERVAL '2 minutes',CURRENT_TIMESTAMP - INTERVAL '2 minutes'
            ),
            (
              'approved-live-request','approved-live-tenant','approved-live-account',
              'LIVE_REQUESTED','{}'::jsonb,CURRENT_TIMESTAMP - INTERVAL '1 minute',CURRENT_TIMESTAMP - INTERVAL '1 minute'
            ),
            (
              'approved-live-event','approved-live-tenant','approved-live-account',
              'LIVE_APPROVED_BY_ADMIN','{"platformAdminId":"upgrade-admin"}'::jsonb,CURRENT_TIMESTAMP,CURRENT_TIMESTAMP
            );
          SQL
      - name: Apply incoming profile clean-start purge
        shell: bash
        run: |
          set -euo pipefail
          mv /tmp/profile-migrations/20260922081000_purge_non_owner_profiles server/prisma/migrations/
          mv /tmp/profile-migrations/20260922094500_purge_unapproved_legacy_live server/prisma/migrations/
          mv /tmp/profile-migrations/20260922173000_platform_push_subscription server/prisma/migrations/
          mv /tmp/profile-migrations/20260922213000_demo_starts_at_profile_open server/prisma/migrations/
          mv /tmp/profile-migrations/20260930143000_remove_first_run_runtime server/prisma/migrations/
          (
            cd server
            DATABASE_URL='postgresql://book:book_staging_local@localhost:54329/book_staging?schema=public' npx prisma migrate deploy
          )
      - name: Verify OWNER and approved LIVE preserved, unapproved profiles removed
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.staging.yml exec -T db psql -U book -d book_staging -v ON_ERROR_STOP=1 <<'SQL'
          DO $profile_purge$
          BEGIN
            IF (SELECT COUNT(*) FROM "Tenant" WHERE "id" = 'upgrade-tenant') <> 1 THEN
              RAISE EXCEPTION 'OWNER Tenant was removed';
            END IF;
            IF (SELECT COUNT(*) FROM "PlatformAccount" WHERE "id" = 'upgrade-user') <> 1 THEN
              RAISE EXCEPTION 'OWNER PlatformAccount was removed';
            END IF;
            IF (SELECT COUNT(*) FROM "Profile" WHERE "id" = 'upgrade-profile') <> 1 THEN
              RAISE EXCEPTION 'OWNER Profile was removed';
            END IF;
            IF (SELECT COUNT(*) FROM "WorkspaceState" WHERE "id" = 'upgrade-workspace') <> 1 THEN
              RAISE EXCEPTION 'OWNER WorkspaceState was removed';
            END IF;
            IF (SELECT COUNT(*) FROM "TenantAccess" WHERE "tenantId" = 'upgrade-tenant' AND "isOwnerBook" = true) <> 1 THEN
              RAISE EXCEPTION 'OWNER TenantAccess was not preserved';
            END IF;

            IF (SELECT COUNT(*) FROM "Tenant" WHERE "id" IN ('incoming-profile-tenant','dirty-live-tenant')) <> 0 THEN
              RAISE EXCEPTION 'Unapproved test Tenant remains';
            END IF;
            IF (SELECT COUNT(*) FROM "PlatformAccount" WHERE "id" IN ('incoming-profile-account','dirty-live-account')) <> 0 THEN
              RAISE EXCEPTION 'Unapproved test PlatformAccount remains';
            END IF;
            IF (SELECT COUNT(*) FROM "Profile" WHERE "id" IN ('incoming-profile-profile','dirty-live-profile')) <> 0 THEN
              RAISE EXCEPTION 'Unapproved test Profile remains';
            END IF;
            IF (SELECT COUNT(*) FROM "WorkspaceState" WHERE "id" IN ('incoming-profile-workspace','dirty-live-workspace')) <> 0 THEN
              RAISE EXCEPTION 'Unapproved test WorkspaceState remains';
            END IF;

            IF (SELECT COUNT(*) FROM "Tenant" WHERE "id" = 'approved-live-tenant') <> 1 THEN
              RAISE EXCEPTION 'Approved LIVE Tenant was removed';
            END IF;
            IF (SELECT COUNT(*) FROM "PlatformAccount" WHERE "id" = 'approved-live-account') <> 1 THEN
              RAISE EXCEPTION 'Approved LIVE PlatformAccount was removed';
            END IF;
            IF (SELECT COUNT(*) FROM "Profile" WHERE "id" = 'approved-live-profile') <> 1 THEN
              RAISE EXCEPTION 'Approved LIVE Profile was removed';
            END IF;
            IF (SELECT COUNT(*) FROM "WorkspaceState" WHERE "id" = 'approved-live-workspace') <> 1 THEN
              RAISE EXCEPTION 'Approved LIVE WorkspaceState was removed';
            END IF;
            IF (
              SELECT COUNT(*)
              FROM "TenantAccess"
              WHERE "tenantId" = 'approved-live-tenant'
                AND "isOwnerBook" = false
                AND "commercialMode" = 'LIVE'
                AND "liveRequestedAt" IS NOT NULL
                AND "liveRequestedByPlatformAccountId" = 'approved-live-account'
                AND "liveApprovedAt" IS NOT NULL
                AND "liveApprovedByAdminId" = 'upgrade-admin'
            ) <> 1 THEN
              RAISE EXCEPTION 'Approved LIVE proof was not preserved';
            END IF;

            IF (SELECT COUNT(*) FROM "TenantAccess" WHERE "isOwnerBook" = false) <> 1 THEN
              RAISE EXCEPTION 'Unexpected non-owner profiles remain after purge';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM pg_trigger WHERE tgname = 'PlatformConsentEvent_append_only' AND NOT tgisinternal
            ) THEN
              RAISE EXCEPTION 'PlatformConsentEvent append-only protection is missing';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_trigger WHERE tgname = 'PlatformActivityEvent_append_only' AND NOT tgisinternal
            ) THEN
              RAISE EXCEPTION 'PlatformActivityEvent append-only protection is missing';
            END IF;
          END
          $profile_purge$;
          SQL
      - name: Stop isolated database
        if: always()
        run: docker compose -f docker-compose.staging.yml down -v

  global-account-clean-reset:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install server dependencies
        run: npm install --prefix server
      - name: Generate Prisma client
        run: npm run prisma:generate --prefix server
      - name: Start isolated database
        run: |
          docker compose -f docker-compose.staging.yml up -d db
          for attempt in $(seq 1 30); do
            if docker compose -f docker-compose.staging.yml exec -T db pg_isready -U book -d book_staging >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.staging.yml logs db
          exit 1
      - name: Apply pre-global Account migration chain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/global-account-migrations
          mv server/prisma/migrations/20260921130000_global_account_identity /tmp/global-account-migrations/
          mv server/prisma/migrations/20260921143000_account_terms /tmp/global-account-migrations/
          mv server/prisma/migrations/20260925170000_global_account_tenant_link /tmp/global-account-migrations/
          (
            cd server
            DATABASE_URL='postgresql://book:book_staging_local@localhost:54329/book_staging?schema=public' npx prisma migrate deploy
          )
      - name: Seed test end-person values and preserved data
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.staging.yml exec -T db psql -U book -d book_staging -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO "Tenant" ("id","name","updatedAt")
          VALUES
            ('reset-tenant-a','Reset Tenant A',CURRENT_TIMESTAMP),
            ('reset-tenant-b','Reset Tenant B',CURRENT_TIMESTAMP);

          INSERT INTO "Account" (
            "id","tenantId","email","passwordHash","name","surname","phone","telegramId",
            "profileData","discountPercent","visits","totalSpent","lastVisit","programs","createdAt","updatedAt"
          )
