            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema = 'public' AND table_name = 'Account' AND column_name = 'createdViaTenantId'
            ) THEN
              RAISE EXCEPTION 'Global Account provenance column missing';
            END IF;
            IF to_regclass('"AccountContact"') IS NULL THEN
              RAISE EXCEPTION 'Global AccountContact table missing';
            END IF;
            IF (SELECT COUNT(*) FROM "Account") <> 0 OR (SELECT COUNT(*) FROM "AccountContact") <> 0 THEN
              RAISE EXCEPTION 'Global Account model must start clean';
            END IF;
            IF (SELECT COUNT(*) FROM "Person" WHERE "id" = 'reset-person-row') <> 1 THEN
              RAISE EXCEPTION 'Person was lost after global migration';
            END IF;
            IF (SELECT COUNT(*) FROM "UeiState" WHERE "id" = 'reset-uei-row') <> 1 THEN
              RAISE EXCEPTION 'UEI was lost after global migration';
            END IF;
            IF (SELECT COUNT(*) FROM "TenantDocumentArchive" WHERE "id" = 'reset-doc-row') <> 1 THEN
              RAISE EXCEPTION 'Document archive was lost after global migration';
            END IF;
          END
          $global_check$;
