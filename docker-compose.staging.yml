services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: book_staging
      POSTGRES_USER: book
      POSTGRES_PASSWORD: book_staging_local
    ports:
      - "54329:5432"
    volumes:
      - book_staging_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U book -d book_staging"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://book:book_staging_local@db:5432/book_staging?schema=public
      JWT_SECRET: book-staging-local-only-change-before-remote-use
      OWNER_EMAIL: staging@book.local
      OWNER_PASSWORD: BookStaging-2026!
      OWNER_TENANT_NAME: Book Staging
      FRONTEND_ORIGIN: https://prof.va-tools.ru
      PUBLIC_API_URL: http://localhost:3000
      ACCOUNT_APP_URL: https://user.va-tools.ru
      WEB_PUSH_VAPID_PUBLIC_KEY: BHiWL1O1iVRVOfjqlev6lQZc-bDwmzpb1EI5mMpPsFgshXHKikRBwr4PkBOAHmzijHJtILulRxHjZxEUERP73Gs
      WEB_PUSH_VAPID_PRIVATE_KEY: gxC9jcEI6J7exbNd0NA-KlF3w1ZfhIKyXnmEPCvyiig
      WEB_PUSH_VAPID_SUBJECT: mailto:staging@book.local
      PORT: 3000
    command: ["sh", "-c", "node scripts/wait-for-database.mjs && npx prisma migrate deploy && npm run seed:owner && npm run seed:staging && node dist/main.js"]
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  book_staging_pg:
