name: Finalize Document C Once

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/finalize-document-c-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - name: Move document completion actions out of C
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing expected block in {path}: {old[:160]!r}')
              p.write_text(text.replace(old, new))

          path = 'settings/documents/documents.js'
          replace(path,
          '''import {\n  button,''',
          '''import {\n  actionBlock,\n  button,''')

          replace(path,
          '''function setPrimaryVisible(source, visible) {\n  if (!source) return;\n  source.dataset.v2PrimaryVisible = visible ? 'true' : 'false';\n  window.dispatchEvent(new CustomEvent('book:v2-context-changed'));\n}''',
          '''function setPrimaryVisible(source, visible) {\n  if (!source) return;\n  const actions = source.closest('.modal-actions');\n  if (actions) actions.hidden = !visible;\n}''')

          replace(path,
          '''    headerContext(item.title || 'Шаблон', {\n      label: 'Сохранить',\n      data: 'data-template-save data-v2-primary-visible="false"',\n      aria: 'Сохранить шаблон',\n    }),\n    `<form class="form-grid" data-template-form>\n      ${field({ label: 'Название', name: 'documentTitle', value: item.title || '', required: true })}\n      ${textareaField({ label: 'Текст документа', name: 'documentText', value: item.text || '', rows: 16, placeholder: 'Текст документа' })}\n    </form>`,''',
          '''    headerContext(item.title || 'Шаблон'),\n    `<form class="form-grid" data-template-form>\n      ${field({ label: 'Название', name: 'documentTitle', value: item.title || '', required: true })}\n      ${textareaField({ label: 'Текст документа', name: 'documentText', value: item.text || '', rows: 16, placeholder: 'Текст документа' })}\n    </form>`,\n    actionBlock(button('Сохранить', {\n      data: 'data-template-save',\n      aria: 'Сохранить шаблон',\n    })),''')

          replace(path,
          '''    headerContext('Новый документ', {\n      label: 'Сохранить',\n      data: 'data-new-document-save data-v2-primary-visible="false"',\n      aria: 'Сохранить документ',\n    }),''',
          '''    headerContext('Новый документ'),''')

          # Add the one canonical bottom Save after the new-document form.
          replace(path,
          '''      ${signableSetting(signable)}\n    </form>`,\n  ]);''',
          '''      ${signableSetting(signable)}\n    </form>`,\n    actionBlock(button('Сохранить', {\n      data: 'data-new-document-save',\n      aria: 'Сохранить документ',\n    })),\n  ]);''')

          test = 'tests/documents-runtime-browser.html'
          replace(test,
          '''let saveSource = templateLayer?.querySelector('[data-template-save]');\nok(saveSource?.dataset.v2PrimaryVisible === 'false', 'C Save must be hidden before template changes');\nconst templateText = templateLayer?.querySelector('[name="documentText"]');''',
          '''let saveSource = templateLayer?.querySelector('[data-template-save]');\nconst saveActions = saveSource?.closest('.modal-actions');\nok(Boolean(saveSource) && Boolean(saveActions), 'Template editor must expose one bottom Save action');\nok(saveActions?.hidden === true, 'Bottom Save must be hidden before template changes');\nok(!saveSource?.dataset.v2PrimaryVisible, 'Template editor must not keep legacy C visibility metadata');\nconst templateText = templateLayer?.querySelector('[name="documentText"]');''')
          replace(test,
          '''ok(saveSource?.dataset.v2PrimaryVisible === 'true', 'C Save must appear after template change');''',
          '''ok(saveActions?.hidden === false, 'Bottom Save must appear after template change');''')

          # Final repository must not retain this one-shot workflow.
          Path('.github/workflows/finalize-document-c-once.yml').unlink()
          PY
      - name: Commit direct document action cleanup
        shell: bash
        run: |
          git config user.name '3001vaf-maker'
          git config user.email '30.01vaf@gmail.com'
          git add -A
          git commit -m 'Move document Save actions out of C'
          git push origin HEAD:staging
