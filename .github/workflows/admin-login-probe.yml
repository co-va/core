name: Production Admin Login Probe

on:
  push:
    branches: [staging, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unauthenticated-login:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check API availability and measure login response
        shell: bash
        run: |
          set -uo pipefail
          echo 'Testing production API without real credentials or account data'
          health_meta="$(curl --silent --show-error --location --connect-timeout 5 --max-time 15 \
            --output /tmp/admin-health-response.json \
            --write-out '%{http_code}|%{time_total}' \
            'https://api.va-tools.ru/health' 2>/dev/null)" || health_meta='000|timeout'
          echo "API /health: ${health_meta}"
          login_meta="$(curl --silent --show-error --connect-timeout 5 --max-time 20 \
            -H 'Content-Type: application/json' \
            -X POST -d '{"identifier":"unregistered-login-probe@example.invalid","password":"invalid-login-probe"}' \
            --output /tmp/admin-login-response.json \
            --write-out '%{http_code}|%{time_total}' \
            'https://api.va-tools.ru/auth/login' 2>/dev/null)" || login_meta='000|timeout'
          echo "API /auth/login (invalid account): ${login_meta}; expected 401 in under 12 seconds"
          code="${login_meta%%|*}"
          elapsed="${login_meta#*|}"
          if [ "$code" = '401' ]; then
            echo 'LOGIN_ENDPOINT_REACHABLE'
          else
            echo 'LOGIN_ENDPOINT_UNAVAILABLE_OR_UNEXPECTED'
          fi
          if [ "$code" = '000' ]; then
            echo 'Probe could not reach the production endpoint. Check Amvera container and proxy logs.'
          fi

      - name: Check whether the login hotfix is actually deployed to the admin domain
        shell: bash
        run: |
          set -uo pipefail
          if curl --silent --show-error --location --connect-timeout 5 --max-time 15 \
            'https://admin.va-tools.ru/admin/' --output /tmp/live-admin-entry.html; then
            if grep -q 'password-reset-request.js' /tmp/live-admin-entry.html; then
              echo 'ADMIN_RESET_BUTTON_OLD_VERSION_STILL_DEPLOYED'
            else
              echo 'ADMIN_RESET_BUTTON_REMOVAL_PUBLISHED'
            fi
          else
            echo 'ADMIN_ENTRY_UNAVAILABLE'
          fi
          if curl --silent --show-error --location --connect-timeout 5 --max-time 15 \
            'https://admin.va-tools.ru/admin/admin.js' --output /tmp/live-admin-script.js; then
            if grep -q 'function loginWithOneRetry' /tmp/live-admin-script.js; then
              echo 'ADMIN_LOGIN_SESSION_FIX_PUBLISHED'
            else
              echo 'ADMIN_LOGIN_SESSION_FIX_NOT_DEPLOYED'
            fi
          else
            echo 'ADMIN_SCRIPT_UNAVAILABLE'
          fi

      - name: Check production presence release
        shell: bash
        run: |
          set -uo pipefail
          route_code="$(curl --silent --show-error --connect-timeout 5 --max-time 12 \
            -X POST -H 'Content-Type: application/json' \
            --output /tmp/presence-route-response.json --write-out '%{http_code}' \
            'https://api.va-tools.ru/auth/presence' 2>/dev/null)" || route_code='000'
          echo "UNAUTHENTICATED_PRESENCE_ROUTE_STATUS=${route_code}; expected 401 after Core deployment"
          if [ "${route_code}" = '401' ]; then
            echo 'PRESENCE_CORE_ROUTE_PUBLISHED'
          else
            echo 'PRESENCE_CORE_ROUTE_NOT_YET_PUBLISHED'
          fi
          if curl --silent --show-error --location --connect-timeout 5 --max-time 15 \
            'https://admin.va-tools.ru/admin/admin.js' -o /tmp/presence-live-admin.js; then
            if grep -q 'data-online-cell' /tmp/presence-live-admin.js \
              && grep -q 'data-inline-tester' /tmp/presence-live-admin.js; then
              echo 'PRESENCE_ADMIN_UI_PUBLISHED'
            else
              echo 'PRESENCE_ADMIN_UI_NOT_YET_PUBLISHED'
            fi
          else
            echo 'PRESENCE_ADMIN_UI_UNREACHABLE'
          fi

      - name: Verify actual Admin heartbeat files in production
        shell: bash
        run: |
          set -uo pipefail
          script_code="$(curl --silent --show-error --location --connect-timeout 5 --max-time 15 \
            --output /tmp/live-admin-presence.js --write-out '%{http_code}' \
            'https://admin.va-tools.ru/admin/presence.js' 2>/dev/null)" || script_code='000'
          admin_code="$(curl --silent --show-error --location --connect-timeout 5 --max-time 15 \
            --output /tmp/live-admin-entry.js --write-out '%{http_code}' \
            'https://admin.va-tools.ru/admin/admin.js' 2>/dev/null)" || admin_code='000'
          echo "ADMIN_PRESENCE_FILES_HTTP=${script_code}/${admin_code}"
          if [ "${script_code}" = '200' ] && [ "${admin_code}" = '200' ] \
            && grep -q 'startAccountPresence' /tmp/live-admin-presence.js \
            && grep -q 'startAccountPresence' /tmp/live-admin-entry.js \
            && grep -q "auth/presence" /tmp/live-admin-presence.js; then
            echo 'ADMIN_HEARTBEAT_CLIENT_PUBLISHED'
          else
            echo 'ADMIN_HEARTBEAT_CLIENT_NOT_VERIFIED'
          fi
