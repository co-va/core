name: Temporary Remove Account E Dead Code
on:
  push:
    branches: [staging]
    paths: ['.github/workflows/tmp-remove-account-e-dead-code.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Remove dead E code from personal account shell
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('online-booking/account-shell.js')
          s = p.read_text()
          s = s.replace("  const eDeckMarkup = '';\n", '', 1)
          s = s.replace("      eDeck: eDeckMarkup,\n", '', 1)
          s = s.replace("      eOpen: Boolean(state.accountDeckOpen && state.accountEOpen && eDeckMarkup),\n", '', 1)
          dead = '''    const feHost = shell.querySelector('[data-v2-fe]');\n    const currentE = feHost?.querySelector('[data-v2-card-deck][data-v2-deck-level="e"]');\n    const nextEIds = [...(eDeckMarkup.matchAll(/data-v2-card-item="([^\"]+)"/g))].map((match) => match[1]).join('|');\n    const currentEIds = [...(currentE?.querySelectorAll('[data-v2-card-item]') || [])]\n      .map((card) => String(card.dataset.v2CardItem || '')).join('|');\n    if (nextEIds !== currentEIds) {\n      currentE?.remove();\n      if (eDeckMarkup && feHost) feHost.insertAdjacentHTML('beforeend', eDeckMarkup);\n    }\n\n'''
          s = s.replace(dead, '', 1)
          s = s.replace("    shell.classList.toggle('has-e-deck', Boolean(eDeckMarkup));\n", '', 1)
          s = s.replace("    shell.classList.toggle('is-e-open', Boolean(eDeckMarkup && state.accountDeckOpen && state.accountEOpen));\n", '', 1)
          s = s.replace("  state.accountEOpen = false;\n  state.accountEActive = '';\n", '', 1)
          p.write_text(s)
          PY
      - name: Commit cleanup
        run: |
          rm .github/workflows/tmp-remove-account-e-dead-code.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add online-booking/account-shell.js .github/workflows/tmp-remove-account-e-dead-code.yml
          git commit -m "refactor(navigation): remove unused personal E scaffolding"
          git push origin HEAD:staging
