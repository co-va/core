name: Apply Commercial Status Only

on:
  push:
    branches:
      - staging

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Add informational readiness status only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected block not found in {path}')
              p.write_text(text.replace(old, new, 1))

          service = 'server/src/saas-admin/commercial-catalog.service.ts'
          replace_once(service, "type ProductType = 'SYSTEM' | 'TOOL' | 'FOLDER' | 'PACKAGE' | 'CAPACITY' | 'ADDON';\n", "type ProductType = 'SYSTEM' | 'TOOL' | 'FOLDER' | 'PACKAGE' | 'CAPACITY' | 'ADDON';\ntype ProductReadiness = 'NOT_READY' | 'TESTING' | 'READY';\n")
          replace_once(service, "  isActive: boolean;\n  isSaleable: boolean;\n", "  isActive: boolean;\n  readiness: ProductReadiness;\n  isSaleable: boolean;\n")
          replace_once(service, "function text(value: unknown) {\n  return String(value ?? '').trim();\n}\n", "function text(value: unknown) {\n  return String(value ?? '').trim();\n}\n\nfunction productReadiness(value: unknown, fallback: ProductReadiness): ProductReadiness {\n  const status = text(value).toUpperCase();\n  if (!status) return fallback;\n  if (status === 'NOT_READY' || status === 'TESTING' || status === 'READY') return status;\n  throw new BadRequestException('Статус инструмента должен быть NOT_READY, TESTING или READY');\n}\n")
          replace_once(service, "    const isActive = bool(input.isActive, current.isActive);\n    await this.prisma.$executeRawUnsafe(\n      `UPDATE \"CommercialProduct\" SET \"priceMinor\"=$2,\"isFree\"=$3,\"isSaleable\"=$4,\"isActive\"=$5,\"updatedAt\"=CURRENT_TIMESTAMP WHERE \"key\"=$1`,\n      key, priceMinor, isFree, isSaleable, isActive,\n    );", "    const isActive = bool(input.isActive, current.isActive);\n    const readiness = productReadiness(input.readiness, current.readiness);\n    await this.prisma.$executeRawUnsafe(\n      `UPDATE \"CommercialProduct\" SET \"priceMinor\"=$2,\"isFree\"=$3,\"isSaleable\"=$4,\"isActive\"=$5,\"readiness\"=$6,\"updatedAt\"=CURRENT_TIMESTAMP WHERE \"key\"=$1`,\n      key, priceMinor, isFree, isSaleable, isActive, readiness,\n    );")
          replace_once(service, "    await this.audit(actorAdminId, 'CATALOG_PRODUCT_UPDATED', 'PRODUCT', current.id, { key, priceMinor, isFree, isSaleable, isActive, includedProductKeys: input.includedProductKeys });", "    await this.audit(actorAdminId, 'CATALOG_PRODUCT_UPDATED', 'PRODUCT', current.id, { key, priceMinor, isFree, isSaleable, isActive, readiness, includedProductKeys: input.includedProductKeys });")

          admin = 'admin/commercial-catalog.js'
          replace_once(admin, "const EVENT_LABELS = {", "const READINESS = {\n  NOT_READY: 'Не готово',\n  TESTING: 'Проверка',\n  READY: 'Готово',\n};\n\nconst EVENT_LABELS = {")
          replace_once(admin, "function productRow(product, products) {\n  const canCompose = product.type === 'FOLDER' || product.type === 'PACKAGE';", "function productRow(product, products) {\n  const readiness = READINESS[product.readiness] ? product.readiness : 'NOT_READY';\n  const canCompose = product.type === 'FOLDER' || product.type === 'PACKAGE';")
          replace_once(admin, "  return `<div class=\"commercial-product\" data-commercial-product=\"${escapeHtml(product.key)}\" data-free=\"${product.isFree}\" data-saleable=\"${product.isSaleable}\">", "  return `<div class=\"commercial-product\" data-commercial-product=\"${escapeHtml(product.key)}\" data-free=\"${product.isFree}\" data-saleable=\"${product.isSaleable}\" data-readiness=\"${escapeHtml(readiness)}\">")
          replace_once(admin, "    </div>\n    <div class=\"commercial-product-price\">", "    </div>\n    <label class=\"admin-field\" style=\"min-width:130px\"><span>Статус</span><select data-commercial-readiness aria-label=\"Статус ${escapeHtml(product.name)}\">${Object.entries(READINESS).map(([value, label]) => `<option value=\"${value}\"${value === readiness ? ' selected' : ''}>${escapeHtml(label)}</option>`).join('')}</select></label>\n    <div class=\"commercial-product-price\">")
          replace_once(admin, "    row.querySelectorAll('[data-commercial-member]').forEach(bindMember);\n    row.querySelector('[data-commercial-save]')?.addEventListener('click', async (event) => {", "    row.querySelectorAll('[data-commercial-member]').forEach(bindMember);\n    row.querySelector('[data-commercial-readiness]')?.addEventListener('change', (event) => { row.dataset.readiness = event.currentTarget.value; });\n    row.querySelector('[data-commercial-save]')?.addEventListener('click', async (event) => {")
          replace_once(admin, "          body: JSON.stringify({ priceMinor: Math.round(Math.max(0, priceRub) * 100), isFree: row.dataset.free === 'true', isSaleable: row.dataset.saleable === 'true', ...(row.querySelector('[data-commercial-member]') ? { includedProductKeys } : {}) }),", "          body: JSON.stringify({ priceMinor: Math.round(Math.max(0, priceRub) * 100), isFree: row.dataset.free === 'true', isSaleable: row.dataset.saleable === 'true', readiness: row.dataset.readiness || 'NOT_READY', ...(row.querySelector('[data-commercial-member]') ? { includedProductKeys } : {}) }),")

          migration = Path('server/prisma/migrations/20261102104500_commercial_product_readiness_status/migration.sql')
          migration.parent.mkdir(parents=True, exist_ok=True)
          migration.write_text('''ALTER TABLE "CommercialProduct"\n  ADD COLUMN "readiness" TEXT NOT NULL DEFAULT 'NOT_READY';\n\nALTER TABLE "CommercialProduct"\n  ADD CONSTRAINT "CommercialProduct_readiness_check"\n  CHECK ("readiness" IN ('NOT_READY', 'TESTING', 'READY'));\n''')
          PY

          node --check admin/commercial-catalog.js
          git add -N server/prisma/migrations/20261102104500_commercial_product_readiness_status/migration.sql
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' admin/commercial-catalog.js server/prisma/migrations/20261102104500_commercial_product_readiness_status/migration.sql server/src/saas-admin/commercial-catalog.service.ts | sort)"
          test "$changed" = "$expected"
          if grep -R "PRODUCT_NOT_READY\|productReadinessByCapability\|readyProductIds" server/src/saas-access server/src/saas-admin/commercial-tenant.service.ts; then
            echo 'Runtime access coupling detected' >&2
            exit 1
          fi
          docker build -t co-va-commercial-status-check .

      - name: Commit status field
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add admin/commercial-catalog.js server/src/saas-admin/commercial-catalog.service.ts server/prisma/migrations/20261102104500_commercial_product_readiness_status/migration.sql
          git diff --cached --check
          git commit -m 'Add informational commercial product status [skip ci]'
          git push origin HEAD:staging
