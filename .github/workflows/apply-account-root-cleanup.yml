name: Apply Account root cleanup

on:
  push:
    branches: [staging]

permissions:
  contents: write

concurrency:
  group: apply-account-root-cleanup-staging
  cancel-in-progress: false

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'Bootstrap Account root cleanup')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Apply Account root cleanup
        run: python3 scripts/apply-account-root-cleanup.py

      - name: Validate diff
        run: git diff --check

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI Executor"
          git config user.email "actions@users.noreply.github.com"
          git add online-booking/account-shell.js online-booking/booking.js
          git diff --cached --check
          git commit -m "Remove retired Account Overview and History roots"
          git push origin HEAD:staging
