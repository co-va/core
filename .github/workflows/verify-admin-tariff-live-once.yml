name: Verify Admin tariff live release once
on:
  push:
    branches: [release/admin-tariff-publication-20261113]
permissions:
  contents: read
jobs:
  public-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Check actual production Admin files
        shell: bash
        run: |
          set -euo pipefail
          root='https://admin.va-tools.ru/admin'
          curl -fsSL --connect-timeout 8 --max-time 25 "${root}/admin.js?tariff-check=${GITHUB_RUN_ID}" -o /tmp/admin-live.js
          curl -fsSL --connect-timeout 8 --max-time 25 "${root}/?tariff-check=${GITHUB_RUN_ID}" -o /tmp/admin-live.html
          if grep -q 'admin-tariff-publication-action' /tmp/admin-live.js; then
            echo "LIVE_ADMIN_JS=NEW_TARIFF_CARD_PUBLICATION"
          else
            echo "LIVE_ADMIN_JS=OLD_VERSION"
            exit 1
          fi
          if grep -q 'admin-tariff-publication-action' /tmp/admin-live.html; then
            echo "LIVE_ADMIN_HTML=NEW_TARIFF_CARD_PUBLICATION"
          else
            echo "LIVE_ADMIN_HTML=OLD_VERSION"
            exit 1
          fi
