name: Temporary Account Day Runtime Patch

on:
  push:
    branches: [staging]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add temporary account day runtime patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - name: Update stale account Day runtime expectation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/journal-account-runtime-browser.html')
          text = path.read_text()
          old = "ok(accountTimeline?.dataset.timeFrom === '10:00' && accountTimeline?.dataset.timeTo === '11:30', 'account Day timeline does not use account Record from/to geometry');"
          new = "ok(accountTimeline?.dataset.timeFrom === '09:00' && accountTimeline?.dataset.timeTo === '23:00', 'account Day timeline does not keep base 09:00–23:00 grid');"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one stale assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          git config user.name "3001vaf-maker"
          git config user.email "30.01vaf@gmail.com"
          git add tests/journal-account-runtime-browser.html
          git commit -m "Update account Journal day runtime expectation"
          git push origin HEAD:staging