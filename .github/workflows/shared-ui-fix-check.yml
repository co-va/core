name: Shared UI Fix Check

on:
  push:
    branches: [staging]

permissions:
  contents: write

concurrency:
  group: shared-ui-fix-check-staging
  cancel-in-progress: true

jobs:
  fix-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Remove final A settings metadata
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('online-booking/account-shell.js')
          s = p.read_text()
          pattern = re.compile(
              r"a:\s*\{\s*kind:\s*'avatar',\s*label:\s*accountName\(state\),\s*image:\s*accountPhoto\(state\),\s*data:\s*'data-account-profile-settings',\s*settingsTag:\s*true,\s*aria:\s*'Настройки профиля',\s*\},",
              re.S,
          )
          replacement = "a: {\n      kind: 'avatar',\n      label: accountName(state),\n      image: accountPhoto(state),\n    },"
          next_s, count = pattern.subn(replacement, s)
          if count != 1:
              raise SystemExit(f'expected one final profile A settings block, found {count}')
          p.write_text(next_s)
      - name: Run existing architecture checks
        run: npm run check
      - name: Commit checked fix and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/shared-ui-fix-check.yml
          git config user.name "3001vaf-maker"
          git config user.email "30.01vaf@gmail.com"
          git add -A
          git commit -m "Remove final A settings metadata"
          git push origin HEAD:staging
