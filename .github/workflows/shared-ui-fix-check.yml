name: Shared UI Fix Check

on:
  push:
    branches: [staging]

permissions:
  contents: write

concurrency:
  group: shared-ui-fix-check-staging
  cancel-in-progress: true

jobs:
  fix-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run architecture and syntax checks
        run: npm run check
