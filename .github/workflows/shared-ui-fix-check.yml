name: Shared UI Fix Check

on:
  push:
    branches: [staging]

permissions:
  contents: write

concurrency:
  group: shared-ui-fix-check-staging
  cancel-in-progress: true

jobs:
  fix-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply Shared UI finalizer
        run: node scripts/finalize-shared-ui-contract.mjs
      - name: Run existing architecture checks
        run: npm run check
      - name: Commit verified result and remove temporary finalizer
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/shared-ui-fix-check.yml
          rm scripts/finalize-shared-ui-contract.mjs
          git config user.name "3001vaf-maker"
          git config user.email "30.01vaf@gmail.com"
          git add -A
          git commit -m "Finalize Shared UI architecture contract"
          git push origin HEAD:staging
