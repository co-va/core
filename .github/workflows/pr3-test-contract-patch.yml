name: PR3 Test Contract Patch

on:
  push:
    branches: [staging]
    paths:
      - .github/workflows/pr3-test-contract-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - name: Update stale Account root source regression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/booking-account-ui.test.mjs')
          s = p.read_text()
          old = "assert.match(accountShell, /GLOBAL_ACCOUNT_ROOTS = Object\\.freeze\\(\\[[\\s\\S]*?id: 'profile', label: 'Профиль'[\\s\\S]*?id: 'home', label: 'Обзор'[\\s\\S]*?id: 'contacts', label: 'Контакты'[\\s\\S]*?id: 'history', label: 'История'/);"
          new = "assert.match(accountShell, /GLOBAL_ACCOUNT_ROOTS = Object\\.freeze\\(\\[[\\s\\S]*?id: 'profile', label: 'Профиль'[\\s\\S]*?id: 'journal', label: 'Журнал'[\\s\\S]*?id: 'contacts', label: 'Контакты'[\\s\\S]*?id: 'history', label: 'История'/);\nassert.doesNotMatch(accountShell, /GLOBAL_ACCOUNT_ROOTS = Object\\.freeze\\(\\[[\\s\\S]*?id: 'home', label: 'Обзор'/);"
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'expected 1 stale Account root assertion, found {count}')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr3-test-contract-patch.yml
          git add tests/booking-account-ui.test.mjs
          git diff --cached --check
          git commit -m "Update Account Journal root regression contract"
          git push origin HEAD:staging
