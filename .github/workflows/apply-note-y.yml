name: Apply Note Y implementation

on:
  push:
    branches: [staging]

permissions:
  contents: write
  statuses: write

concurrency:
  group: apply-note-y-staging
  cancel-in-progress: false

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'Bootstrap Note Y implementation')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Rehydrate Note/Y patch
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/.note-y-part-1 scripts/.note-y-part-2 scripts/.note-y-part-3 scripts/.note-y-part-4 > /tmp/note-y-payload.b64
          python3 - <<'PY'
          import base64, lzma
          from pathlib import Path
          payload = base64.b64decode(Path('/tmp/note-y-payload.b64').read_text())
          Path('scripts/apply-note-y.py').write_bytes(lzma.decompress(payload))
          PY
          rm scripts/.note-y-part-1 scripts/.note-y-part-2 scripts/.note-y-part-3 scripts/.note-y-part-4 /tmp/note-y-payload.b64

      - name: Fix bootstrap openPicker anchor
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-note-y.py')
          text = path.read_text()
          old = '''old = "  title='Время',\\n  onSave=()=>{},\\n}={}){"
          new = "  title='Время',\\n  allowEmpty=false,\\n  onSave=()=>{},\\n  onClear=()=>{},\\n}={}){"
          if time_text.count(old) != 1: raise RuntimeError('openPicker signature changed')
          time_text = time_text.replace(old, new, 1)
          '''
          new = '''old = "function openPicker({\\n  currentValue='00:00',\\n  minuteStep=15,\\n  minValue='00:00',\\n  maxValue='23:59',\\n  title='Время',\\n  onSave=()=>{},\\n}={}){"
          new = "function openPicker({\\n  currentValue='00:00',\\n  minuteStep=15,\\n  minValue='00:00',\\n  maxValue='23:59',\\n  title='Время',\\n  allowEmpty=false,\\n  onSave=()=>{},\\n  onClear=()=>{},\\n}={}){"
          if time_text.count(old) != 1: raise RuntimeError('openPicker signature changed')
          time_text = time_text.replace(old, new, 1)
          '''
          if old not in text:
              raise SystemExit('bootstrap openPicker block not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Apply Note/Y patch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          output="$(python3 scripts/apply-note-y.py 2>&1)"
          code=$?
          printf '%s\n' "$output"
          if [ "$code" -ne 0 ]; then
            description="$(printf '%s\n' "$output" | tail -n 1 | tr '\n\r' '  ' | cut -c1-135)"
            printf '### Note/Y apply failure\n```text\n%s\n```\n' "$output" >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Note/Y apply::$description"
            payload="$(jq -nc --arg state error --arg context note-y-apply --arg description "$description" '{state:$state,context:$context,description:$description}')"
            curl -fsS -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -d "$payload" >/dev/null
            exit "$code"
          fi

      - name: Diff sanity
        run: git diff --check

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI Executor"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Implement Note and Y reels"
          git push origin HEAD:staging
