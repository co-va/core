name: Core Platform Production Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: core-platform-production-smoke
  cancel-in-progress: true

jobs:
  domains:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify platform landing, Admin, API and password recovery
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --location --connect-timeout 5 --max-time 15 \
            https://va-tools.ru/ -o /tmp/platform-landing.html
          grep -Fq 'prof.va-tools.ru/' /tmp/platform-landing.html
          curl --fail-with-body --silent --show-error --location --connect-timeout 5 --max-time 15 \
            https://admin.va-tools.ru/admin/ -o /tmp/platform-admin.html
          grep -Fq '<title>Администрирование</title>' /tmp/platform-admin.html
          curl --fail-with-body --silent --show-error --location --connect-timeout 5 --max-time 15 \
            https://admin.va-tools.ru/admin/admin.js -o /dev/null
          curl --fail-with-body --silent --show-error --location --connect-timeout 5 --max-time 15 \
            https://api.va-tools.ru/health -o /tmp/platform-health.json
          node -e "const fs=require('fs');const h=JSON.parse(fs.readFileSync('/tmp/platform-health.json','utf8'));if(h.status!=='ok'||h.database!=='ok')process.exit(1)"
          for endpoint in auth/password-reset/request online-booking/account/password-reset/request; do
            if [ "$endpoint" = "auth/password-reset/request" ]; then
              payload='{"email":"production-smoke-does-not-exist@invalid.example","surface":"admin"}'
            else
              payload='{"identifier":"production-smoke-does-not-exist@invalid.example"}'
            fi
            curl --fail-with-body --silent --show-error --connect-timeout 5 --max-time 15 \
              -H 'Content-Type: application/json' -d "$payload" \
              "https://api.va-tools.ru/$endpoint" -o /tmp/platform-reset.json
            node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('/tmp/platform-reset.json','utf8'));if(p.accepted!==true)process.exit(1)"
          done
          echo "Core platform production: PASS"
