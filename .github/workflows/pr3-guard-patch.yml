name: PR3 Guard Patch

on:
  push:
    branches: [staging]
    paths:
      - .github/workflows/pr3-guard-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - name: Update Account root architecture guard
        shell: bash
        run: |
          echo '' | base64 -d >/tmp/patch.py
          python3 /tmp/patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr3-guard-patch.yml
          git add scripts/check-ui-v2-architecture.mjs
          git diff --cached --check
          git commit -m "Update Account Journal root architecture guard"
          git push origin HEAD:staging
