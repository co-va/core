name: Patch Booking Smoke Contract

on:
  push:
    branches: [staging]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore(ci): patch booking smoke safely'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - name: Align Public Booking smoke with ready consent state
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/check.yml')
          lines = path.read_text().splitlines()

          pdn_indexes = [
              index for index, line in enumerate(lines)
              if 'pdn_consent=$(node -e' in line and 'documentVersion:d.version' in line
          ]
          if len(pdn_indexes) != 1:
              raise SystemExit(f'expected one stale PDN fact line, found {len(pdn_indexes)}')
          pdn_index = pdn_indexes[0]
          indent = lines[pdn_index][:len(lines[pdn_index]) - len(lines[pdn_index].lstrip())]
          lines[pdn_index] = indent + '''pdn_consent=$(node -e "const p=JSON.parse(process.argv[1]); const d=(p.documents||[]).find((item)=>item.id==='pdn-consent'); if(!d) { console.error('PDN consent missing from public booking context'); process.exit(1); } process.stdout.write(JSON.stringify({documentId:d.id,accepted:true}))" "$booking_context")'''

          error_indexes = [
              index for index, line in enumerate(lines)
              if 'Public booking state did not expose the current PDN consent version' in line
          ]
          if len(error_indexes) != 1:
              raise SystemExit(f'expected one stale booking-state assertion, found {len(error_indexes)}')
          error_index = error_indexes[0]
          start = next(index for index in range(error_index, -1, -1) if lines[index].strip() == 'node -e "')
          end = next(index for index in range(error_index, len(lines)) if '" "$booking_state" "$pdn_consent"' in lines[index])
          block_indent = lines[start][:len(lines[start]) - len(lines[start].lstrip())]
          inner = block_indent + '  '
          replacement = [
              block_indent + 'node -e "',
              inner + 'const state=JSON.parse(process.argv[1]);',
              inner + "const pdn=(state.consents||[]).find((item)=>String(item.documentId||'')==='pdn-consent');",
              inner + "const marketing=(state.consents||[]).find((item)=>String(item.documentId||'')==='messages-consent');",
              inner + 'if(state.legalState?.pdnActive!==false || state.legalState?.marketingActive!==false || !pdn || pdn.active!==false || pdn.required!==true || !marketing || marketing.active!==false || marketing.marketing!==true){',
              inner + "  console.error('Public booking state did not expose ready inactive PDN/marketing state for a new contact');",
              inner + '  process.exit(1);',
              inner + '}',
              block_indent + '" "$booking_state"',
          ]
          lines[start:end + 1] = replacement
          path.write_text('\n'.join(lines) + '\n')
          PY
          rm .github/workflows/patch-booking-smoke.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/check.yml .github/workflows/patch-booking-smoke.yml
          git commit -m "fix(ci): align booking smoke with current consent state"
          git push origin HEAD:staging
