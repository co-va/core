name: Onboarding Smoke

on:
  push:
    branches: [staging]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: onboarding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  onboarding-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start isolated backend
        run: |
          docker compose -f docker-compose.staging.yml build backend
          docker compose -f docker-compose.staging.yml up -d db backend

      - name: Wait for backend
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:3000/health >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.staging.yml logs db backend
          exit 1

      - name: Verify public registration through authenticated DEMO
        shell: bash
        run: |
          set -euo pipefail

          registration_email="onboarding-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.invalid"
          registration_phone="+79990007777"
          registration_password="Onboarding-${GITHUB_RUN_ID}-Pass!"

          start_payload=$(curl -fsS \
            -H 'Content-Type: application/json' \
            -d "$(node -e "process.stdout.write(JSON.stringify({email:process.argv[1]}))" "$registration_email")" \
            http://localhost:3000/tenant-invitations/public)

          first_token=$(node -e "const p=JSON.parse(process.argv[1]); if(!p.token) process.exit(1); process.stdout.write(p.token)" "$start_payload")
          tenant_id=$(node -e "const p=JSON.parse(process.argv[1]); if(!p.tenantId) process.exit(1); process.stdout.write(p.tenantId)" "$start_payload")
          invitation_id=$(node -e "const p=JSON.parse(process.argv[1]); if(!p.invitationId) process.exit(1); process.stdout.write(p.invitationId)" "$start_payload")

          resume_payload=$(curl -fsS \
            -H 'Content-Type: application/json' \
            -d "$(node -e "process.stdout.write(JSON.stringify({email:process.argv[1]}))" "$registration_email")" \
            http://localhost:3000/tenant-invitations/public)

          token=$(node -e "const p=JSON.parse(process.argv[1]); if(!p.token) process.exit(1); process.stdout.write(p.token)" "$resume_payload")
          resume_tenant_id=$(node -e "const p=JSON.parse(process.argv[1]); process.stdout.write(String(p.tenantId||''))" "$resume_payload")
          resume_invitation_id=$(node -e "const p=JSON.parse(process.argv[1]); process.stdout.write(String(p.invitationId||''))" "$resume_payload")
          if [ "$resume_tenant_id" != "$tenant_id" ] || [ "$resume_invitation_id" != "$invitation_id" ]; then
            echo "Repeated registration created a duplicate tenant or invitation"
            exit 1
          fi
          if [ "$token" = "$first_token" ]; then
            echo "Repeated registration did not rotate the invitation token"
            exit 1
          fi

          old_token_status=$(curl -sS -o /tmp/old-token.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d "$(node -e "process.stdout.write(JSON.stringify({token:process.argv[1]}))" "$first_token")" \
            http://localhost:3000/tenant-invitations/inspect)
          if [ "$old_token_status" -lt 400 ]; then
            echo "Old registration token remained valid after resume"
            cat /tmp/old-token.json
            exit 1
          fi

          inspect_payload=$(curl -fsS \
            -H 'Content-Type: application/json' \
            -d "$(node -e "process.stdout.write(JSON.stringify({token:process.argv[1]}))" "$token")" \
            http://localhost:3000/tenant-invitations/inspect)

          node -e "
            const p=JSON.parse(process.argv[1]);
            const expectedEmail=process.argv[2];
            const expectedTenant=process.argv[3];
            if(p.email!==expectedEmail) throw new Error('Public registration email was not preserved');
            if(p.tenant?.id!==expectedTenant) throw new Error('Public registration tenant mismatch');
            if(p.requiresEmail) throw new Error('Public email registration unexpectedly requires email again');
            if(!Array.isArray(p.documents) || !p.documents.some((d)=>d.required)) throw new Error('Required registration documents missing');
            if(p.demo?.activatedAt || p.demo?.expiresAt) throw new Error('DEMO started before Profile opening');
          " "$inspect_payload" "$registration_email" "$tenant_id"

          document_facts=$(node -e "
            const p=JSON.parse(process.argv[1]);
            process.stdout.write(JSON.stringify((p.documents||[]).map((d)=>({key:d.key,version:d.version,accepted:Boolean(d.required)}))));
          " "$inspect_payload")

          accept_payload=$(curl -fsS \
            -H 'Content-Type: application/json' \
            -d "$(node -e "process.stdout.write(JSON.stringify({token:process.argv[1],password:process.argv[2],name:'Onboarding',surname:'Smoke',phone:process.argv[3],documents:JSON.parse(process.argv[4])}))" "$token" "$registration_password" "$registration_phone" "$document_facts")" \
            http://localhost:3000/tenant-invitations/accept)

          access_token=$(node -e "const p=JSON.parse(process.argv[1]); if(!p.accessToken) process.exit(1); process.stdout.write(p.accessToken)" "$accept_payload")
          account_id=$(node -e "const p=JSON.parse(process.argv[1]); if(!p.account?.id) process.exit(1); process.stdout.write(p.account.id)" "$accept_payload")

          auth_me=$(curl -fsS -H "Authorization: Bearer $access_token" http://localhost:3000/auth/me)
          node -e "
            const p=JSON.parse(process.argv[1]);
            if(p.account?.email!==process.argv[2]) throw new Error('Registered account cannot be resolved by /auth/me');
            if(p.tenant?.id!==process.argv[3]) throw new Error('/auth/me tenant mismatch');
          " "$auth_me" "$registration_email" "$tenant_id"

          email_login_status=$(curl -sS -o /tmp/email-login.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d "$(node -e "process.stdout.write(JSON.stringify({email:process.argv[1],password:process.argv[2]}))" "$registration_email" "$registration_password")" \
            http://localhost:3000/auth/login)
          if [ "$email_login_status" -lt 400 ]; then
            echo "Professional account unexpectedly logged in by email"
            cat /tmp/email-login.json
            exit 1
          fi

          login_payload=$(curl -fsS \
            -H 'Content-Type: application/json' \
            -d "$(node -e "process.stdout.write(JSON.stringify({identifier:process.argv[1],password:process.argv[2]}))" "$registration_phone" "$registration_password")" \
            http://localhost:3000/auth/login)
          login_token=$(node -e "const p=JSON.parse(process.argv[1]); if(!p.accessToken) process.exit(1); process.stdout.write(p.accessToken)" "$login_payload")
          login_me=$(curl -fsS -H "Authorization: Bearer $login_token" http://localhost:3000/auth/me)
          node -e "
            const p=JSON.parse(process.argv[1]);
            if(p.account?.email!==process.argv[2]) throw new Error('Registered user cannot log in again by phone');
            if(p.tenant?.id!==process.argv[3]) throw new Error('Repeated login opened the wrong tenant');
          " "$login_me" "$registration_email" "$tenant_id"

          access_before=$(curl -fsS -H "Authorization: Bearer $access_token" http://localhost:3000/saas-access/me)
          node -e "
            const p=JSON.parse(process.argv[1]);
            if(p.commercialMode!=='DEMO') throw new Error('New profile is not DEMO');
            if(p.demoActivatedAt || p.demoExpiresAt) throw new Error('DEMO activated before Profile open');
          " "$access_before"

          access_after=$(curl -fsS \
            -X POST \
            -H "Authorization: Bearer $access_token" \
            -H 'Content-Type: application/json' \
            -d '{}' \
            http://localhost:3000/saas-access/demo/activate)

          node -e "
            const p=JSON.parse(process.argv[1]);
            if(!p.demoActivatedAt || !p.demoExpiresAt) throw new Error('DEMO did not activate on Profile open');
            const days=(Date.parse(p.demoExpiresAt)-Date.parse(p.demoActivatedAt))/86400000;
            if(Math.abs(days-14)>0.01) throw new Error('DEMO is not exactly 14 days');
          " "$access_after"

          db_count() {
            docker compose -f docker-compose.staging.yml exec -T db \
              psql -U book -d book_staging -Atc "$1" | tr -d '\r\n'
          }
          assert_one() {
            local label="$1"
            local query="$2"
            local actual
            actual=$(db_count "$query")
            if [ "$actual" != "1" ]; then
              echo "$label: expected 1, got $actual"
              exit 1
            fi
          }

          assert_one "PlatformAdmin bootstrap" 'SELECT COUNT(*) FROM "PlatformAdmin";'
          assert_one "Registration tenant" "SELECT COUNT(*) FROM \"Tenant\" WHERE \"id\" = '$tenant_id';"
          assert_one "DEMO access" "SELECT COUNT(*) FROM \"TenantAccess\" WHERE \"tenantId\" = '$tenant_id' AND \"commercialMode\" = 'DEMO';"
          assert_one "Accepted invitation" "SELECT COUNT(*) FROM \"TenantInvitation\" WHERE \"id\" = '$invitation_id' AND \"tenantId\" = '$tenant_id' AND \"status\" = 'ACCEPTED';"
          assert_one "PlatformAccount" "SELECT COUNT(*) FROM \"PlatformAccount\" WHERE \"id\" = '$account_id' AND \"email\" = '$registration_email';"
          assert_one "OWNER Membership" "SELECT COUNT(*) FROM \"Membership\" WHERE \"tenantId\" = '$tenant_id' AND \"platformAccountId\" = '$account_id' AND \"role\" = 'OWNER';"
          assert_one "Profile" "SELECT COUNT(*) FROM \"Profile\" WHERE \"tenantId\" = '$tenant_id' AND \"platformAccountId\" = '$account_id';"
          assert_one "Unverified registration email" "SELECT COUNT(*) FROM \"PlatformAccount\" WHERE \"id\" = '$account_id' AND \"emailVerifiedAt\" IS NULL;"

          reset_before_verify=$(curl -fsS \
            -H 'Content-Type: application/json' \
            -d "$(node -e "process.stdout.write(JSON.stringify({identifier:process.argv[1],surface:'app'}))" "$registration_phone")" \
            http://localhost:3000/auth/password-reset/request)
          node -e "const p=JSON.parse(process.argv[1]); if(p.accepted!==true) throw new Error('Unverified reset request was not generically accepted')" "$reset_before_verify"
          reset_before_count=$(db_count "SELECT COUNT(*) FROM \"PasswordResetTicket\" WHERE \"subjectType\" = 'PLATFORM' AND \"subjectId\" = '$account_id' AND \"usedAt\" IS NULL;")
          if [ "$reset_before_count" != "0" ]; then
            echo "Unverified email unexpectedly received a password reset ticket"
            exit 1
          fi

          docker compose -f docker-compose.staging.yml exec -T db \
            psql -U book -d book_staging -c "UPDATE \"PlatformAccount\" SET \"emailVerifiedAt\" = CURRENT_TIMESTAMP WHERE \"id\" = '$account_id';" >/dev/null

          reset_request=$(curl -fsS \
            -H 'Content-Type: application/json' \
            -d "$(node -e "process.stdout.write(JSON.stringify({identifier:process.argv[1],surface:'app'}))" "$registration_phone")" \
            http://localhost:3000/auth/password-reset/request)
          node -e "const p=JSON.parse(process.argv[1]); if(p.accepted!==true) throw new Error('Verified password reset request was not accepted')" "$reset_request"
          assert_one "Password reset ticket for verified email" "SELECT COUNT(*) FROM \"PasswordResetTicket\" WHERE \"subjectType\" = 'PLATFORM' AND \"subjectId\" = '$account_id' AND \"usedAt\" IS NULL;"

          consent_count=$(db_count "SELECT COUNT(*) FROM \"PlatformConsentEvent\" WHERE \"tenantId\" = '$tenant_id' AND \"platformAccountId\" = '$account_id';")
          if [ "$consent_count" -lt 1 ]; then
            echo "Registration consent events missing"
            exit 1
          fi

      - name: Stop isolated onboarding environment
        if: always()
        run: docker compose -f docker-compose.staging.yml down -v
