name: PR3 Account Journal Root Patch

on:
  push:
    branches: [staging]
    paths:
      - .github/workflows/pr3-account-journal-root-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - name: Apply focused PR3 patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/pr3-patch.z
          python3 -c "import zlib; exec(zlib.decompress(open('/tmp/pr3-patch.z','rb').read()))"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add online-booking/account-shell.js online-booking/booking.js tests/account-shell-runtime-browser.html
          git diff --cached --check
          git commit -m "Set Account Journal as end-user root"
          git push origin HEAD:staging
