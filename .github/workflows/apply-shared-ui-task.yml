name: Apply Shared UI Task

on:
  push:
    branches: [staging]

permissions:
  contents: write

concurrency:
  group: apply-shared-ui-staging
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor == '3001vaf-maker'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply deterministic patch
        shell: bash
        run: |
          set -euo pipefail
          sed -i "s/'profile settings selectors', 2)/'profile settings selectors', 3)/" scripts/apply-shared-ui-task.mjs
          node scripts/apply-shared-ui-task.mjs
      - name: Commit patched Shared UI
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "3001vaf-maker"
          git config user.email "30.01vaf@gmail.com"
          git add -A
          git commit -m "Align Shared UI architecture"
          git push origin HEAD:staging
