name: Prepare fallback Core image
on:
  push:
    branches:
      - diagnostics/core-main-docker-20261117
    paths:
      - .github/workflows/diagnose-core-ghcr.yml

permissions:
  contents: read
  packages: write

jobs:
  publish-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout immutable approved Core main
        uses: actions/checkout@v4
        with:
          ref: d8dee4b0972819b8950574c6d3cfe05666fc736c
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push a standalone fallback image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/co-va/core:release-d8dee4b0
          labels: |
            org.opencontainers.image.source=https://github.com/co-va/core
            org.opencontainers.image.revision=d8dee4b0972819b8950574c6d3cfe05666fc736c
      - name: Verify image manifest
        run: docker buildx imagetools inspect ghcr.io/co-va/core:release-d8dee4b0
