name: Apply Account Note implementation

on:
  push:
    branches: [staging]

permissions:
  contents: write

concurrency:
  group: apply-account-note-staging
  cancel-in-progress: false

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'Bootstrap Account Note implementation')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Apply Account Note patch
        run: python3 scripts/apply-account-note.py

      - name: Keep bootstrap out of implementation commit
        shell: bash
        run: |
          git restore .github/workflows/check.yml
          git restore .github/workflows/apply-account-note.yml

      - name: Validate diff
        run: git diff --check

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI Executor"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Share Note with Account Journal"
          git push origin HEAD:staging
