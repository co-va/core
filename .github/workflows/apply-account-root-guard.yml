name: Apply Account root guard cleanup

on:
  push:
    branches: [staging]

permissions:
  contents: write

concurrency:
  group: apply-account-root-guard-staging
  cancel-in-progress: false

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'Bootstrap Account root guard cleanup')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Apply Account root guard cleanup
        run: python3 scripts/apply-account-root-guard.py

      - name: Validate diff
        run: git diff --check

      - name: Commit guard update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI Executor"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/check-ui-v2-architecture.mjs
          git diff --cached --check
          git commit -m "Update Account root architecture guard"
          git push origin HEAD:staging
