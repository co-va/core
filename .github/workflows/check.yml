name: Check Book

on:
  push:
    branches: [staging]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enforce branch policy
        shell: bash
        run: |
          branch_name="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            branch_name="${GITHUB_BASE_REF}"
          fi
          if [ "${branch_name}" != "main" ] && [ "${branch_name}" != "staging" ]; then
            echo "Only main and staging branches are allowed"
            exit 1
          fi
      - name: Syntax and architecture checks
        run: npm run check
      - name: Domain regression tests
        run: npm test
      - name: Browser FEZ runtime regression
        shell: bash
        run: |
          set -euo pipefail
          chrome_bin=""
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              chrome_bin="$(command -v "$candidate")"
              break
            fi
          done
          if [ -z "$chrome_bin" ]; then
            echo "No Chromium-compatible browser found on runner"
            exit 1
          fi
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/fez-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/tests/fez-runtime-browser.html >/dev/null; then
              break
            fi
            sleep 0.25
          done
          run_browser_case() {
            local path="$1"
            local marker="$2"
            local stage_attr="$3"
            local output="$4"
            local browser_status
            set +e
            timeout --signal=TERM --kill-after=5s 45s "$chrome_bin" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --window-size=390,844 \
              --force-device-scale-factor=1 \
              --touch-events=enabled \
              --virtual-time-budget=12000 \
              --dump-dom \
              "http://127.0.0.1:4173/$path" \
              > "$output"
            browser_status=$?
            set -e
            if [ "$browser_status" -eq 124 ] || [ "$browser_status" -eq 137 ]; then
              echo "Browser runtime regression timed out after 45s: $path"
              exit 1
            fi
            if [ "$browser_status" -ne 0 ]; then
              echo "Browser runtime regression browser failed: $path (exit $browser_status)"
              exit 1
            fi
            if ! grep -Fq "$marker" "$output"; then
              echo "Browser runtime regression failed: $path"
              grep -o "$stage_attr=\"[^\"]*\"" "$output" || true
              grep -A4 -B2 '<pre id="result"' "$output" || true
              exit 1
            fi
          }
          run_browser_case "tests/fez-runtime-browser.html" 'data-fez-runtime="pass"' 'data-fez-runtime-stage' /tmp/fez-runtime-dom.html
          run_browser_case "tests/account-shell-runtime-browser.html" 'data-account-runtime="pass"' 'data-account-runtime-stage' /tmp/account-runtime-dom.html
          run_browser_case "tests/professional-core-runtime-browser.html" 'data-professional-runtime="pass"' 'data-professional-runtime-stage' /tmp/professional-runtime-dom.html
          run_browser_case "tests/profile-workplace-runtime-browser.html" 'data-profile-workplace-runtime="pass"' 'data-profile-workplace-runtime' /tmp/profile-workplace-runtime-dom.html
          run_browser_case "tests/documents-runtime-browser.html" 'data-documents-runtime="pass"' 'data-documents-runtime-stage' /tmp/documents-runtime-dom.html
          run_browser_case "tests/data-transfer-runtime-browser.html" 'data-transfer-runtime="pass"' 'data-transfer-runtime-stage' /tmp/data-transfer-runtime-dom.html
      - name: Validate staging compose
        run: docker compose -f docker-compose.staging.yml config >/dev/null
      - name: Install server dependencies
        run: npm install --prefix server
      - name: Generate Prisma client
        run: npm run prisma:generate --prefix server
      - name: Build server
        run: npm run build --prefix server

  modal-browser-interaction:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install isolated browser test runner
        run: npm install --prefix "$RUNNER_TEMP/modal-browser" --no-audit --no-fund playwright@1.62.1
      - name: Verify shared modal hit targets with mouse and touch
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/modal-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/tests/modal-hit-targets-browser.html >/dev/null; then
              break
            fi
            sleep 0.25
          done
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/modal-browser/node_modules/playwright/index.mjs" node scripts/check-modal-browser-interaction.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/modal-browser/node_modules/playwright/index.mjs" node scripts/check-list-reorder-browser-interaction.mjs

  # Historical migration/recovery checks are intentionally manual-only.
  profile-migration-upgrade:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install server dependencies
        run: npm install --prefix server
      - name: Start isolated database
        run: |
          docker compose -f docker-compose.staging.yml up -d db
          for attempt in $(seq 1 30); do
            if docker compose -f docker-compose.staging.yml exec -T db pg_isready -U book -d book_staging >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.staging.yml logs db
          exit 1
      - name: Apply pre-PROFILE migration chain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/profile-migrations
          mv server/prisma/migrations/20260919183000_tenant_invitation_naming /tmp/profile-migrations/
          mv server/prisma/migrations/20260919184000_owner_membership_role /tmp/profile-migrations/
          mv server/prisma/migrations/20260919185000_platform_account_naming /tmp/profile-migrations/
          mv server/prisma/migrations/20260921190000_first_run_scenario /tmp/profile-migrations/
          mv server/prisma/migrations/20260921193000_platform_profile_controls /tmp/profile-migrations/
          mv server/prisma/migrations/20260921194000_platform_notices /tmp/profile-migrations/
          mv server/prisma/migrations/20260921195000_commercial_mode_compat /tmp/profile-migrations/
          mv server/prisma/migrations/20260922043000_detach_immutable_legal_events /tmp/profile-migrations/
          mv server/prisma/migrations/20260922075500_prelaunch_hard_delete_clean_start /tmp/profile-migrations/
          mv server/prisma/migrations/20260922081000_purge_non_owner_profiles /tmp/profile-migrations/
          mv server/prisma/migrations/20260922094500_purge_unapproved_legacy_live /tmp/profile-migrations/
          mv server/prisma/migrations/20260922173000_platform_push_subscription /tmp/profile-migrations/
          mv server/prisma/migrations/20260922213000_demo_starts_at_profile_open /tmp/profile-migrations/
          mv server/prisma/migrations/20260930143000_remove_first_run_runtime /tmp/profile-migrations/
          (
            cd server
            DATABASE_URL='postgresql://book:book_staging_local@localhost:54329/book_staging?schema=public' npx prisma migrate deploy
          )
      - name: Seed representative pre-PROFILE rows
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.staging.yml exec -T db psql -U book -d book_staging <<'SQL'
          INSERT INTO "Tenant" ("id","name","updatedAt")
          VALUES ('upgrade-tenant','Upgrade Tenant',CURRENT_TIMESTAMP);

          INSERT INTO "User" ("id","email","passwordHash","onboardingStep","workspaceUnlocked","updatedAt")
          VALUES ('upgrade-user','upgrade@example.invalid','hash',3,true,CURRENT_TIMESTAMP);

          INSERT INTO "Membership" ("id","tenantId","userId","role")
          VALUES ('upgrade-membership','upgrade-tenant','upgrade-user','OWNER');

          INSERT INTO "WorkspaceState" ("id","tenantId","userId","data","revision","updatedAt")
          VALUES ('upgrade-workspace','upgrade-tenant','upgrade-user','{"kept":true}'::jsonb,7,CURRENT_TIMESTAMP);

          INSERT INTO "Profile" (
            "id","tenantId","userId","name","phones","telegrams","emails","customProfessions","updatedAt"
          )
          VALUES (
            'upgrade-profile','upgrade-tenant','upgrade-user','Upgrade Profile',
            '[]'::jsonb,'[]'::jsonb,'["upgrade@example.invalid"]'::jsonb,'[]'::jsonb,CURRENT_TIMESTAMP
          );

          INSERT INTO "PlatformAdmin" ("id","userId","updatedAt")
          VALUES ('upgrade-admin','upgrade-user',CURRENT_TIMESTAMP);

          INSERT INTO "MasterInvitation" (
            "id","tenantId","createdByAdminId","email","name","tokenHash","status","expiresAt","updatedAt"
          )
          VALUES (
            'upgrade-invitation','upgrade-tenant','upgrade-admin','invite@example.invalid','Invite',
            'upgrade-token-hash','PENDING',CURRENT_TIMESTAMP + INTERVAL '7 days',CURRENT_TIMESTAMP
          );
          SQL
      - name: Apply PROFILE migrations
        shell: bash
        run: |
          set -euo pipefail
          mv /tmp/profile-migrations/20260919183000_tenant_invitation_naming server/prisma/migrations/
          mv /tmp/profile-migrations/20260919184000_owner_membership_role server/prisma/migrations/
          mv /tmp/profile-migrations/20260919185000_platform_account_naming server/prisma/migrations/
          mv /tmp/profile-migrations/20260921190000_first_run_scenario server/prisma/migrations/
          mv /tmp/profile-migrations/20260921193000_platform_profile_controls server/prisma/migrations/
          mv /tmp/profile-migrations/20260921194000_platform_notices server/prisma/migrations/
          mv /tmp/profile-migrations/20260921195000_commercial_mode_compat server/prisma/migrations/
          mv /tmp/profile-migrations/20260922043000_detach_immutable_legal_events server/prisma/migrations/
          mv /tmp/profile-migrations/20260922075500_prelaunch_hard_delete_clean_start server/prisma/migrations/
          mv /tmp/profile-migrations/20260922081000_purge_non_owner_profiles server/prisma/migrations/
          mv /tmp/profile-migrations/20260922094500_purge_unapproved_legacy_live server/prisma/migrations/
          mv /tmp/profile-migrations/20260921195000_commercial_mode_compat server/prisma/migrations/
          mv /tmp/profile-migrations/20260922043000_detach_immutable_legal_events server/prisma/migrations/
          mv /tmp/profile-migrations/20260922075500_prelaunch_hard_delete_clean_start server/prisma/migrations/
          mv /tmp/profile-migrations/20260922081000_purge_non_owner_profiles server/prisma/migrations/
          mv /tmp/profile-migrations/20260922094500_purge_unapproved_legacy_live server/prisma/migrations/
          mv /tmp/profile-migrations/20260922173000_platform_push_subscription server/prisma/migrations/
          mv /tmp/profile-migrations/20260922213000_demo_starts_at_profile_open server/prisma/migrations/
          mv /tmp/profile-migrations/20260930143000_remove_first_run_runtime server/prisma/migrations/
          (
            cd server
            DATABASE_URL='postgresql://book:book_staging_local@localhost:54329/book_staging?schema=public' npx prisma migrate deploy
          )
      - name: Verify migrated PROFILE ownership and runtime schema
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.staging.yml exec -T db psql -U book -d book_staging <<'SQL'
          DO $profile_upgrade$
          BEGIN
            IF (SELECT COUNT(*) FROM "Profile" WHERE "id" = 'upgrade-profile') <> 1 THEN
              RAISE EXCEPTION 'OWNER Profile was removed';
            END IF;
            IF (SELECT COUNT(*) FROM "WorkspaceState" WHERE "id" = 'upgrade-workspace') <> 1 THEN
              RAISE EXCEPTION 'OWNER WorkspaceState was removed';
            END IF;
            IF (SELECT COUNT(*) FROM "TenantAccess" WHERE "tenantId" = 'upgrade-tenant' AND "isOwnerBook" = true) <> 1 THEN
              RAISE EXCEPTION 'OWNER TenantAccess was not preserved';
            END IF;

            IF (SELECT COUNT(*) FROM "Tenant" WHERE "id" IN ('incoming-profile-tenant','dirty-live-tenant')) <> 0 THEN
              RAISE EXCEPTION 'Unapproved test Tenant remains';
            END IF;
            IF (SELECT COUNT(*) FROM "PlatformAccount" WHERE "id" IN ('incoming-profile-account','dirty-live-account')) <> 0 THEN
              RAISE EXCEPTION 'Unapproved test PlatformAccount remains';
            END IF;
            IF (SELECT COUNT(*) FROM "Profile" WHERE "id" IN ('incoming-profile-profile','dirty-live-profile')) <> 0 THEN
              RAISE EXCEPTION 'Unapproved test Profile remains';
            END IF;
            IF (SELECT COUNT(*) FROM "WorkspaceState" WHERE "id" IN ('incoming-profile-workspace','dirty-live-workspace')) <> 0 THEN
              RAISE EXCEPTION 'Unapproved test WorkspaceState remains';
            END IF;

            IF (SELECT COUNT(*) FROM "Tenant" WHERE "id" = 'approved-live-tenant') <> 1 THEN
              RAISE EXCEPTION 'Approved LIVE Tenant was removed';
            END IF;
            IF (SELECT COUNT(*) FROM "PlatformAccount" WHERE "id" = 'approved-live-account') <> 1 THEN
              RAISE EXCEPTION 'Approved LIVE PlatformAccount was removed';
            END IF;
            IF (SELECT COUNT(*) FROM "Profile" WHERE "id" = 'approved-live-profile') <> 1 THEN
              RAISE EXCEPTION 'Approved LIVE Profile was removed';
            END IF;
            IF (SELECT COUNT(*) FROM "WorkspaceState" WHERE "id" = 'approved-live-workspace') <> 1 THEN
              RAISE EXCEPTION 'Approved LIVE WorkspaceState was removed';
            END IF;
            IF (
              SELECT COUNT(*)
              FROM "TenantAccess"
              WHERE "tenantId" = 'approved-live-tenant'
                AND "isOwnerBook" = false
                AND "commercialMode" = 'LIVE'
                AND "liveRequestedAt" IS NOT NULL
                AND "liveRequestedByPlatformAccountId" = 'approved-live-account'
                AND "liveApprovedAt" IS NOT NULL
                AND "liveApprovedByAdminId" = 'upgrade-admin'
            ) <> 1 THEN
              RAISE EXCEPTION 'Approved LIVE proof was not preserved';
            END IF;

            IF (SELECT COUNT(*) FROM "TenantAccess" WHERE "isOwnerBook" = false) <> 1 THEN
              RAISE EXCEPTION 'Unexpected non-owner profiles remain after purge';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM pg_trigger WHERE tgname = 'PlatformConsentEvent_append_only' AND NOT tgisinternal
            ) THEN
              RAISE EXCEPTION 'PlatformConsentEvent append-only protection is missing';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_trigger WHERE tgname = 'PlatformActivityEvent_append_only' AND NOT tgisinternal
            ) THEN
              RAISE EXCEPTION 'PlatformActivityEvent append-only protection is missing';
            END IF;
          END
          $profile_purge$;
          SQL
      - name: Stop isolated database
        if: always()
        run: docker compose -f docker-compose.staging.yml down -v

  global-account-clean-reset:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install server dependencies
        run: npm install --prefix server
      - name: Generate Prisma client
        run: npm run prisma:generate --prefix server
      - name: Start isolated database
        run: |
          docker compose -f docker-compose.staging.yml up -d db
          for attempt in $(seq 1 30); do
            if docker compose -f docker-compose.staging.yml exec -T db pg_isready -U book -d book_staging >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.staging.yml logs db
          exit 1
      - name: Apply pre-global Account migration chain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/global-account-migrations
          mv server/prisma/migrations/20260921130000_global_account_identity /tmp/global-account-migrations/
          mv server/prisma/migrations/20260921143000_account_terms /tmp/global-account-migrations/
          mv server/prisma/migrations/20260925170000_global_account_tenant_link /tmp/global-account-migrations/
          (
            cd server
            DATABASE_URL='postgresql://book:book_staging_local@localhost:54329/book_staging?schema=public' npx prisma migrate deploy
          )
      - name: Seed test end-person values and preserved data
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.staging.yml exec -T db psql -U book -d book_staging -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO "Tenant" ("id","name","updatedAt")
          VALUES
            ('reset-tenant-a','Reset Tenant A',CURRENT_TIMESTAMP),
            ('reset-tenant-b','Reset Tenant B',CURRENT_TIMESTAMP);

          INSERT INTO "Account" (
            "id","tenantId","email","passwordHash","name","surname","phone","telegramId",
            "profileData","discountPercent","visits","totalSpent","lastVisit","programs","createdAt","updatedAt"
          )
          VALUES
            (
              'reset-account-a','reset-tenant-a','same@example.invalid','hash-a','A','','+79990000001','7770001',
              '{}'::jsonb,0,0,0,'','[]'::jsonb,CURRENT_TIMESTAMP,CURRENT_TIMESTAMP
            ),
            (
              'reset-account-b','reset-tenant-b','same@example.invalid','hash-b','B','','+79990000001','7770001',
              '{}'::jsonb,0,0,0,'','[]'::jsonb,CURRENT_TIMESTAMP,CURRENT_TIMESTAMP
            );

          INSERT INTO "BookingRequest" (
            "id","tenantId","accountId","workplaceKey","date","from","to","procedures","updatedAt"
          )
          VALUES (
            'reset-request','reset-tenant-a','reset-account-a','reset-workplace',
            '2026-09-21','10:00','11:00','[]'::jsonb,CURRENT_TIMESTAMP
          );

          INSERT INTO "Person" (
            "id","tenantId","key","position","data","updatedAt"
          )
          VALUES (
            'reset-person-row','reset-tenant-a','reset-person',0,
            '{"key":"reset-person","name":"Keep Person","phones":["+79990000001"],"emails":["same@example.invalid"],"accounts":["reset-account-a"],"tags":["keep-me"]}'::jsonb,
            CURRENT_TIMESTAMP
          );

          INSERT INTO "UeiState" ("id","tenantId","data","updatedAt")
          VALUES (
            'reset-uei-row','reset-tenant-a',
            '{"entities":{"uei-reset":{"members":["person:reset-person"],"owner":{"type":"person","id":"reset-person"}}},"relations":{"person:reset-person":"uei-reset"}}'::jsonb,
            CURRENT_TIMESTAMP
          );

          INSERT INTO "TenantDocumentArchive" ("id","tenantId","data","updatedAt")
          VALUES (
            'reset-doc-row','reset-tenant-a',
            '{"documents":[{"id":"keep-document","title":"Keep document","version":1}]}'::jsonb,
            CURRENT_TIMESTAMP
          );

          INSERT INTO "TenantConsentEvent" (
            "id","tenantId","subjectType","subjectKey","contactType","contactValue",
            "documentId","documentVersion","status","acceptedAt","revokedAt","source",
            "occurredAt","createdAt"
          )
          VALUES (
            'reset-consent','reset-tenant-a','ACCOUNT','reset-account-a','','',
            'pdn-consent',1,'accepted',CURRENT_TIMESTAMP,NULL,'test',
            CURRENT_TIMESTAMP,CURRENT_TIMESTAMP
          );

          INSERT INTO "_prisma_migrations" (
            "id","checksum","finished_at","migration_name","logs","rolled_back_at","started_at","applied_steps_count"
          )
          VALUES (
            '11111111-1111-4111-8111-111111111111',
            'simulated-checksum',
            NULL,
            '20260921130000_global_account_identity',
            'simulated production P3009 state',
            NULL,
            CURRENT_TIMESTAMP,
            0
          );
          SQL
      - name: Run guarded test Account reset
        shell: bash
        run: |
          set -uo pipefail
          cd server
          set +e
          DATABASE_URL='postgresql://book:book_staging_local@localhost:54329/book_staging?schema=public' node scripts/reset-test-account-before-global-migration.mjs
          reset_status=$?
          set -e
          if [ "$reset_status" -ne 42 ]; then
            echo "Expected reset preflight exit 42, got $reset_status"
            exit 1
          fi
          DATABASE_URL='postgresql://book:book_staging_local@localhost:54329/book_staging?schema=public' npx prisma migrate resolve --rolled-back 20260921130000_global_account_identity
      - name: Verify only test Account values were cleared
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.staging.yml exec -T db psql -U book -d book_staging -v ON_ERROR_STOP=1 <<'SQL'
          DO $reset_check$
          BEGIN
            IF (SELECT COUNT(*) FROM "Account") <> 0 THEN
              RAISE EXCEPTION 'Test Account rows remain';
            END IF;
            IF (SELECT COUNT(*) FROM "BookingRequest") <> 0 THEN
              RAISE EXCEPTION 'Test BookingRequest rows remain';
            END IF;
            IF (SELECT COUNT(*) FROM "TenantConsentEvent" WHERE "subjectType" IN ('ACCOUNT','BOOKING_ACCOUNT','CONTACT_POINT')) <> 0 THEN
              RAISE EXCEPTION 'Test end-person consent rows remain';
            END IF;
            IF (SELECT COUNT(*) FROM "Person" WHERE "id" = 'reset-person-row') <> 1 THEN
              RAISE EXCEPTION 'Person was deleted';
            END IF;
            IF (SELECT "data"->>'name' FROM "Person" WHERE "id" = 'reset-person-row') <> 'Keep Person' THEN
              RAISE EXCEPTION 'Person data was changed';
            END IF;
            IF (SELECT "data"->'phones' FROM "Person" WHERE "id" = 'reset-person-row') <> '["+79990000001"]'::jsonb THEN
              RAISE EXCEPTION 'Person contacts were changed';
            END IF;
            IF (SELECT "data"->'tags' FROM "Person" WHERE "id" = 'reset-person-row') <> '["keep-me"]'::jsonb THEN
              RAISE EXCEPTION 'Person business data was changed';
            END IF;
            IF (SELECT "data"->'accounts' FROM "Person" WHERE "id" = 'reset-person-row') <> '[]'::jsonb THEN
              RAISE EXCEPTION 'Stale Person Account links remain';
            END IF;
            IF (SELECT COUNT(*) FROM "UeiState" WHERE "id" = 'reset-uei-row') <> 1 THEN
              RAISE EXCEPTION 'UEI was deleted';
            END IF;
            IF (SELECT COUNT(*) FROM "TenantDocumentArchive" WHERE "id" = 'reset-doc-row') <> 1 THEN
              RAISE EXCEPTION 'Document archive was deleted';
            END IF;
            IF (SELECT "data"->'documents'->0->>'id' FROM "TenantDocumentArchive" WHERE "id" = 'reset-doc-row') <> 'keep-document' THEN
              RAISE EXCEPTION 'Document content was changed';
            END IF;
          END
          $reset_check$;
          SQL
      - name: Restore and apply global Account migrations
        shell: bash
        run: |
          set -euo pipefail
          mv /tmp/global-account-migrations/20260921130000_global_account_identity server/prisma/migrations/
          mv /tmp/global-account-migrations/20260921143000_account_terms server/prisma/migrations/
          mv /tmp/global-account-migrations/20260925170000_global_account_tenant_link server/prisma/migrations/
          (
            cd server
            DATABASE_URL='postgresql://book:book_staging_local@localhost:54329/book_staging?schema=public' npx prisma migrate deploy
          )
      - name: Verify reset schema is migration-valid
        shell: bash
        run: |
          set -euo pipefail
          cd server
          export DATABASE_URL='postgresql://book:book_staging_local@localhost:54329/book_staging?schema=public'
          npx prisma migrate status
      - name: Stop isolated database
        if: always()
        run: docker compose -f docker-compose.staging.yml down -v

  prelaunch-failed-migration-recovery:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install server dependencies
        run: npm install --prefix server
      - name: Generate Prisma client
        run: npm run prisma:generate --prefix server
      - name: Start isolated database
        run: |
          docker compose -f docker-compose.staging.yml up -d db
          for attempt in $(seq 1 30); do
            if docker compose -f docker-compose.staging.yml exec -T db pg_isready -U book -d book_staging >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.staging.yml logs db
          exit 1
      - name: Apply migrations before prelaunch cleanup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/prelaunch-recovery-migrations
          mv server/prisma/migrations/20260922075500_prelaunch_hard_delete_clean_start /tmp/prelaunch-recovery-migrations/
          mv server/prisma/migrations/20260922081000_purge_non_owner_profiles /tmp/prelaunch-recovery-migrations/
          mv server/prisma/migrations/20260922094500_purge_unapproved_legacy_live /tmp/prelaunch-recovery-migrations/
          (
            cd server
            DATABASE_URL='postgresql://book:book_staging_local@localhost:54329/book_staging?schema=public' npx prisma migrate deploy
          )
      - name: Simulate production P3009 row
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.staging.yml exec -T db psql -U book -d book_staging -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO "_prisma_migrations" (
            "id","checksum","finished_at","migration_name","logs","rolled_back_at","started_at","applied_steps_count"
          )
          VALUES (
            '22222222-2222-4222-8222-222222222222',
            'simulated-failed-prelaunch-checksum',
            NULL,
            '20260922075500_prelaunch_hard_delete_clean_start',
            NULL,
            NULL,
            CURRENT_TIMESTAMP,
            0
          );
          SQL
      - name: Verify guarded recovery and resolve failed 07:55
        shell: bash
        run: |
          set -uo pipefail
          cd server
          set +e
          DATABASE_URL='postgresql://book:book_staging_local@localhost:54329/book_staging?schema=public' node scripts/recover-failed-prelaunch-migration.mjs
          recovery_status=$?
          set -e
          if [ "$recovery_status" -ne 42 ]; then
            echo "Expected guarded recovery exit 42, got $recovery_status"
            exit 1
          fi
          DATABASE_URL='postgresql://book:book_staging_local@localhost:54329/book_staging?schema=public' npx prisma migrate resolve --rolled-back 20260922075500_prelaunch_hard_delete_clean_start
      - name: Restore and retry corrected migrations
        shell: bash
        run: |
          set -euo pipefail
          mv /tmp/prelaunch-recovery-migrations/20260922075500_prelaunch_hard_delete_clean_start server/prisma/migrations/
          mv /tmp/prelaunch-recovery-migrations/20260922081000_purge_non_owner_profiles server/prisma/migrations/
          mv /tmp/prelaunch-recovery-migrations/20260922094500_purge_unapproved_legacy_live server/prisma/migrations/
          (
            cd server
            DATABASE_URL='postgresql://book:book_staging_local@localhost:54329/book_staging?schema=public' npx prisma migrate deploy
          )
      - name: Verify recovered migration state
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.staging.yml exec -T db psql -U book -d book_staging -v ON_ERROR_STOP=1 <<'SQL'
          DO $recovery_check$
          BEGIN
            IF (
              SELECT COUNT(*)
              FROM "_prisma_migrations"
              WHERE "id" = '22222222-2222-4222-8222-222222222222'
                AND "rolled_back_at" IS NOT NULL
            ) <> 1 THEN
              RAISE EXCEPTION 'Failed 07:55 row was not marked rolled back';
            END IF;

            IF (
              SELECT COUNT(*)
              FROM "_prisma_migrations"
              WHERE "migration_name" = '20260922075500_prelaunch_hard_delete_clean_start'
                AND "finished_at" IS NOT NULL
                AND "rolled_back_at" IS NULL
            ) <> 1 THEN
              RAISE EXCEPTION 'Corrected 07:55 was not applied successfully';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema = 'public'
                AND table_name = 'TenantAccess'
                AND column_name = 'liveApprovedAt'
            ) THEN
              RAISE EXCEPTION 'LIVE approval schema was not applied';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM pg_trigger
              WHERE tgname = 'PlatformConsentEvent_append_only'
                AND NOT tgisinternal
            ) THEN
              RAISE EXCEPTION 'PlatformConsentEvent append-only trigger was lost';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM pg_trigger
              WHERE tgname = 'PlatformActivityEvent_append_only'
                AND NOT tgisinternal
            ) THEN
              RAISE EXCEPTION 'PlatformActivityEvent append-only trigger was lost';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM pg_constraint
              WHERE conname = 'WorkspaceState_tenantId_fkey'
            ) THEN
              RAISE EXCEPTION 'WorkspaceState tenant FK missing after recovery';
            END IF;

            IF EXISTS (
              SELECT 1 FROM pg_constraint
              WHERE conname IN (
                'PlatformConsentEvent_tenantId_fkey',
                'PlatformConsentEvent_platformAccountId_fkey'
              )
            ) THEN
              RAISE EXCEPTION 'Unsafe PlatformConsentEvent cascade FK returned';
            END IF;
          END
          $recovery_check$;
          SQL
      - name: Stop isolated database
        if: always()
        run: docker compose -f docker-compose.staging.yml down -v

  staging-smoke:
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main' || github.base_ref == 'staging' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build staging backend image
        run: docker compose -f docker-compose.staging.yml build backend
      - name: Start isolated database and backend
        run: |
          docker compose -f docker-compose.staging.yml up -d db
          docker compose -f docker-compose.staging.yml up -d backend
      - name: Verify staging backend
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:3000/health >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.staging.yml logs db backend
          exit 1
      - name: Verify centralized data transfer with PostgreSQL
        run: docker compose -f docker-compose.staging.yml exec -T backend node scripts/check-data-transfer.mjs
      - name: Verify all four production domains
        shell: bash
        run: |
          set -euo pipefail

          expect_status() {
            local host="$1"
            local path="$2"
            local expected="$3"
            local actual
            actual=$(curl -sS -o /tmp/domain-response -w '%{http_code}' -H "Host: $host" "http://localhost:3000$path")
            if [ "$actual" != "$expected" ]; then
              echo "$host$path: expected HTTP $expected, got $actual"
              cat /tmp/domain-response || true
              docker compose -f docker-compose.staging.yml logs backend
              exit 1
            fi
          }

          expect_contains() {
            local host="$1"
            local path="$2"
            local needle="$3"
            local body_file
            body_file=$(mktemp)
            if ! curl -fsS -H "Host: $host" "http://localhost:3000$path" -o "$body_file"; then
              echo "$host$path: request failed"
              docker compose -f docker-compose.staging.yml logs backend
              rm -f "$body_file"
              exit 1
            fi
            if ! grep -Fq "$needle" "$body_file"; then
              echo "$host$path: response does not contain expected marker: $needle"
              cat "$body_file" || true
              docker compose -f docker-compose.staging.yml logs backend
              rm -f "$body_file"
              exit 1
            fi
            rm -f "$body_file"
          }

          expect_contains "app.va-tools.ru" "/" "id=\"app\""
          expect_contains "user.va-tools.ru" "/" "id=\"booking-root\""
          expect_status "api.va-tools.ru" "/health" "200"
          expect_contains "admin.va-tools.ru" "/" "id=\"admin-app\""
      - name: Start and verify staging frontend
        run: |
          docker compose -f docker-compose.staging.yml up -d frontend
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:4173 >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.staging.yml logs frontend
          exit 1
      - name: Stop isolated staging
        if: always()
        run: docker compose -f docker-compose.staging.yml down -v
