name: Apply retired Account root tail cleanup

on:
  push:
    branches: [staging]

permissions:
  contents: write

concurrency:
  group: apply-account-retired-root-tail-staging
  cancel-in-progress: false

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'Bootstrap retired Account root tail cleanup')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Apply retired Account root tail cleanup
        run: python3 scripts/apply-account-retired-root-tail.py

      - name: Validate diff
        run: git diff --check

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI Executor"
          git config user.email "actions@users.noreply.github.com"
          git add online-booking/booking.js scripts/check-booking-account-architecture.mjs
          git diff --cached --check
          git commit -m "Remove retired Account root tails"
          git push origin HEAD:staging
