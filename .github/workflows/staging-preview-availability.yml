name: Staging Preview Availability

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/staging-preview-availability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Resolve preview hostname
        shell: bash
        run: |
          set -euo pipefail
          getent ahostsv4 va-app-volokovykh.msk1.amvera.tech | head -n 3
      - name: Probe deployed backend and preview assets
        shell: bash
        run: |
          set -euo pipefail
          base='https://va-app-volokovykh.msk1.amvera.tech'
          for path in /health /admin/ /admin/admin.js /ui/v2/v2.css; do
            echo "== Checking ${path} =="
            code=$(curl -sSL --connect-timeout 8 --max-time 20 -D /tmp/preview-headers -o /tmp/preview-body -w '%{http_code}' "${base}${path}") || {
              echo "Request failed: ${path}"
              exit 1
            }
            echo "HTTP ${code}"
            grep -Ei '^(content-type|x-co-va-preview|location):' /tmp/preview-headers || true
            if [ "${code}" != "200" ]; then
              head -c 250 /tmp/preview-body || true
              exit 1
            fi
            if [ "${path}" != "/health" ]; then
              grep -Eiq '^x-co-va-preview: staging' /tmp/preview-headers || {
                echo "Preview header missing: wrong host or gateway not activated"
                exit 1
              }
            fi
          done
      - name: Render preview as a mobile browser
        shell: bash
        run: |
          set -euo pipefail
          chrome_bin=""
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              chrome_bin="$(command -v "$candidate")"
              break
            fi
          done
          if [ -z "$chrome_bin" ]; then
            echo 'No browser on runner'
            exit 1
          fi
          timeout --signal=TERM --kill-after=5s 65s "$chrome_bin" \
            --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --window-size=390,844 --force-device-scale-factor=1 \
            --touch-events=enabled --virtual-time-budget=18000 \
            --dump-dom 'https://va-app-volokovykh.msk1.amvera.tech/admin/' \
            >/tmp/admin-mobile-preview-dom.html 2>/tmp/admin-mobile-preview-browser.log || {
              echo 'Remote mobile render timed out or browser failed'
              tail -n 30 /tmp/admin-mobile-preview-browser.log || true
              exit 1
            }
          if ! grep -Eq 'class="[^"]*(admin-auth-screen|admin-mobile-app)' /tmp/admin-mobile-preview-dom.html; then
            echo 'Preview did not render admin login or authenticated mobile shell'
            grep -o '.\{0,120\}admin-app.\{0,300\}' /tmp/admin-mobile-preview-dom.html | head -n 2 || true
            tail -n 25 /tmp/admin-mobile-preview-browser.log || true
            exit 1
          fi
          echo 'Staging preview mobile DOM: PASS'
