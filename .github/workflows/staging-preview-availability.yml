name: Staging Preview Availability

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/staging-preview-availability.yml'
      - 'admin/**'
      - 'ui/**'
      - 'server/src/staging-preview.ts'
      - 'tests/staging-preview.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout gateway contract
        uses: actions/checkout@v4
      - name: Setup Node for gateway contract
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify read-only preview cache and gateway contract
        run: node tests/staging-preview.test.mjs
      - name: Resolve preview hostname
        shell: bash
        run: |
          set -euo pipefail
          getent ahostsv4 va-app-volokovykh.msk1.amvera.tech | head -n 3
      - name: Probe deployed backend and preview assets
        shell: bash
        run: |
          set -euo pipefail
          base='https://va-app-volokovykh.msk1.amvera.tech'
          for path in /health /admin/ /admin/admin.js /ui/v2/v2.css; do
            echo "== Checking ${path} =="
            code=$(curl -sSL --connect-timeout 8 --max-time 20 -D /tmp/preview-headers -o /tmp/preview-body -w '%{http_code}' "${base}${path}") || {
              echo "Request failed: ${path}"
              exit 1
            }
            echo "HTTP ${code}"
            grep -Ei '^(content-type|x-co-va-preview|location):' /tmp/preview-headers || true
            if [ "${code}" != "200" ]; then
              head -c 250 /tmp/preview-body || true
              exit 1
            fi
            if [ "${path}" != "/health" ]; then
              grep -Eiq '^x-co-va-preview: staging' /tmp/preview-headers || {
                echo "Preview header missing: wrong host or gateway not activated"
                exit 1
              }
            fi
          done
      - name: Verify production gateway serves latest single-request staging HTML
        shell: bash
        run: |
          set -euo pipefail
          curl -fSL --connect-timeout 8 --max-time 25 \
            'https://va-app-volokovykh.msk1.amvera.tech/admin/?single-request-probe=1' \
            -o /tmp/preview-served.html
          grep -q 'data-preview-style' /tmp/preview-served.html || {
            echo 'Gateway still serves multi-request Admin HTML'
            exit 1
          }
          grep -q 'data-preview-module="admin.js"' /tmp/preview-served.html || exit 1
          grep -q 'data-preview-module="commercial-tenant.js"' /tmp/preview-served.html || exit 1
          echo "Gateway served inlined admin HTML: $(wc -c </tmp/preview-served.html) bytes"
      - name: Diagnose preview DNS and repeated navigation latency
        shell: bash
        run: |
          set -euo pipefail
          host='va-app-volokovykh.msk1.amvera.tech'
          echo 'IPv4 address records:'
          getent ahostsv4 "$host" | awk '{print $1}' | sort -u
          echo 'IPv6 address records (empty means none or not resolved on runner):'
          getent ahostsv6 "$host" | awk '{print $1}' | sort -u || true
          echo 'Five fresh HTML navigation requests (sequential):'
          for i in 1 2 3 4 5; do
            curl -4 -sSL --connect-timeout 8 --max-time 20 -o /dev/null \
              -w 'request='"${i}"' status=%{http_code} ip=%{remote_ip} connect=%{time_connect}s ttfb=%{time_starttransfer}s total=%{time_total}s\\n' \
              "https://${host}/admin/?diagnostic=${i}" || exit 1
          done
      - name: Render preview as a mobile browser
        shell: bash
        run: |
          set -euo pipefail
          chrome_bin=""
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              chrome_bin="$(command -v "$candidate")"
              break
            fi
          done
          if [ -z "$chrome_bin" ]; then
            echo 'No browser on runner'
            exit 1
          fi
          started_at=$SECONDS
          timeout --signal=TERM --kill-after=5s 65s "$chrome_bin" \
            --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --window-size=390,844 --force-device-scale-factor=1 \
            --touch-events=enabled --virtual-time-budget=18000 \
            --dump-dom 'https://va-app-volokovykh.msk1.amvera.tech/admin/' \
            >/tmp/admin-mobile-preview-dom.html 2>/tmp/admin-mobile-preview-browser.log || {
              echo 'Remote mobile render timed out or browser failed'
              tail -n 30 /tmp/admin-mobile-preview-browser.log || true
              exit 1
            }
          if ! grep -Eq 'class="[^"]*(admin-auth-screen|admin-mobile-app)' /tmp/admin-mobile-preview-dom.html; then
            echo 'Preview did not render admin login or authenticated mobile shell'
            grep -o '.\{0,120\}admin-app.\{0,300\}' /tmp/admin-mobile-preview-dom.html | head -n 2 || true
            tail -n 25 /tmp/admin-mobile-preview-browser.log || true
            exit 1
          fi
          echo "Mobile preview browser elapsed: $((SECONDS - started_at))s"
          echo 'Staging preview mobile DOM: PASS'
