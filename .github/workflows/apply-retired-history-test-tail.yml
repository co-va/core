name: Apply retired History regression tail cleanup

on:
  push:
    branches: [staging]

permissions:
  contents: write

concurrency:
  group: apply-retired-history-test-tail-staging
  cancel-in-progress: false

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'Bootstrap retired History regression tail cleanup')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Update retired History regression tail
        run: python3 scripts/apply-retired-history-test-tail.py

      - name: Validate diff
        run: git diff --check

      - name: Commit regression tail update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI Executor"
          git config user.email "actions@users.noreply.github.com"
          git add tests/booking-account-ui.test.mjs
          git diff --cached --check
          git commit -m "Remove retired History regression tail"
          git push origin HEAD:staging
