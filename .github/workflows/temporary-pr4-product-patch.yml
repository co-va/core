name: Temporary PR4 product patch

on:
  push:
    branches: [staging]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - name: Apply PR4 product patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new, label):
              file = Path(path)
              text = file.read_text()
              if new in text:
                  print(label, 'already applied')
                  return
              if old not in text:
                  raise SystemExit(f'{label}: target not found in {path}')
              file.write_text(text.replace(old, new, 1))
              print(label, 'applied')

          replace_once(
              'online-booking/access.js',
              """    onCreated: () => {
      if (!exitBookingContext(state, { tab: 'contact-detail', tenantId: state.tenantId })) {
        document.querySelector('#app')?.replaceChildren();
        openNotice({ title: 'Запись создана', message: 'Запись отправлена специалисту.' });
      }
    },""",
              """    onCreated: (record) => {
      if (!exitBookingContext(state, {
        tab: 'journal',
        journalDate: String(record?.date || ''),
      })) {
        document.querySelector('#app')?.replaceChildren();
        openNotice({ title: 'Запись создана', message: 'Запись отправлена специалисту.' });
      }
    },""",
              'access success return',
          )

          replace_once(
              'online-booking/booking.js',
              "function globalAccountState(initial = {}) {\n  return {",
              "function globalAccountState(initial = {}) {\n  const journalDate = String(initial.journalDate || '').trim();\n  return {",
              'account journal date input',
          )
          replace_once(
              'online-booking/booking.js',
              "    accountRecords: [],\n    error: '',\n    accountTab: String(initial.tab || 'journal'),",
              "    accountRecords: [],\n    error: '',\n    accountJournalDate: /^\\d{4}-\\d{2}-\\d{2}$/.test(journalDate) ? new Date(`${journalDate}T12:00:00`) : null,\n    accountTab: String(initial.tab || 'journal'),",
              'account journal date state',
          )

          booking = Path('online-booking/booking.js')
          text = booking.read_text()
          pattern = re.compile(
              r"(state\.notice = 'Запись отправлена в журнал\.';\n\s*state\.error = '';\n\s*await refreshContext\(state\);\n)\s*exitBookingContext\(state, \{ tab: 'contact-detail', tenantId: state\.tenantId \}\);"
          )
          replacement = (
              r"\1    exitBookingContext(state, {\n"
              r"      tab: 'journal',\n"
              r"      journalDate: String(state.date || ''),\n"
              r"    });"
          )
          if "journalDate: String(state.date || '')" not in text:
              text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit('legacy booking success return: target not found')
              booking.write_text(text)
              print('legacy booking success return applied')

          replace_once(
              'online-booking/account-shell.js',
              "      context: 'account',\n      records: () => Array.isArray(state.accountRecords) ? state.accountRecords : [],",
              "      context: 'account',\n      initialDate: state.accountJournalDate instanceof Date ? state.accountJournalDate : undefined,\n      records: () => Array.isArray(state.accountRecords) ? state.accountRecords : [],",
              'journal success date',
          )
          PY
      - name: Commit product patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add online-booking/access.js online-booking/booking.js online-booking/account-shell.js
          git commit -m "Return successful booking to Account Journal"
          git push origin HEAD:staging
