name: Temporary PR4 Product Patch

on:
  push:
    branches:
      - staging

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - name: Patch and commit
        env:
          PATCH_B64: 
        run: |
          echo "$PATCH_B64" | base64 -d > /tmp/pr4-patch.py
          python3 /tmp/pr4-patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add online-booking/access.js online-booking/booking.js online-booking/account-shell.js
          git commit -m "Return successful booking to Account Journal"
          git push origin HEAD:staging
