name: Temporary PR4 patch

on:
  push:
    branches: [staging]

permissions:
  contents: write

concurrency:
  group: temporary-pr4-patch
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - name: Apply minimal PR4 patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          def patch(path, old, new):
              file = Path(path)
              text = file.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"Expected patch target not found in {path}")
              file.write_text(text.replace(old, new, 1))

          patch(
              "online-booking/access.js",
              """    onCreated: () => {
                if (!exitBookingContext(state, { tab: 'contact-detail', tenantId: state.tenantId })) {
                  document.querySelector('#app')?.replaceChildren();
                  openNotice({ title: 'Запись создана', message: 'Запись отправлена специалисту.' });
                }
              },""",
              """    onCreated: (record) => {
                if (!exitBookingContext(state, {
                  tab: 'journal',
                  journalDate: String(record?.date || ''),
                })) {
                  document.querySelector('#app')?.replaceChildren();
                  openNotice({ title: 'Запись создана', message: 'Запись отправлена специалисту.' });
                }
              },""",
          )

          patch(
              "online-booking/booking.js",
              """function globalAccountState(initial = {}) {
            return {""",
              """function globalAccountState(initial = {}) {
            const journalDate = String(initial.journalDate || '').trim();
            return {""",
          )

          patch(
              "online-booking/booking.js",
              """    accountRecords: [],
              error: '',
              accountTab: String(initial.tab || 'journal'),""",
              """    accountRecords: [],
              error: '',
              accountJournalDate: /^\\d{4}-\\d{2}-\\d{2}$/.test(journalDate) ? new Date(`${journalDate}T12:00:00`) : null,
              accountTab: String(initial.tab || 'journal'),""",
          )

          patch(
              "online-booking/booking.js",
              """    await refreshContext(state);
              exitBookingContext(state, { tab: 'contact-detail', tenantId: state.tenantId });
            } catch (error) {""",
              """    await refreshContext(state);
              exitBookingContext(state, {
                tab: 'journal',
                journalDate: String(state.date || ''),
              });
            } catch (error) {""",
          )

          patch(
              "online-booking/account-shell.js",
              """    root.accountJournalDispose = renderJournal(journalRoot, {
              context: 'account',
              records: () => Array.isArray(state.accountRecords) ? state.accountRecords : [],
              resolveRecordContext: (record) => {""",
              """    root.accountJournalDispose = renderJournal(journalRoot, {
              context: 'account',
              initialDate: state.accountJournalDate instanceof Date ? state.accountJournalDate : undefined,
              records: () => Array.isArray(state.accountRecords) ? state.accountRecords : [],
              resolveRecordContext: (record) => {""",
          )

          workflow = Path(".github/workflows/record-view-account-runtime.yml")
          workflow_text = workflow.read_text()
          workflow_old = """          run_browser_case \\
            "tests/journal-account-runtime-browser.html" \\
            'data-journal-account-runtime="pass"' \\
            'data-journal-account-runtime-stage' \\
            /tmp/journal-account-runtime-dom.html
          """
          workflow_new = workflow_old + """          run_browser_case \\
            "tests/booking-success-journal-runtime-browser.html" \\
            'data-booking-success-journal-runtime="pass"' \\
            'data-booking-success-journal-runtime-stage' \\
            /tmp/booking-success-journal-runtime-dom.html
          """
          if workflow_new not in workflow_text:
              if workflow_old not in workflow_text:
                  raise SystemExit("Focused runtime workflow target not found")
              workflow.write_text(workflow_text.replace(workflow_old, workflow_new, 1))

          runtime_path = Path("tests/booking-success-journal-runtime-browser.html")
          runtime_content = base64.b64decode("").decode()
          if not runtime_path.exists() or runtime_path.read_text() != runtime_content:
              runtime_path.write_text(runtime_content)
          PY
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add online-booking/access.js online-booking/booking.js online-booking/account-shell.js tests/booking-success-journal-runtime-browser.html .github/workflows/record-view-account-runtime.yml
          git commit -m "Return successful booking to Account Journal"
          git push origin HEAD:staging
