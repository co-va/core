name: Event migration verification

on:
  push:
    branches: [staging]
    paths: ['.github/workflows/event-migration-check.yml']

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: event_migration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d event_migration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/event_migration?schema=public
      PGURL: postgresql://postgres:postgres@localhost:5432/event_migration
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install server dependencies
        run: npm install --prefix server

      - name: Validate Prisma schema
        run: npx --prefix server prisma validate --schema server/prisma/schema.prisma

      - name: Apply migration chain before Event
        shell: bash
        run: |
          set -euo pipefail
          mv server/prisma/migrations/20261022180000_canonical_event /tmp/20261022180000_canonical_event
          npm run prisma:deploy --prefix server

      - name: Seed legacy Break rows
        shell: bash
        run: |
          set -euo pipefail
          psql "$PGURL" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO "Tenant" ("id", "name", "updatedAt")
          VALUES ('tenant-event-migration', 'Event migration', CURRENT_TIMESTAMP);

          INSERT INTO "BusinessOperationalState" ("id", "tenantId", "data", "updatedAt")
          VALUES (
            'ops-event-migration',
            'tenant-event-migration',
            '{"breaks":[{"id":"legacy-break-1","date":"2026-10-22","workplaceId":"studio","from":"12:00","to":"13:00","createdAt":"2026-10-20T10:00:00.000Z"},{"date":"2026-10-23","workplaceId":"studio","from":"14:00","to":"14:30"}]}'::jsonb,
            CURRENT_TIMESTAMP
          );
          SQL

      - name: Apply Event migration
        shell: bash
        run: |
          set -euo pipefail
          mv /tmp/20261022180000_canonical_event server/prisma/migrations/20261022180000_canonical_event
          npm run prisma:deploy --prefix server

      - name: Verify migrated Events and legacy cleanup
        shell: bash
        run: |
          set -euo pipefail
          psql "$PGURL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $verify$
          BEGIN
            IF (SELECT COUNT(*) FROM "Event" WHERE "tenantId" = 'tenant-event-migration') <> 2 THEN
              RAISE EXCEPTION 'expected exactly two migrated Events';
            END IF;
            IF (SELECT COUNT(*) FROM "Event" WHERE "id" = 'legacy-break-1' AND "tenantId" = 'tenant-event-migration' AND "title" = 'Перерыв' AND "date" = '2026-10-22' AND "from" = '12:00' AND "to" = '13:00' AND "workplaceId" = 'studio') <> 1 THEN
              RAISE EXCEPTION 'legacy Break id/fields were not preserved';
            END IF;
            IF EXISTS (SELECT 1 FROM "BusinessOperationalState" WHERE "tenantId" = 'tenant-event-migration' AND "data" ? 'breaks') THEN
              RAISE EXCEPTION 'legacy breaks remained after successful migration';
            END IF;
            IF (SELECT COALESCE(("data"->'migrationVersions'->>'eventFromBreakV1')::int, 0) FROM "BusinessOperationalState" WHERE "tenantId" = 'tenant-event-migration') <> 1 THEN
              RAISE EXCEPTION 'Event migration marker missing';
            END IF;
          END
          $verify$;
          SQL

      - name: Verify migration is idempotent
        shell: bash
        run: |
          set -euo pipefail
          psql "$PGURL" -v ON_ERROR_STOP=1 -f server/prisma/migrations/20261022180000_canonical_event/migration.sql
          count="$(psql "$PGURL" -Atqc 'SELECT COUNT(*) FROM "Event" WHERE "tenantId" = '\''tenant-event-migration'\'';')"
          test "$count" = "2"

      - name: Verify failed Event migration preserves source Break
        shell: bash
        run: |
          set -euo pipefail
          psql "$PGURL" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO "Tenant" ("id", "name", "updatedAt")
          VALUES ('tenant-event-failure', 'Event failure', CURRENT_TIMESTAMP);
          INSERT INTO "BusinessOperationalState" ("id", "tenantId", "data", "updatedAt")
          VALUES (
            'ops-event-failure',
            'tenant-event-failure',
            '{"breaks":[{"id":"legacy-break-failure","date":"2026-10-24","workplaceId":"studio","from":"11:00","to":"11:30","createdAt":"2026-99-99T10:00:00.000Z"}]}'::jsonb,
            CURRENT_TIMESTAMP
          );
          SQL
          if psql "$PGURL" -v ON_ERROR_STOP=1 -f server/prisma/migrations/20261022180000_canonical_event/migration.sql; then
            echo 'Expected migration failure did not occur'
            exit 1
          fi
          preserved="$(psql "$PGURL" -Atqc 'SELECT CASE WHEN "data" ? '\''breaks'\'' THEN 1 ELSE 0 END FROM "BusinessOperationalState" WHERE "tenantId" = '\''tenant-event-failure'\'';')"
          event_count="$(psql "$PGURL" -Atqc 'SELECT COUNT(*) FROM "Event" WHERE "tenantId" = '\''tenant-event-failure'\'';')"
          test "$preserved" = "1"
          test "$event_count" = "0"

      - name: Remove temporary verification workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/event-migration-check.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Remove temporary Event migration verification"
          git push origin HEAD:staging
