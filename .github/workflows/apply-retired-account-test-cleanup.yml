name: Apply retired Account regression cleanup

on:
  push:
    branches: [staging]

permissions:
  contents: write

concurrency:
  group: apply-retired-account-test-cleanup-staging
  cancel-in-progress: false

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'Bootstrap retired Account regression cleanup')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Update retired Account regression expectations
        run: python3 scripts/apply-retired-account-test-cleanup.py

      - name: Validate diff
        run: git diff --check

      - name: Commit regression update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI Executor"
          git config user.email "actions@users.noreply.github.com"
          git add tests/booking-account-ui.test.mjs
          git diff --cached --check
          git commit -m "Update Account root regression expectations"
          git push origin HEAD:staging
