name: Release Evidence

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release-evidence:
    name: Release evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify evidence gate
        run: node tests/release-evidence.test.mjs
      - name: Require recorded evidence for final changed versions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-release-evidence.mjs "$BASE_SHA" "$HEAD_SHA" core
      - name: Verify generated Admin preview if changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! git diff --quiet "$BASE_SHA...$HEAD_SHA" -- admin/index.html; then
            npm install --no-save --package-lock=false esbuild@0.25.12
            node scripts/build-admin-preview.mjs
            git diff --exit-code -- admin/index.html
          fi
